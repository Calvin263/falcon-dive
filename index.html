          award({ kind: p.kind, speed: cs, air: !!SPECIES[p.kind].air, eyas: true }, priced, `Your eyas caught a ${SPECIES[p.kind].name}!`);
          e.mode = 'follow'; e.t = EYAS_REST_T; e.carry = p.kind; e.target = null;
          for (let i = 0; i < 8; i++) particles.push({ x: p.x, alt: pa, vx: (Math.random() - 0.5) * 8, vy: Math.random() * 6, life: 0.7 });
        }
      }
    } else {
      // Formation slot behind and above you; snap back if left far behind (e.g. after a long stoop)
      const gx = bird.x - dir * (14 + 9 * e.i), ga = Math.max(bird.inWater ? 10 : 3, bird.alt + 5 + 4 * e.i);
      const ex = gx - e.x, ea = ga - e.alt;
      if (Math.hypot(ex, ea) > 400) { e.x = gx - dir * 60; e.alt = ga + 20; e.vx = bird.vx; e.vy = 0; }
      const maxS = Math.max(EYAS.speed[t], bsp * 1.25 + 10);
      let tvx = (bird.inWater ? 0 : bird.vx) + ex * 1.5, tvy = (bird.inWater ? 0 : bird.vy) + ea * 1.5;
      const tl = Math.hypot(tvx, tvy);
      if (tl > maxS) { tvx *= maxS / tl; tvy *= maxS / tl; }
      e.vx += (tvx - e.vx) * Math.min(1, dt * 4); e.vy += (tvy - e.vy) * Math.min(1, dt * 4);
      if (e.t <= 0) e.carry = null;
      if (e.t <= 0 && !state.sunset) {
        let best = null, bestD = EYAS.range[t];
        for (const p of prey) {
          if (!eyasCanTake(p) || state.eyases.some(o => o.target === p)) continue;
          const dx = Math.abs(p.x - bird.x), dy = bird.alt - preyAlt(p);
          if (dx < bestD && dy < EYAS_DROP && dy > -EYAS_DROP * 0.5) { bestD = dx; best = p; }
        }
        if (best) { e.mode = 'chase'; e.t = EYAS_CHASE_T; e.target = best; }
        else e.t = 0.4;
      }
    }
    e.x += e.vx * dt; e.alt = Math.max(0.5, e.alt + e.vy * dt);
  }
}

function screech() {
  const t = tier('screech');
  if (!t || state.over || paused || state.screechCD > 0) return;
  state.screechCD = SCREECH.cool[t];
  const r = SCREECH.radius[t], f = SCREECH.freeze[t];
  state.rings.push({ x: bird.x, alt: bird.alt, t: 0, r, kind: 'screech' });
  let n = 0;
  for (const p of prey) {
    if (p.gone || p.spent || p.hidden || Math.hypot(p.x - bird.x, preyAlt(p) - bird.alt) > r) continue;
    p.frozenT = f; p.alertT = f; n++;
  }
  for (const c of state.hazards.cats) if (!c.gone && c.mode !== 'leap' && Math.hypot(c.x - bird.x, c.alt - bird.alt) < r) { c.frozenT = f; n++; }
  for (const h of state.hazards.hunters) if (!h.gone && Math.hypot(h.x - bird.x, 1.6 - bird.alt) < r) { h.frozenT = f; h.aim = 0; h.lock = 0; h.watch = 0; n++; }
  state.msg = n ? `SCREEE! ${n} frozen in fear` : 'SCREEE!'; state.msgT = 1.2; state.msgTags = null;
}

function updateFeathers(dt) {
  bird.invulnT = Math.max(0, (bird.invulnT || 0) - dt);
  state.screechCD = Math.max(0, (state.screechCD || 0) - dt);
  for (const f of state.featherFx) { f.life -= dt; f.vy -= 3 * dt; f.vx *= 0.97; f.x += f.vx * dt; f.alt += f.vy * dt; f.rot += dt * 4; }
  state.featherFx = state.featherFx.filter(f => f.life > 0);
}

// ---------- Fishing ----------
// Hit a lake steeply (descending faster than WATER_PLUNGE_VY) and you plunge in instead of crashing: the faster
// the entry, the deeper you go. Water drag bleeds off the plunge quickly; after that you swim toward the cursor
// at up to WATER_SWIM_SPEED for as long as your breath lasts, then buoyancy takes you up. Grab any fish you pass,
// or come up under a resting duck for a big bonus (nothing sees you more than SUBMERGED_HIDE m down).
const WATER_PLUNGE_VY = 3, WATER_DRAG = 5, WATER_BUOY = 3, WATER_SWIM_SPEED = 7, WATER_PADDLE = 14;
const BREATH_TIME = 7, BREATHLESS_BUOY = 16, SUBMERGED_HIDE = 1, DUCK_BELOW_REACH = 2.2, DUCK_SPLASH_R = 35;
const WATER_EXIT_SPEED = STALL_SPEED + 4, WET_TIME = 2.5, FISH_REACH = 1.6, FISH_SPOOK = 25;

function makeFish(l, kind) {
  const s = SPECIES[kind], dmax = Math.min(s.depth[1], l.depth - 0.6);
  const d = s.depth[0] + Math.random() * (dmax - s.depth[0]);
  return { kind, lake: l, x: l.x0 + 4 + Math.random() * (l.w - 8), alt: -d, tAlt: -d, vx: randDir() * s.speed,
           ph: Math.random() * 10, fleeT: 0, riseT: 0, wanderT: 2 + Math.random() * 5, spooked: false };
}

function splashAt(x, l) {
  for (let i = 0; i < 30; i++) particles.push({ x: x + (Math.random() - 0.5) * 3, alt: 0.2, vx: (Math.random() - 0.5) * 16, vy: 4 + Math.random() * 12, life: 1 });
  for (const f of state.fish) {
    if (f.lake.x0 !== l.x0 || Math.abs(f.x - x) > FISH_SPOOK) continue;
    f.fleeT = 2.5; f.riseT = 0; f.spooked = true;
    f.vx = Math.sign(f.x - x || 1) * SPECIES[f.kind].dart;
    f.tAlt = -Math.min(SPECIES[f.kind].depth[1], l.depth - 0.6);
  }
  // Resting ducks on the lake take off at the splash
  for (const p of prey) if (p.sitting && p.lake && p.lake.x0 === l.x0 && Math.abs(p.x - x) < DUCK_SPLASH_R) duckTakeOff(p);
}

function updateFish(dt) {
  for (const f of state.fish) {
    const s = SPECIES[f.kind], l = f.lake, floor = -(l.depth - 0.5);
    f.ph += dt;
    if (f.fleeT > 0) {
      f.fleeT -= dt;
      if (f.fleeT <= 0) f.vx = Math.sign(f.vx) * s.speed;
    } else {
      f.wanderT -= dt;
      if (f.wanderT <= 0) {
        f.wanderT = 3 + Math.random() * 6;
        if (Math.random() < 0.3) f.vx = -f.vx;
        // Trout now and then rise to feed just under the surface, where they're easy to see and reach
        if (f.kind === 'trout' && Math.random() < 0.4) { f.riseT = 3 + Math.random() * 4; f.tAlt = -0.4; }
        else f.tAlt = -(s.depth[0] + Math.random() * (Math.min(s.depth[1], l.depth - 0.6) - s.depth[0]));
      }
      if (f.riseT > 0 && (f.riseT -= dt) <= 0) f.wanderT = 0;
      // A low shadow passing over sends a shallow fish down
      if (bird.alt > 0 && bird.alt < 25 && Math.abs(bird.x + shadowOffset(bird.alt) - f.x) < 6 && f.alt > -1.5) {
        f.riseT = 0; f.tAlt = -Math.min(s.depth[1], l.depth - 0.6); f.wanderT = 4;
      }
    }
    f.x += f.vx * dt;
    if (f.x < l.x0 + 2 || f.x > l.x0 + l.w - 2) { f.x = clamp(f.x, l.x0 + 2, l.x0 + l.w - 2); f.vx = -f.vx; }
    f.alt += clamp(f.tAlt - f.alt, -1, 1) * dt * (f.fleeT > 0 ? 3 : 1.2);
    f.alt = clamp(f.alt, floor, -0.3);
    // Grab: swept from last frame so a fast plunge can't skip past a fish
    if (bird.inWater && !bird.carrying && sweptDist(f.x, f.alt, dt) < FISH_REACH * STATS.airReach[tier('talons')]) {
      f.gone = true;
      const priced = priceCatch(f.kind, { speed: bird.entrySpeed, unseen: !f.spooked });
      award({ kind: f.kind, speed: bird.entrySpeed, water: true, depth: -f.alt }, priced, `${s.name}! (${(-f.alt).toFixed(1)} m deep)`);
    }
  }
  state.fish = state.fish.filter(f => !f.gone);
}

// Coming up under a duck resting on the lake: grab it from below
function catchDuckFromBelow(l, dt) {
  if (bird.carrying || bird.vy <= 0) return;
  for (const p of prey) {
    if (!p.sitting || p.gone || !p.lake || p.lake.x0 !== l.x0) continue;
    if (sweptDist(p.x, 0, dt) > DUCK_BELOW_REACH * STATS.airReach[tier('talons')]) continue;
    p.gone = true;
    const priced = priceCatch(p.kind, { below: true, unseen: !p.noticed });
    award({ kind: p.kind, speed: bird.speed, water: true, below: true }, priced, `Ambush from below! ${SPECIES[p.kind].name}`);
    state.msgT = 2.5;
    // The rest of the raft scatters
    for (const q of prey) if (q.sitting && q.lake && q.lake.x0 === l.x0 && Math.abs(q.x - p.x) < DUCK_SPLASH_R) duckTakeOff(q);
    for (let i = 0; i < 14; i++) particles.push({ x: p.x, alt: 0.4, vx: (Math.random() - 0.5) * 8, vy: 2 + Math.random() * 6, life: 0.8 });
    return;
  }
}

function spawnHazards() {
  const hz = state.hazards, dg = danger();
  const ci = Math.floor(bird.x / CAT_CELL);
  for (let i = ci - 8; i <= ci + 8; i++) {
    if (hz.seen.has('c' + i)) continue;
    hz.seen.add('c' + i);
    const x = (i + 0.2 + Math.random() * 0.6) * CAT_CELL;
    if (Math.random() > 0.15 + 0.2 * dg || Math.abs(x) < 250 || lakeAtX(x)) continue;
    hz.cats.push({ x, alt: 0, vx: 0, vy: 0, mode: 'hide', t: 0, dir: randDir(), alertT: 0 });
  }
  if (state.day >= HUNTER_FROM_DAY) {
    const hi = Math.floor(bird.x / HUNTER_CELL);
    for (let i = hi - 2; i <= hi + 2; i++) {
      if (hz.seen.has('h' + i)) continue;
      hz.seen.add('h' + i);
      const x = (i + 0.2 + Math.random() * 0.6) * HUNTER_CELL;
      if (Math.random() > 0.3 + 0.35 * dg || Math.abs(x) < 400 || lakeAtX(x)) continue;
      hz.hunters.push({ x, lock: 0, reload: 0, flash: 0, ax: x, aalt: 30, tracking: false, aim: 0, tracer: 0 });
    }
  }
  hz.cats = hz.cats.filter(c => !c.gone && Math.abs(c.x - bird.x) < 3000);
  hz.hunters = hz.hunters.filter(h => !h.gone && Math.abs(h.x - bird.x) < 3000);
}

function updateCat(c, dt) {
  c.t -= dt; c.alertT -= dt;
  const dx = bird.x - c.x;
  if (c.mode === 'hide') {
    c.dir = Math.sign(dx) || c.dir;
    // Stalk: creep through the grass toward a bird flying low nearby
    c.stalk = Math.abs(dx) < CAT_STALK_DIST && bird.alt < CAT_STALK_ALT && Math.abs(dx) > 4;
    if (c.stalk && !lakeAtX(c.x + Math.sign(dx) * CAT_STALK_SPEED * dt * 4)) c.x += Math.sign(dx) * CAT_STALK_SPEED * dt;
    if (c.t <= 0 && Math.abs(dx) < CAT_REACH && bird.alt < CAT_ALT) {
      c.mode = 'crouch'; c.t = 0.12; c.dir = Math.sign(dx) || 1; c.alertT = 0.8;
    }
  } else if (c.mode === 'crouch') {
    if (c.t <= 0) {
      // Leap at where the bird will be; the flight time scales with distance so far/high leaps still connect
      const px = bird.x + bird.vx * CAT_LEAP_T, pa = Math.max(0, bird.alt + bird.vy * CAT_LEAP_T);
      const T = clamp(Math.hypot(px - c.x, pa) / 30, 0.3, 0.7);
      const tx = bird.x + bird.vx * T, ta = Math.max(0, bird.alt + bird.vy * T);
      c.vx = clamp((tx - c.x) / T, -CAT_LEAP_MAX, CAT_LEAP_MAX);
      c.vy = Math.min(CAT_LEAP_VY, (ta + 0.5 * G * T * T) / T);
      c.dir = Math.sign(c.vx) || c.dir;
      c.mode = 'leap';
    }
  } else if (c.mode === 'leap') {
    c.vy -= G * dt; c.x += c.vx * dt; c.alt += c.vy * dt;
    if (sweptDist(c.x, c.alt, dt) < CAT_HIT) killBird('cat', 'A cat pounced from the grass!');
    if (c.alt <= 0) { c.alt = 0; c.vx = 0; c.mode = 'sit'; c.t = 1.5; }
  } else if (c.mode === 'sit' && c.t <= 0) {
    c.mode = 'hide'; c.t = 1;
  }
}

// The hunter's aim trails the bird; fly slowly in range and the lock builds. Then it shoulders the rifle,
// leads your flight and shows its line for HUNTER_AIM_T before firing: change course or die
function updateHunter(h, dt) {
  h.reload -= dt; h.flash -= dt; h.tracer -= dt;
  if (h.aim) {
    h.aim -= dt;
    if (h.aim <= 0) fireHunter(h);
    return;
  }
  const d = Math.hypot(bird.x - h.x, bird.alt - 1.6);
  const sees = d < HUNTER_RANGE && bird.alt < HUNTER_SEE_ALT && !insideCloud(bird.x, bird.alt) && !bird.inWater;
  if (!sees) {
    h.tracking = false;
    h.lock = Math.max(0, h.lock - dt);
    h.watch = 0;
    return;
  }
  if (!h.tracking) {
    h.tracking = true;
    h.ax = bird.x - bird.vx * 0.6; h.aalt = bird.alt - bird.vy * 0.6;
  }
  const k = Math.min(1, dt * HUNTER_TRACK);
  h.ax += (bird.x - h.ax) * k; h.aalt += (bird.alt - h.aalt) * k;
  const err = Math.hypot(bird.x - h.ax, bird.alt - h.aalt);
  h.watch = (h.watch || 0) + dt;
  if (h.reload > 0) return;
  if (err < HUNTER_LOCK_DIST) h.lock += dt / hunterLockTime();
  else h.lock = Math.max(0, h.lock - dt * 0.7);
  if (h.lock >= 1 || h.watch >= hunterSnapTime()) {
    // Lead the bird to where it will be when the shot goes off. A clean lock leads perfectly; a snap shot
    // under-leads and scatters, so steady fast flight is often missed but never safe
    const snap = h.lock < 1, lead = HUNTER_AIM_T * (snap ? HUNTER_SNAP_LEAD + 0.15 * danger() : 1);
    const spread = snap ? HUNTER_SNAP_SPREAD : 0;
    h.lock = 0; h.watch = 0; h.aim = HUNTER_AIM_T;
    h.ax = bird.x + bird.vx * lead + (Math.random() - 0.5) * 2 * spread;
    h.aalt = Math.max(0.5, bird.alt + bird.vy * lead + (Math.random() - 0.5) * 2 * spread);
  }
}

function fireHunter(h) {
  h.aim = 0; h.reload = HUNTER_RELOAD; h.flash = 0.15; h.tracer = 0.3;
  state.rings.push({ x: h.x, alt: 1.6, t: 0, r: 60, kind: 'shot' });
  // Gunfire sends nearby prey running
  for (const p of prey) {
    if (p.gone || p.spent || Math.abs(p.x - h.x) > 120) continue;
    if (SPECIES[p.kind].air) spookAir(p); else { p.fleeing = true; p.alertT = 1; }
  }
  const ux0 = h.ax - h.x, uy0 = h.aalt - 1.6, len = Math.hypot(ux0, uy0) || 1, ux = ux0 / len, uy = uy0 / len;
  const px = bird.x - h.x, py = bird.alt - 1.6;
  const along = px * ux + py * uy, off = Math.abs(px * uy - py * ux);
  if (along > 0 && off < HUNTER_HIT && !insideCloud(bird.x, bird.alt) && !bird.inWater) killBird('hunter', 'Shot by a hunter!');
  else { state.msg = 'A shot whizzed past!'; state.msgT = 2; }
}

function spawnHawk() {
  const side = randDir(), hz = state.hazards;
  hz.hawk = { x: bird.x - side * 220, alt: Math.min(MAX_ALT, bird.alt + 90), vx: side * 25, vy: 0,
              mode: 'stalk', t: 4 + Math.random() * 2, attacks: 0, flapT: 0, alertT: 0, minD: Infinity };
  state.msg = 'A goshawk is hunting you!'; state.msgT = 2.5;
}

function updateHawk(h, dt) {
  h.t -= dt; h.flapT += dt * 7; h.alertT -= dt;
  const dx = bird.x - h.x, dy = bird.alt - h.alt, d = Math.hypot(dx, dy);
  const steer = (tx, ty, speed, rate) => {
    const len = Math.hypot(tx, ty) || 1;
    h.vx += (tx / len * speed - h.vx) * Math.min(1, dt * rate);
    h.vy += (ty / len * speed - h.vy) * Math.min(1, dt * rate);
  };
  const hidden = insideCloud(bird.x, bird.alt) || !!bird.inWater;
  const bsp = Math.hypot(bird.vx, bird.vy);
  if (h.mode === 'stalk') {
    // Shadow the bird from above and behind, keeping pace however fast it flies
    const back = -(Math.sign(bird.vx) || 1) * 40;
    const gx = bird.x + back - h.x, gy = Math.min(MAX_ALT, bird.alt + 35) - h.alt;
    steer(gx, gy, Math.max(32, bsp + Math.min(30, Math.hypot(gx, gy) * 0.4)), 3);
    if (h.t <= 0 && !hidden && d < HAWK_STOOP_DIST) {
      h.mode = 'stoop'; h.t = 5; h.minD = Infinity; h.alertT = 0.9;
      state.msg = 'The goshawk is stooping — break away at the last moment!'; state.msgT = 2;
      const len = d || 1, s0 = Math.max(HAWK_SPEED * 0.8, bsp + 10);
      h.vx = dx / len * s0; h.vy = dy / len * s0;
    }
  } else if (h.mode === 'stoop') {
    // Steers toward a lead point until HAWK_COMMIT m out, then commits to a straight strike line:
    // a hard turn, dive or brake after that makes it overshoot; jinking too early just lets it re-aim
    const top = Math.max(HAWK_SPEED + 10 * danger(), bsp + 25);
    let sp = Math.min(top, Math.hypot(h.vx, h.vy) + dt * HAWK_ACCEL);
    if (!h.commit) {
      const lead = d / Math.max(1, sp - bsp * 0.3);
      const lx = bird.x + bird.vx * lead - h.x, ly = bird.alt + bird.vy * lead - h.alt;
      const cur = Math.atan2(h.vy, h.vx), want = Math.atan2(ly, lx);
      const turn = (HAWK_TURN + 0.6 * danger()) * dt;
      const ang = cur + clamp(wrapAngle(want - cur), -turn, turn);
      h.vx = Math.cos(ang) * sp; h.vy = Math.sin(ang) * sp;
      if (d < HAWK_COMMIT) {
        // Commit: lock the exact intercept of your current flight line
        h.commit = true; h.alertT = 0.6;
        let ix = bird.x, ia = bird.alt;
        for (let k = 0; k < 4; k++) {
          const tt = Math.hypot(ix - h.x, ia - h.alt) / sp;
          ix = bird.x + bird.vx * tt; ia = bird.alt + bird.vy * tt;
        }
        const len = Math.hypot(ix - h.x, ia - h.alt) || 1;
        h.vx = (ix - h.x) / len * sp; h.vy = (ia - h.alt) / len * sp; h.csp = sp;
      }
    } else {
      const len = Math.hypot(h.vx, h.vy) || 1;
      h.vx = h.vx / len * h.csp; h.vy = h.vy / len * h.csp;
    }
    if (!hidden && (sweptDist(h.x + h.vx * dt, h.alt + h.vy * dt, dt) < HAWK_HIT || d < HAWK_HIT)) {
      killBird('hawk', 'Taken by a goshawk!');
      return;
    }
    h.minD = Math.min(h.minD, d);
    if (h.t <= 0 || hidden || (h.minD < 40 && d > h.minD + 12)) {
      h.mode = 'recover'; h.t = 2; h.attacks++; h.commit = false;
      if (!hidden) { state.msg = 'The goshawk missed!'; state.msgT = 1.5; }
    }
  } else if (h.mode === 'recover') {
    steer(h.vx, Math.abs(h.vx) * 0.6 + 10, 30, 1.5);
    if (h.t <= 0) {
      if (h.attacks < 3 + Math.round(danger())) { h.mode = 'stalk'; h.t = 1.5 + Math.random() * 1.5; }
      else { h.mode = 'leave'; state.msg = 'The goshawk gave up'; state.msgT = 1.5; }
    }
  } else {
    steer(-dx, 40, 30, 1);
    if (d > 700) state.hazards.hawk = null;
  }
  h.x += h.vx * dt; h.alt = Math.max(3, h.alt + h.vy * dt);
}

function updateHazards(dt) {
  const hz = state.hazards;
  spawnHazards();
  for (const c of hz.cats) { if (c.frozenT > 0) { c.frozenT -= dt; continue; } updateCat(c, dt); if (state.over) return; }
  for (const h of hz.hunters) { if (h.frozenT > 0) { h.frozenT -= dt; continue; } updateHunter(h, dt); if (state.over) return; }
  if (state.day >= HAWK_FROM_DAY && !hz.hawk && !state.sunset) {
    hz.hawkT -= dt;
    if (hz.hawkT <= 0) { spawnHawk(); hz.hawkT = 60 - 30 * danger() + Math.random() * 20; }
  }
  if (hz.hawk) updateHawk(hz.hawk, dt);
}

function wrapAngle(a) {
  while (a > Math.PI) a -= 2 * Math.PI;
  while (a < -Math.PI) a += 2 * Math.PI;
  return a;
}

// ---------- Coordinate helpers ----------
const toScreenX = x => W / 2 + (x - cam.x) * cam.zoom;
const toScreenY = alt => H / 2 - (alt - cam.alt) * cam.zoomY;

// Freeze the bird's current screen position; the camera then zooms/reframes around it (see the camera update)
function holdCamera() {
  const sx = clamp(toScreenX(bird.x), W * 0.15, W * 0.85);
  const sy = clamp(toScreenY(bird.alt), VIEW_MARGIN, H - groundPx() - 10);
  cam.pin = { sx, sy, k: 1, hold: 0.6 };
}

// ---------- Update ----------
function updateParticles(dt) {
  for (const pt of particles) {
    pt.x += pt.vx * dt; pt.alt += pt.vy * dt; pt.vy -= G * dt * 0.5; pt.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function updateCrash(dt) {
  const crash = state.crash;
  crash.t += dt;
  for (const puff of crash.smoke) {
    puff.x += puff.vx * dt;
    puff.alt += puff.vy * dt;
    puff.vx *= Math.exp(-dt * 1.5);
    puff.radius += dt * 5;
    puff.life -= dt;
  }
  crash.smoke = crash.smoke.filter(puff => puff.life > 0);
  updateParticles(dt);
}

function update(dt) {
  if (paused || screen !== 'hunt') return;
  if (state.over) {
    state.overT += dt;
    if (state.crash) updateCrash(dt);
    // Linger on the crash or sunset for a moment, then show the day's recap
    if (state.overT > (state.crash ? CRASH_REVEAL_DELAY + 2 : 2.5)) showRecap();
    return;
  }

  // Steering: turn toward the mouse (relative to the lens when the bird is above the screen)
  const { x: bx, y: by } = birdAnchor();
  // Convert screen direction to world direction (vertical axis may be compressed)
  const hold = gunAimHeld() && mouse.steer;
  const smx = hold ? bx + mouse.steer.dx : mouse.x, smy = hold ? by + mouse.steer.dy : mouse.y;
  const target = Math.atan2((by - smy) / cam.zoomY, (smx - bx) / cam.zoom); // up = positive
  // Effort 0..1: how far the mouse is toward the screen edge in that direction, so every heading
  // (including straight down) can reach full effort, not just the far corners
  const mdx = smx - bx, mdy = smy - by;
  const mouseDist = Math.hypot(mdx, mdy);
  let edgeDist = Infinity;
  if (mouseDist > 0) {
    const ux = mdx / mouseDist, uy = mdy / mouseDist;
    if (ux > 0) edgeDist = Math.min(edgeDist, (W - bx) / ux);
    if (ux < 0) edgeDist = Math.min(edgeDist, -bx / ux);
    if (uy > 0) edgeDist = Math.min(edgeDist, (H - by) / uy);
    if (uy < 0) edgeDist = Math.min(edgeDist, -by / uy);
  }
  const fullEffortDist = Math.max(40, Math.min(edgeDist * 0.8, Math.min(W, H) * 0.4));
  const effort = Math.max(0.15, Math.min(1, mouseDist / fullEffortDist));
  bird.effort = effort;
  const pointingDown = bird.angle < -0.35;
  // Mouse well above the bird = flap automatically (with hysteresis so shallow climbs can glide);
  // holding the button always brakes
  const braking = mouse.down && !bird.brakeLocked && !bird.inWater;
  if (braking) {
    bird.brakeE = Math.max(0, bird.brakeE - dt / brakeDuration());
    if (bird.brakeE === 0) bird.brakeLocked = true;
  } else {
    bird.brakeE = Math.min(1, bird.brakeE + dt / brakeRecharge());
    if (bird.brakeLocked && bird.brakeE >= BRAKE_UNLOCK) bird.brakeLocked = false;
  }
  const flapOn = bird.mode === 'FLAP' ? 0.3 : 0.45;
  const flapping = !braking && target > flapOn && target < Math.PI - flapOn;
  const diving = !braking && bird.speed > DIVE_SPEED && pointingDown;
  // Tucking only pays off level or descending; it fades out by ~15° nose-up
  const tuck = effort * Math.max(0, Math.min(1, (0.25 - bird.angle) / 0.25));
  bird.tuck = tuck;

  // Turn rate falls off steeply with speed; braking restores agility
  let turnRate = Math.min(3, Math.max(0.25, 3 * Math.pow(22 / Math.max(bird.speed, 22), 1.6)));
  if (!braking && !flapping) turnRate *= 1.3 - tuck * 0.5; // tucked wings turn worse
  if (braking) turnRate *= 4;
  // Ground effect: easier to level out when close to the ground
  if (bird.alt < 25 && bird.angle < 0) turnRate *= 2;
  turnRate *= STATS.agility[tier('agility')];

  let dragK = braking ? BRAKE_DRAG : dragBase() * (1.6 - tuck * 0.8);
  if (bird.carrying) dragK *= 1.3;
  let sink = 0;
  if (bird.inWater) {
    // Underwater: heavy drag bleeds off the plunge, then you paddle toward the cursor while your breath lasts;
    // buoyancy is mild until you run out of air, then it carries you up
    let wvx = Math.cos(bird.angle) * bird.speed, wvy = Math.sin(bird.angle) * bird.speed;
    bird.breath = Math.max(0, (bird.breath ?? BREATH_TIME) - dt);
    const sp0 = Math.hypot(wvx, wvy);
    if (sp0 > WATER_SWIM_SPEED) {
      const k = Math.max(WATER_SWIM_SPEED / sp0, Math.exp(-WATER_DRAG * dt));
      wvx *= k; wvy *= k;
    }
    if (bird.breath > 0) {
      const sw = WATER_SWIM_SPEED * effort, dvx = Math.cos(target) * sw - wvx, dvy = Math.sin(target) * sw - wvy;
      const dv = Math.hypot(dvx, dvy), a = Math.min(dv, WATER_PADDLE * dt);
      if (dv > 0) { wvx += dvx / dv * a; wvy += dvy / dv * a; }
      wvy += WATER_BUOY * dt;
    } else {
      wvx *= Math.exp(-2 * dt);
      wvy += BREATHLESS_BUOY * dt;
    }
    bird.speed = Math.max(0.3, Math.hypot(wvx, wvy));
    bird.angle = Math.atan2(wvy, wvx);
  } else if (bird.alt > MAX_ALT) {
    // Above the ceiling: free flight under gravity, and the bird turns to face its velocity
    let bvx = Math.cos(bird.angle) * bird.speed, bvy = Math.sin(bird.angle) * bird.speed;
    bvy -= G * dt;
    const keep = 1 - Math.min(1, dragK * ABOVE_CEILING_DRAG * bird.speed * dt);
    bvx *= keep; bvy *= keep;
    bird.speed = Math.max(0.5, Math.hypot(bvx, bvy));
    bird.angle = Math.atan2(bvy, bvx);
  } else {
    const diff = wrapAngle(target - bird.angle);
    bird.angle = wrapAngle(bird.angle + Math.sign(diff) * Math.min(Math.abs(diff), turnRate * dt));

    // Along-path physics
    let accel = -G * Math.sin(bird.angle);           // gravity along heading
    accel -= dragK * bird.speed * bird.speed;
    const thinAir = Math.max(0, Math.min(1, (MAX_ALT - bird.alt) / 50));
    // Climbing steeply: weaker net thrust and a lower speed ceiling
    const climb = Math.max(0, Math.sin(bird.angle));
    const flapMax = flapMaxSpeed() - 20 * climb;
    if (flapping && bird.speed < flapMax) {
      const taper = Math.min(1, (flapMax - bird.speed) / 5);
      accel += flapThrust() * (1 - 0.4 * climb) * (0.4 + 0.6 * effort) * thinAir * taper * (bird.carrying ? 0.6 : 1) * (bird.wetT > 0 ? 0.6 : 1);
    }
    bird.speed = Math.max(2, bird.speed + accel * dt);

    // Stall: sink when too slow; a carried turtle adds weight
    if (bird.speed < STALL_SPEED) sink = (STALL_SPEED - bird.speed) * 1.2;
    if (bird.carrying) sink += 1.5;
  }

  // Air-relative velocity plus wind and thermal lift gives ground velocity
  const vx = Math.cos(bird.angle) * bird.speed;
  const vy = Math.sin(bird.angle) * bird.speed - sink;
  updateWind(dt);
  const gvx = vx + (bird.inWater ? 0 : windX(bird.alt)), gvy = vy + (bird.inWater ? 0 : updraft(bird.x, bird.alt));
  bird.x += gvx * dt;
  bird.alt += gvy * dt;

  bird.mode = bird.inWater ? 'UNDERWATER' : braking ? 'BRAKE' : diving ? 'DIVE' : flapping ? 'FLAP' : bird.speed < STALL_SPEED ? 'STALL' : 'GLIDE';
  if (bird.wetT > 0) bird.wetT -= dt;
  updateHearingRange(dt);
  const prevBeat = Math.floor(bird.flapT / (Math.PI * 2));
  bird.flapT += dt * (flapping ? 14 : 0);
  // Sound rings: one per wingbeat while flapping, a steady hiss while braking, wind roar in a fast dive
  state.ringT = (state.ringT || 0) - dt;
  const roar = !flapping && !braking && diveNoise() > 12;
  if ((flapping && Math.floor(bird.flapT / (Math.PI * 2)) !== prevBeat) || ((braking || roar) && state.ringT <= 0)) {
    state.rings.push({ x: bird.x, alt: bird.alt, t: 0, r: hearingRange(), kind: flapping ? 'flap' : braking ? 'brake' : 'wind' });
    state.ringT = roar ? 0.25 : 0.35;
  }
  bird.vx = gvx; bird.vy = gvy;
  state.maxSpeed = Math.max(state.maxSpeed, bird.speed);

  if (braking && bird.speed > 25 && Math.random() < 0.5) {
    particles.push({ x: bird.x, alt: bird.alt, vx: -vx * 0.1, vy: -vy * 0.1, life: 0.6 });
  }

  // Water: plunge in when coming down steeply, float back up and burst out
  const lake = bird.inWater || (bird.alt <= 0 && -bird.vy > WATER_PLUNGE_VY ? lakeAtX(bird.x) : null);
  if (lake) {
    if (!bird.inWater) {
      bird.inWater = lake; bird.entrySpeed = bird.speed; bird.breath = BREATH_TIME;
      splashAt(bird.x, lake);
      cam.shake = 0;
    }
    bird.x = clamp(bird.x, lake.x0 + 0.5, lake.x0 + lake.w - 0.5);
    if (bird.alt < -(lake.depth - 0.4)) {
      // Lake bed: stop going down
      bird.alt = -(lake.depth - 0.4);
      const wvx = Math.cos(bird.angle) * bird.speed, wvy = Math.max(0, Math.sin(bird.angle) * bird.speed);
      bird.speed = Math.max(0.3, Math.hypot(wvx, wvy)); bird.angle = Math.atan2(wvy, wvx);
    }
    if (bird.alt > -1.5) catchDuckFromBelow(lake, dt);
    if (bird.alt >= 0) {
      bird.inWater = null;
      bird.alt = 0.1;
      bird.speed = Math.max(bird.speed, WATER_EXIT_SPEED);
      bird.angle = Math.cos(bird.angle) >= 0 ? 0.5 : Math.PI - 0.5;
      bird.wetT = WET_TIME;
      for (let i = 0; i < 18; i++) particles.push({ x: bird.x, alt: 0.3, vx: (Math.random() - 0.5) * 10, vy: 2 + Math.random() * 8, life: 0.8 });
    }
  }
  // Ground contact (a shallow touch on a lake just skims, like the ground)
  if (!bird.inWater && bird.alt <= 0) {
    if (-bird.vy > SAFE_VSPEED) {
      state.crash = {
        t: 0,
        smoke: Array.from({ length: 18 }, () => {
          const life = 1.8 + Math.random() * 0.7;
          return { x: bird.x + (Math.random() - 0.5) * 5, alt: 1 + Math.random() * 2,
                   vx: (Math.random() - 0.5) * 14, vy: 5 + Math.random() * 10,
                   radius: 2 + Math.random() * 4, life, maxLife: life };
        })
      };
      endDay('crash');
      state.msg = `CRASHED at ${(bird.speed * 3.6).toFixed(0)} km/h — the hunt is over for today`;
      for (let i = 0; i < 40; i++) particles.push({
        x: bird.x, alt: 0, vx: (Math.random() - 0.5) * 30, vy: Math.random() * 20, life: 1.5
      });
      bird.alt = 0;
      return;
    }
    bird.alt = 0;
    if (bird.angle < 0) bird.angle = 0; // skim along the ground
  }

  state.time += dt;
  // Day clock: warn at dusk; at sunset let any falling turtles land, then end the day
  const hour = huntHour();
  if (!state.duskWarned && hour >= DUSK_WARN_HOUR) {
    state.duskWarned = true;
    state.msg = 'The sun is setting — 30 minutes of hunting left'; state.msgT = 3;
  }
  if (!state.sunset && hour >= DAY_END_HOUR) {
    state.sunset = true;
    bird.carrying = null;
    state.msg = 'Sunset — the hunt is over'; state.msgT = 3;
  }
  if (state.sunset && !state.fallers.length) {
    endDay('sunset');
    state.msg = 'Sunset — the hunt is over';
    return;
  }
  state.fog += ((insideCloud(bird.x, bird.alt) ? 1 : 0) - state.fog) * Math.min(1, dt * 3);
  // Lowest altitude in the current low pass; resets once you climb away
  bird.passMin = bird.alt > 30 ? Infinity : Math.min(bird.passMin, bird.alt);

  // Wake samples that push the grass aside behind a low-flying bird
  state.wakeT -= dt;
  if (bird.alt < 6 && state.wakeT <= 0) {
    state.wake.push({ x: bird.x, t: state.time, s: (1 - bird.alt / 6) * Math.min(1, bird.speed / 20) });
    state.wakeT = 0.04;
  }
  state.wake = state.wake.filter(w => state.time - w.t < 1.5);

  // Prey
  for (const p of prey) {
    if (p.frozenT > 0) {
      // Screeched: frozen in place (fliers just flutter along slowly); can still be caught
      p.frozenT -= dt;
      if (SPECIES[p.kind].air && !p.sitting) p.x += (p.vx || 0) * 0.15 * dt;
      p.curVx = 0;
      if (!bird.carrying && !bird.inWater && !p.gone) checkCatch(p, dt);
      continue;
    }
    if (SPECIES[p.kind].air) updateAirPrey(p, dt); else updateGroundPrey(p, dt);
    updateTurn(p, dt);
    p.flyT = SPECIES[p.kind].air && !p.sitting ? (p.flyT ?? 0) + dt : 0;
    if (SENSES[p.kind]) updateLook(p, dt);
    p.alertT -= dt;
    if (!bird.carrying && !bird.inWater && !p.gone) checkCatch(p, dt);
  }
  if (!bird.carrying && mouse.aiming && mouse.talonTarget) {
    grabFallingTurtle(mouse.talonTarget, dt);
  }
  updateFallers(dt);
  updateGuns(dt);
  updateFish(dt);
  updateEyases(dt);
  updateFeathers(dt);
  updateWeather(dt);
  updateRivals(dt);
  updateHazards(dt);
  if (state.over) return;
  spawnPreyAhead();

  // Particles
  updateParticles(dt);
  for (const r of state.rings) r.t += dt;
  state.rings = state.rings.filter(r => r.t < 0.8);
  state.msgT -= dt;
  if (state.toast) state.toast.t -= dt;

  // Camera: centred on the bird with a small lead along its velocity. The view height grows with speed and
  // altitude (CAMERA_VIEW), so it isn't tied to keeping the ground on screen.
  const viewH = clamp(CAMERA_VIEW.base + CAMERA_VIEW.perSpeed * bird.speed + CAMERA_VIEW.perAlt * bird.alt,
                      CAMERA_VIEW.base, CAMERA_VIEW.max);
  const baseZoom = groundFitZoom(H / viewH);
  if (!Number.isFinite(cam.gz)) cam.gz = baseZoom;
  cam.gz += (baseZoom - cam.gz) * Math.min(1, dt * 1.5);
  const lead = (v, span) => clamp(v / 50, -1, 1) * span * 0.12 / cam.gz;
  let zoom = cam.gz, zoomY = cam.gz;
  let camX = bird.x + lead(bird.vx, W), camAlt = bird.alt + lead(bird.vy, H);
  // Soft ground framing: pull the view down so the ground sits on the bottom band, as long as the bird stays
  // at least GROUND_FRAME.top from the top of the screen; blended at GROUND_FRAME.stick (not a hard rule).
  // Fades out once the ground is too far below to bring into view.
  const floorAlt = (H / 2 - groundPx()) / zoomY, maxShift = H * (0.5 - GROUND_FRAME.top) / zoomY;
  const groundAlt = Math.max(floorAlt, bird.alt - maxShift);
  const reach = clamp(GROUND_FRAME.fade - (camAlt - floorAlt) / maxShift, 0, 1);
  camAlt = lerp(camAlt, Math.min(camAlt, groundAlt), GROUND_FRAME.stick * reach);

  // Air chase: frame the bird and ONE locked flying target. Only birds that have been airborne for a moment
  // and are roughly ahead of you qualify, and the lock is kept until lost, so flocks of ducks (or ducks
  // taking off) don't yank the framing around.
  const distTo = p => Math.hypot(p.x - bird.x, p.alt - bird.alt);
  const aheadCos = p => {
    const d = distTo(p), v = Math.max(1, bird.speed);
    return d < 1 ? 1 : ((p.x - bird.x) * bird.vx + (p.alt - bird.alt) * bird.vy) / (d * v);
  };
  const airOk = p => p && SPECIES[p.kind].air && !p.gone && !p.spent && !p.sitting && (p.flyT ?? 0) > CHASE_MIN_FLY;
  const prevLock = cam.lock;
  let lock = airOk(prevLock) && distTo(prevLock) < AIR_FOCUS_DIST * 1.2 && aheadCos(prevLock) > -0.2 ? prevLock : null;
  if (!lock) {
    let bd = AIR_FOCUS_DIST;
    for (const p of prey) {
      if (!airOk(p) || aheadCos(p) < 0.6) continue;
      const d = distTo(p);
      if (d < bd) { bd = d; lock = p; }
    }
  }
  cam.lock = lock;
  // Losing the target (usually a catch) would reframe the shot; pin the bird on screen instead
  if (prevLock && lock !== prevLock && cam.focus > 0.1) holdCamera();
  const td = lock ? distTo(lock) : Infinity;
  const want = lock ? Math.min(1, (AIR_FOCUS_DIST - td) / 30) : 0;
  cam.focus += (want - cam.focus) * Math.min(1, dt * (want > cam.focus ? 1.5 : 1));
  cam.tgt = want > 0 ? lock : null;
  if (lock) {
    // Frame closer to the bird than the target so the falcon stays near the centre
    const ox = (lock.x - bird.x) * 0.35, oalt = (lock.alt - bird.alt) * 0.35;
    const spread = td * 0.65 + (lock.kind === 'flock' ? 15 : 0);
    const k = Math.min(1, dt * 3);
    if (!cam.ft) cam.ft = { ox, oalt, r: spread };
    cam.ft.ox += (ox - cam.ft.ox) * k; cam.ft.oalt += (oalt - cam.ft.oalt) * k; cam.ft.r += (spread - cam.ft.r) * k;
  }
  if (cam.focus > 0.001 && cam.ft) {
    const az = Math.min(CHASE_ZOOM_MAX * baseZoom, 10, (Math.min(W, H) * 0.15) / Math.max(cam.ft.r * 2, 6));
    const f = cam.focus;
    zoom = lerp(zoom, Math.max(zoom, az), f); zoomY = zoom;
    camX = lerp(camX, bird.x + cam.ft.ox, f);
    camAlt = lerp(camAlt, bird.alt + cam.ft.oalt, f);
  }
  // Framing is smoothed as an offset from the bird, so the bird's own motion never lags on screen
  if (!Number.isFinite(cam.ox)) { cam.ox = camX - bird.x; cam.oa = camAlt - bird.alt; }
  const ks = Math.min(1, dt * 3);
  cam.ox += (camX - bird.x - cam.ox) * ks;
  cam.oa += (camAlt - bird.alt - cam.oa) * ks;
  let cx = bird.x + cam.ox, ca = bird.alt + cam.oa;
  // Camera pin: keep the bird at the same screen spot (zooming around it) so the mouse still points the
  // same way; after a short hold, ease back to the normal framing over ~2 s
  if (cam.pin) {
    const pin = cam.pin;
    pin.hold -= dt;
    if (pin.hold <= 0) pin.k -= dt * 0.4;
    if (pin.k <= 0) cam.pin = null;
    else {
      const pinK = pin.k * pin.k * (3 - 2 * pin.k);
      cx = lerp(cx, bird.x - (pin.sx - W / 2) / zoom, pinK);
      ca = lerp(ca, bird.alt - (H / 2 - pin.sy) / zoomY, pinK);
    }
  }
  // Never show more underground than the ground band at the bottom (or, over a lake, its full depth),
  // nor more than a sliver above the ceiling
  const wl = bird.alt < 60 && lakeAtX(bird.x);
  const floorPx = wl ? Math.max(groundPx(), (wl.depth + 1) * zoomY) : groundPx();
  cam.floorPx = Number.isFinite(cam.floorPx) ? cam.floorPx + (floorPx - cam.floorPx) * Math.min(1, dt * 2) : floorPx;
  ca = Math.max(ca, (H / 2 - cam.floorPx) / zoomY);
  ca = Math.min(ca, MAX_ALT + CEILING_MARGIN - H / 2 / zoomY);
  cam.zoom = zoom; cam.zoomY = zoomY; cam.alt = ca; cam.x = cx;  cam.shake = Math.max(0, (bird.speed - 50) / 45) * 4 + (braking ? 3 : 0);
}

// ---------- Draw ----------
const OUTLINE = 'drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)';
const SIGHT_COLOR = '#ff4d4d';
const HEARING_COLOR = '#ffbf40';
const SHADOW_REACTORS = new Set(['hare', 'mouse', 'squirrel']);
const NO_SENSE_RANGE = new Set(['rabbit', 'turtle']);
const IGNORE_DETECTION = new Set(['rabbit', 'turtle']);
const mixRGB = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function roundedRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawSenseCone(p, angle, half, range, fill, stroke) {
  const sx = toScreenX(p.x);
  const sy = toScreenY(eyeAlt(p));
  const radius = Math.max(2, Math.abs(toScreenX(p.x + range) - sx));
  const fullCircle = half >= Math.PI;

  if (fullCircle) {
    const radiusY = Math.max(2, Math.abs(toScreenY(eyeAlt(p) + range) - sy));
    ctx.beginPath();
    ctx.ellipse(sx, sy, radius, radiusY, 0, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    return;
  }

  const points = [{ x: sx, y: sy }];
  for (let i = 0; i <= 20; i++) {
    const a = angle - half + ((2 * half * i) / 20);
    const wx = p.x + Math.cos(a) * range;
    const wy = eyeAlt(p) + Math.sin(a) * range;
    points.push({ x: toScreenX(wx), y: toScreenY(wy) });
  }
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke();
}

function drawShadowGroundWarning(p) {
  // Shadow warnings are no longer rendered as a black line; the alert itself will stay red/yellow only.
  return;
}

function drawPreySenseIndicators(p) {
  if (p.hidden || p.gone || p.alertT > 0 || p.fleeing || p.spent) return;
  if (NO_SENSE_RANGE.has(p.kind) || IGNORE_DETECTION.has(p.kind)) return;
  const sn = SENSES[p.kind];
  if (!sn) return;
  const d = Math.hypot(bird.x - p.x, bird.alt - eyeAlt(p));
  const look = lookAngle(p);
  const visionRangePx = Math.min(200, visionRange(sn));
  if (d < visionRangePx + 20) {
    const t = clamp(1 - d / visionRangePx, 0, 1);
    const fill = `${SIGHT_COLOR}${Math.round(20 + t * 55).toString(16).padStart(2, '0')}`;
    const stroke = `${SIGHT_COLOR}${Math.round(50 + t * 65).toString(16).padStart(2, '0')}`;
    drawSenseCone(p, look, sn.half, Math.min(visionRangePx, visionRange(sn)), fill, stroke);
  }
  const hearDir = hearingAngle(p);
  if (d < hearingRange() + 30) {
    const hr = Math.min(hearingRange(), 120);
    const t = clamp(1 - d / hr, 0, 1);
    const fill = `${HEARING_COLOR}${Math.round(18 + t * 68).toString(16).padStart(2, '0')}`;
    const stroke = `${HEARING_COLOR}${Math.round(52 + t * 60).toString(16).padStart(2, '0')}`;
    drawSenseCone(p, hearDir, hearingHalf(p), hr, fill, stroke);
  }
}

function drawBackground() {
  const groundY = toScreenY(0);
  const t = Math.min(1, Math.max(0, bird.alt) / MAX_ALT);
  const d = daylight(), tw = twilight();
  let top = mixRGB([8, 12, 30], [40 - t * 32, 100 - t * 80, 180 - t * 115], d);
  let bottom = mixRGB([25, 35, 65], [191 - t * 70, 227 - t * 55, 255 - t * 25], d);
  bottom = mixRGB(bottom, [250, 150, 90], tw * 0.6);
  top = mixRGB(top, [90, 70, 110], tw * 0.3);
  const sky = ctx.createLinearGradient(0, 0, 0, Math.max(groundY, 1));
  sky.addColorStop(0, rgb(top));
  sky.addColorStop(1, rgb(bottom));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars fade in at night
  if (d < 0.7) {
    ctx.fillStyle = `rgba(255,255,255,${(0.7 - d) / 0.7 * 0.8})`;
    for (let i = 0; i < 140; i++) {
      const sx = hash(i * 1.1) * W, sy = hash(i * 2.3) * (groundY - 120);
      ctx.fillRect(sx, sy, hash(i * 3.7) < 0.15 ? 2 : 1, 1);
    }
  }

  // Moon arcs across the far sky at night (screen space, rising on the left); the sun is off-screen
  const horizon = groundY - 60, arcH = Math.max(100, horizon - 70);
  const ph = sunPhase();
  const sunPos = a => [W * (0.05 + 0.9 * (1 - Math.cos(a)) / 2), horizon - Math.sin(a) * arcH];
  const mp = ph - Math.PI;
  if (Math.sin(mp) > -0.15) {
    const [mx, my] = sunPos(mp);
    ctx.fillStyle = '#e8ecf5';
    ctx.beginPath(); ctx.arc(mx, my, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(top);
    ctx.beginPath(); ctx.arc(mx + 6, my - 3, 14, 0, Math.PI * 2); ctx.fill();
  }

  // Sky grid: spacing adapts to zoom like the grass ruler
  const gx = niceStep(160 / cam.zoom), gy = niceStep(120 / cam.zoomY);
  const skyBottom = toScreenY(0);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(210,235,255,0.18)';
  ctx.beginPath();
  for (let m = Math.floor((cam.x - W / 2 / cam.zoom) / gx) * gx; m <= cam.x + W / 2 / cam.zoom; m += gx) {
    const x = Math.round(toScreenX(m)) + 0.5;
    ctx.moveTo(x, 0); ctx.lineTo(x, skyBottom);
  }
  const topAlt = cam.alt + H / 2 / cam.zoomY;
  for (let a = gy; a <= topAlt; a += gy) {
    const y = Math.round(toScreenY(a)) + 0.5;
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // Cirrus: thin high streaks near and above the ceiling
  {
    const S = 380, off = state.cirrusOff, half = W / 2 / cam.zoom + 300;
    for (let j = Math.floor((cam.x - half - off) / S); j <= Math.ceil((cam.x + half - off) / S); j++) {
      if (wh(j * 5.5) > 0.6) continue;
      const x = j * S + off + wh(j * 1.3) * 150, alt = 470 + wh(j * 2.2) * 60;
      const len = 150 + wh(j * 3.7) * 200, thick = 3 + wh(j * 4.9) * 4;
      const sx = toScreenX(x), sy = toScreenY(alt);
      if (sy < -40 || sy > H) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); ctx.ellipse(sx, sy, len / 2 * cam.zoom, thick * cam.zoomY + 1, -0.04, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.ellipse(sx + len * 0.2 * cam.zoom, sy - thick * 2 * cam.zoomY, len * 0.3 * cam.zoom, thick * 0.6 * cam.zoomY + 1, -0.04, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Parallax hills: a distant layer scrolling at a fixed screen rate, so zooming doesn't slide them
  ctx.fillStyle = rgb(mixRGB([40, 50, 70], [143, 169, 184], d));
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 20) {
    const wx = (sx - W / 2 + cam.x * HILL_SCROLL) / 200;
    ctx.lineTo(sx, groundY - 80 - Math.sin(wx) * 40 - Math.sin(wx * 2.3) * 20);
  }
  ctx.lineTo(W, H); ctx.fill();

  // Low haze over the horizon
  const haze = ctx.createLinearGradient(0, groundY - 140, 0, groundY);
  haze.addColorStop(0, 'rgba(225,238,248,0)');
  haze.addColorStop(1, 'rgba(225,238,248,0.45)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, groundY - 140, W, 140);

  // Ridges just behind the play plane (wind rising over them gives lift on the windward side)
  const half = W / 2 / cam.zoom;
  for (let i = Math.floor((cam.x - half - 400) / RIDGE_SPACING) - 1; i <= Math.ceil((cam.x + half + 400) / RIDGE_SPACING) + 1; i++) {
    const r = ridgeAt(i);
    if (!r.on) continue;
    const g = ctx.createLinearGradient(0, toScreenY(r.h), 0, groundY);
    g.addColorStop(0, rgb(mixRGB([35, 45, 40], [120, 140, 105], d)));
    g.addColorStop(1, rgb(mixRGB([25, 35, 30], [80, 105, 70], d)));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(toScreenX(r.x - r.w), groundY + 1);
    for (let k = 0; k <= 40; k++) {
      const f = k / 40 * 2 - 1;
      const hgt = r.h * Math.pow((1 + Math.cos(Math.PI * f)) / 2, 1.3) * (0.92 + 0.08 * hash(i * 13 + k));
      ctx.lineTo(toScreenX(r.x + f * r.w), toScreenY(hgt));
    }
    ctx.lineTo(toScreenX(r.x + r.w), groundY + 1);
    ctx.fill();
  }

  // Cumulus: flat grey bases, bright puffy tops
  for (const c of cumulusIn(cam.x - half - 200, cam.x + half + 200)) drawCumulus(c);

  // Ceiling
  const ceilY = toScreenY(MAX_ALT);
  if (ceilY > -5) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(0, ceilY); ctx.lineTo(W, ceilY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`ceiling ${MAX_ALT} m`, W / 2, ceilY - 4);
  }

  // Ground
  const groundGradient = ctx.createLinearGradient(0, groundY, 0, H);
  groundGradient.addColorStop(0, '#5f8d32');
  groundGradient.addColorStop(1, '#395c26');
  ctx.fillStyle = groundGradient;
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  const step = niceStep(30 / cam.zoom);
  for (let m = Math.floor((cam.x - W / cam.zoom) / step) * step; m < cam.x + W / cam.zoom; m += step) {
    const x = toScreenX(m);
    const p = (Math.sin(m * 0.27 + state.time * 0.4) + 1) * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${0.02 + p * 0.06})`;
    ctx.fillRect(x, groundY, 2, 6);
  }
  ctx.fillStyle = '#4a7230';
  drawDustDevils();

  // Lakes
  for (let i = Math.floor((cam.x - half - 400) / LAKE_SPACING) - 1; i <= Math.ceil((cam.x + half) / LAKE_SPACING) + 1; i++) {
    const l = lakeAt(i);
    if (!l.on) continue;
    const x0 = toScreenX(l.x0), x1 = toScreenX(l.x0 + l.w);
    if (x1 < 0 || x0 > W) continue;
    const wg = ctx.createLinearGradient(0, groundY, 0, H);
    wg.addColorStop(0, rgb(mixRGB([30, 50, 80], [90, 150, 200], d)));
    wg.addColorStop(1, rgb(mixRGB([15, 25, 45], [40, 90, 140], d)));
    ctx.fillStyle = wg;
    ctx.fillRect(x0, groundY - 1, x1 - x0, H - groundY + 1);
    // Lake bed
    const bedY = toScreenY(-l.depth);
    if (bedY < H) { ctx.fillStyle = rgb(mixRGB([40, 34, 22], [104, 88, 58], d)); ctx.fillRect(x0, bedY, x1 - x0, H - bedY); }
    // Fish: the deeper, the fainter; feeding trout dimple the surface
    for (const f of state.fish) {
      if (f.lake.x0 !== l.x0) continue;
      const fx = toScreenX(f.x);
      if (fx < -30 || fx > W + 30) continue;
      ctx.globalAlpha = clamp(1 - (-f.alt) / (l.depth + 1), 0.12, 0.9) * (0.4 + 0.6 * d);
      drawFish(fx, toScreenY(f.alt), f, animalScaleFor(f.kind) * Math.max(0.6, Math.min(1.6, cam.zoom / 8)));
      ctx.globalAlpha = 1;
      if (f.alt > -0.8 && Math.sin(f.ph * 2.5) > 0.6) {
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
        const r = 4 + (Math.sin(f.ph * 2.5) - 0.6) * 20;
        ctx.beginPath(); ctx.ellipse(fx, groundY + 1, r, r * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.fillStyle = '#7a6a4a';
    ctx.fillRect(x0 - 3, groundY - 1, 3, 6); ctx.fillRect(x1, groundY - 1, 3, 6);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    for (let k = 0; k < 12; k++) {
      const sx = x0 + ((hash(i * 9 + k) * (x1 - x0) + state.time * 8 * (k % 2 ? 1 : -1)) % (x1 - x0) + (x1 - x0)) % (x1 - x0);
      const sy = groundY + 4 + hash(i * 7 + k) * Math.min(40, H - groundY - 8);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 10, sy); ctx.stroke();
    }
  }

  // Bird's shadow, cast away from the sun; spreads and fades with height
  if (!state.over && d > 0.15 && bird.alt >= 0 && bird.alt < SHADOW_VISIBLE_ALT) {
    const fade = (1 - bird.alt / SHADOW_VISIBLE_ALT) * Math.min(1, d * 1.5);
    const sx = toScreenX(bird.x + shadowOffset(bird.alt));
    const w = 16 * (1 + bird.alt / 40), h = 4 + bird.alt / 20;
    ctx.fillStyle = `rgba(0,0,0,${0.3 * fade})`;
    ctx.beginPath(); ctx.ellipse(sx, groundY + 1, w * 1.4, h * 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(0,0,0,${0.55 * fade})`;
    ctx.beginPath(); ctx.ellipse(sx, groundY + 1, w, h, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// Sun direction marker on the screen edge, along the line from the bird toward the sun
function drawSunIndicator() {
  const ph = sunPhase();
  if (Math.sin(ph) <= 0) return;
  const { x: bx, y: by } = birdAnchor();
  const ux = -Math.cos(ph), uy = -Math.sin(ph), inset = 26;
  let t = Infinity;
  if (ux > 0) t = Math.min(t, (W - inset - bx) / ux);
  if (ux < 0) t = Math.min(t, (inset - bx) / ux);
  if (uy < 0) t = Math.min(t, (inset - by) / uy);
  if (uy > 0) t = Math.min(t, (H - inset - by) / uy);
  const x = bx + ux * t, y = by + uy * t;
  ctx.strokeStyle = '#ffd34d'; ctx.fillStyle = '#ffd34d'; ctx.lineWidth = 2;
  ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 11, y + Math.sin(a) * 11); ctx.lineTo(x + Math.cos(a) * 16, y + Math.sin(a) * 16); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawCumulus(c) {
  const left = toScreenX(c.x - c.w * 0.7), right = toScreenX(c.x + c.w * 0.7);
  if (right < 0 || left > W) return;
  const path = new Path2D();
  const n = 7;
  for (let j = 0; j < n; j++) {
    const f = j / (n - 1) - 0.5;
    const pr = c.h * (0.45 + hash(c.seed + j * 0.37) * 0.4) * (1 - Math.abs(f) * 0.8);
    const sx = toScreenX(c.x + f * c.w * 0.85), sy = toScreenY(c.base + pr * 0.85);
    const rx = pr * 1.3 * cam.zoom, ry = pr * cam.zoomY;
    path.moveTo(sx + rx, sy);
    path.ellipse(sx, sy, rx, ry, 0, 0, Math.PI * 2);
  }
  const top = toScreenY(c.base + c.h * 1.6), baseY = toScreenY(c.base);
  ctx.save();
  ctx.clip(path);
  const g = ctx.createLinearGradient(0, top, 0, baseY);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.65, 'rgba(242,246,251,0.93)');
  g.addColorStop(1, 'rgba(185,197,214,0.93)');
  ctx.fillStyle = g;
  // Only fill above the base, which gives the flat cumulus underside
  ctx.fillRect(left, top, right - left, baseY - top);
  ctx.restore();
}

function niceStep(minMetres) {
  for (const s of [0.5, 1, 2, 5, 10, 25, 50, 100, 250]) if (s >= minMetres) return s;
  return 500;
}

const facing = p => ((p.turn ?? p.face ?? p.vx) < 0 ? -1 : 1);

function drawLeporid(x, y, p, s, body, earH) {
  const hop = Math.abs(Math.sin(p.hopT * 6)) * 4;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing(p) * s, s);
  ctx.translate(0, -hop);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, -5, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, -9, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(6, -10 - earH, 2, earH);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-8, -5, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawMouse(x, y, p, s) {
  const bob = p.moving ? Math.abs(Math.sin(p.hopT * 18)) * 0.8 : 0;
  ctx.save();
  ctx.translate(x, y - bob);
  ctx.scale(facing(p) * s, s);
  ctx.strokeStyle = '#8a7f78'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-5, -2); ctx.quadraticCurveTo(-9, -4, -12, -1); ctx.stroke();
  ctx.fillStyle = '#8a8580';
  ctx.beginPath(); ctx.ellipse(0, -2.5, 5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, -3, 2.6, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9a9a0';
  ctx.beginPath(); ctx.arc(4, -5.2, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSquirrel(x, y, p, s) {
  const hop = Math.abs(Math.sin(p.hopT * 8)) * 3;
  ctx.save();
  ctx.translate(x, y - hop);
  ctx.scale(facing(p) * s, s);
  ctx.fillStyle = '#b5653a';
  ctx.beginPath(); ctx.ellipse(-7, -11, 4, 7.5, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9a5530';
  ctx.beginPath(); ctx.ellipse(0, -5, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -8, 3.2, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, -10); ctx.lineTo(6, -13.5); ctx.lineTo(7.5, -10.5); ctx.fill();
  ctx.restore();
}

function drawTurtle(x, y, p, s, rot = 0) {
  const step = Math.sin((p.hopT || 0) * 6);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(facing(p) * s, s);
  ctx.fillStyle = '#7a9a3a';
  ctx.fillRect(-6 + step, -3, 3, 3); ctx.fillRect(3 - step, -3, 3, 3);
  ctx.beginPath(); ctx.arc(9, -4, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4e6b2f';
  ctx.beginPath(); ctx.ellipse(0, -3, 8.5, 6, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#7f9c4a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-4, -3); ctx.lineTo(-2, -7); ctx.lineTo(2, -7); ctx.lineTo(4, -3); ctx.stroke();
  ctx.restore();
}

function drawPigeon(x, y, p, s, duck = false) {
  const f = Math.sin(p.flapT || 0);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing(p) * s, s);
  ctx.fillStyle = duck ? '#7a5a3a' : '#8d97a5';
  ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-13, -2); ctx.lineTo(-13, 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, duck ? 9 : 8, duck ? 4.5 : 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = duck ? '#2e6b3a' : '#6e7886';
  ctx.beginPath(); ctx.arc(duck ? 9 : 8, -2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = duck ? '#e0a030' : '#444';
  const bx = duck ? 11.5 : 10.5;
  ctx.beginPath(); ctx.moveTo(bx, -2.5); ctx.lineTo(bx + (duck ? 3.5 : 2.5), -1.5); ctx.lineTo(bx, -0.5); ctx.fill();
  ctx.fillStyle = duck ? '#5a4630' : '#737d8b';
  ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(-3, -1 - f * 10); ctx.lineTo(-6, -1); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSwift(x, y, p, s) {
  const w = 0.55 + 0.45 * Math.sin(p.flapT || 0);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing(p) * s, s);
  ctx.fillStyle = '#2a2a30';
  ctx.beginPath(); ctx.ellipse(0, 0, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-11, -2.5); ctx.lineTo(-8.5, 0); ctx.lineTo(-11, 2.5); ctx.fill();
  for (const sgn of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(2, 0);
    ctx.quadraticCurveTo(-2, sgn * 7 * w, -10, sgn * 9 * w);
    ctx.quadraticCurveTo(-3, sgn * 3 * w, -1, 0);
    ctx.fill();
  }
  ctx.restore();
}

function drawStarling(x, y, flap, s, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir < 0 ? -s : s, s);
  ctx.fillStyle = '#26262c';
  ctx.beginPath(); ctx.ellipse(0, 0, 3.2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(-2, -4 * Math.sin(flap)); ctx.lineTo(-3, 0); ctx.fill();
  ctx.restore();
}

// y is the ground line for ground species, the body centre for flying ones
function drawFish(x, y, f, s) {
  const pike = f.kind === 'pike', L = pike ? 11 : 7, Hh = pike ? 2 : 2.4;
  const wag = Math.sin((f.ph || 0) * (f.fleeT > 0 ? 18 : 6)) * 0.35;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale((f.vx < 0 ? -1 : 1) * s, s);
  ctx.fillStyle = pike ? '#5d6b3a' : '#8a9a8c';
  ctx.beginPath(); ctx.moveTo(-L + 1, 0); ctx.lineTo(-L - 4, -3 + wag * 4); ctx.lineTo(-L - 4, 3 + wag * 4); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, L, Hh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pike ? '#c9c79a' : '#e0b0b0';
  ctx.beginPath(); ctx.ellipse(0, Hh * 0.45, L * 0.75, Hh * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pike ? 'rgba(220,220,150,0.7)' : 'rgba(40,40,40,0.6)';
  for (let i = 0; i < 4; i++) ctx.fillRect(-L * 0.6 + i * L * 0.35, -Hh * 0.6, pike ? 1 : 0.8, pike ? Hh : 0.8);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(L * 0.7, -0.5, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSpecies(kind, x, y, p, s) {
  switch (kind) {
    case 'rabbit': return drawLeporid(x, y, p, s, '#8b6b4a', 8);
    case 'hare': return drawLeporid(x, y, p, s, '#b08a5a', 13);
    case 'mouse': return drawMouse(x, y, p, s);
    case 'squirrel': return drawSquirrel(x, y, p, s);
    case 'turtle': return drawTurtle(x, y, p, s);
    case 'pigeon': return drawPigeon(x, y, p, s);
    case 'duck': return drawPigeon(x, y, p, s, true);
    case 'swift': return drawSwift(x, y, p, s);
    case 'trout': case 'pike': return drawFish(x, y, { kind, vx: p.vx ?? 1, ph: 0 }, s);
    case 'flock':
      for (let i = 0; i < 5; i++) {
        drawStarling(x + ((i % 3) - 1) * 9 * s, y + (i < 3 ? -4 : 5) * s, (p.flapT || 0) + i, s, p.vx ?? 1);
      }
  }
}

function drawAlert(x, y, ch = '!', alpha = 1, reason = 'sound') {
  const palette = { sight: '#d62828', sound: '#ffdd55', shadow: '#d62828' };
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(ch, x, y);
  ctx.fillStyle = ch === '!' ? palette[reason] || '#ffdd55' : '#fff'; ctx.fillText(ch, x, y);
  ctx.globalAlpha = 1;
}

// "!" when spooked, a fading-in "?" while the animal is noticing you
function preyHasAlert(p) {
  if (p.hidden || p.gone) return false;
  if (p.spent) return (p.fadeT ?? 0) > 0;
  return p.alertT > 0 || p.fleeing || p.spookT > 0 || p.scatterT > 0;
}

function drawAwareness(p, x, y) {
  if (p.hidden || p.gone) return;
  const reason = p.lastSense || 'sound';
  const alertAlpha = p.spent ? Math.max(0, Math.min(1, p.fadeT ?? 1)) : 1;
  if (preyHasAlert(p)) drawAlert(x, y, '!', alertAlpha, reason);
  else if (p.aware > 0 && SENSES[p.kind]) drawAlert(x, y, '?', Math.min(1, 0.3 + p.aware / SENSES[p.kind].reaction), reason);
}

function drawPrey(p) {
  const s = SPECIES[p.kind];
  const sx = toScreenX(p.x);
  if (p.kind === 'mouse') {
    const hx = toScreenX(p.home), gy = toScreenY(0);
    if (hx >= -20 && hx <= W + 20) {
      ctx.fillStyle = '#6b4f30';
      ctx.beginPath(); ctx.ellipse(hx, gy, 14, 4.5, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#2b1d10';
      ctx.beginPath(); ctx.ellipse(hx, gy - 0.5, 7, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (sx < -150 || sx > W + 150) return;
  if (p.hidden) return;
  drawPreySenseIndicators(p);
  if (!s.air) {
    const gy = toScreenY(0);
    ctx.globalAlpha = p.spent ? Math.max(0, Math.min(1, p.fadeT)) : 1;
    drawSprite(p.kind, sx, gy, p, animalScaleFor(p.kind));
    ctx.globalAlpha = 1;
    drawAwareness(p, sx, gy - 34);
    return;
  }
  if (p.kind === 'flock') {
    ctx.globalAlpha = p.spent ? Math.max(0, p.fadeT) : 1;
    for (const m of p.members) {
      if (!m.caught) drawStarlingSprite(toScreenX(m.x), toScreenY(m.alt), m.ph * 6, animalScaleFor(p.kind), p.vx);
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = p.spent ? Math.max(0, Math.min(1, p.fadeT)) : 1;
    drawSprite(p.kind, sx, toScreenY(p.alt), p, animalScaleFor(p.kind));
    ctx.globalAlpha = 1;
  }
  drawAwareness(p, sx, toScreenY(p.alt) - 20);
}

// ---------- Sprite cache ----------
// Outlined animal sprites are pre-rendered per animation frame; a canvas filter on every draw is far too slow
const spriteCache = new Map();
const ANIM_STEPS = 12;
// Animation period of [hopT, flapT] for each sprite (0 = not animated by that value)
const ANIM_PERIOD = { rabbit: [Math.PI / 6, 0], hare: [Math.PI / 6, 0], mouse: [Math.PI / 18, 0], squirrel: [Math.PI / 8, 0],
  turtle: [Math.PI / 3, 0], pigeon: [0, Math.PI * 2], duck: [0, Math.PI * 2], swift: [0, Math.PI * 2], star: [0, Math.PI * 2] };
function quantize(v, period) {
  if (!period) return [0, 0];
  const i = Math.floor(((((v || 0) % period) + period) % period) / period * ANIM_STEPS);
  return [i, ((i + 0.5) / ANIM_STEPS) * period];
}
function renderSprite(s, drawFn) {
  const size = Math.ceil(64 * s) + 8;
  const raw = document.createElement('canvas');
  raw.width = raw.height = size;
  const saved = ctx;
  ctx = raw.getContext('2d');
  ctx.translate(size / 2, size / 2);
  drawFn();
  ctx = saved;
  const out = document.createElement('canvas');
  out.width = out.height = size;
  const o = out.getContext('2d');
  o.filter = OUTLINE;
  o.drawImage(raw, 0, 0);
  return out;
}
function cached(key, s, drawFn) {
  let img = spriteCache.get(key);
  if (!img) { img = renderSprite(s, drawFn); spriteCache.set(key, img); }
  return img;
}
function drawSprite(kind, x, y, p, s) {
  const [hPer, fPer] = ANIM_PERIOD[kind] || [0, 0];
  const [hi, hopT] = quantize(p.hopT, hPer), [fi, flapT] = quantize(p.flapT, fPer);
  const dir = facing(p), moving = p.moving ? 1 : 0;
  const img = cached(`${kind}|${dir}|${s}|${hi}|${fi}|${moving}`, s,
    () => drawSpecies(kind, 0, 0, { hopT, flapT, vx: dir, face: dir, moving: !!moving }, s));
  // Mid-turn the sprite narrows (edge-on) before it flips; everything shrinks with the zoom-out
  const k = spriteK(), sw = img.width * k * Math.max(0.2, Math.min(1, Math.abs(p.turn ?? 1))), sh = img.height * k;
  ctx.drawImage(img, Math.round(x - sw / 2), Math.round(y - sh / 2), Math.round(sw), Math.round(sh));
}
function drawStarlingSprite(x, y, flap, s, dir) {
  const [fi, f] = quantize(flap, ANIM_PERIOD.star[1]);
  const d = dir < 0 ? -1 : 1;
  const img = cached(`star|${d}|${s}|${fi}`, s, () => drawStarling(0, 0, f, s, d));
  const k = spriteK(), w = img.width * k, h = img.height * k;
  ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h / 2), Math.round(w), Math.round(h));
}

// Gun sprite pointing along +x: 0 = hunter's rifle, 1 = auto-fire (drum mag), 2 = bazooka. flash draws the muzzle blast
const gunStyle = () => gunBazooka() ? 2 : gunAuto() ? 1 : 0;
const GUN_MUZZLE = [17, 15, 16];
function drawRifle(x, y, ang, s, style = 0, flash = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  if (Math.abs(wrapAngle(ang)) > Math.PI / 2) ctx.scale(1, -1);
  ctx.scale(s, s);
  if (style === 2) {
    ctx.fillStyle = '#4d5a32';
    ctx.fillRect(-14, -3, 30, 6);
    ctx.fillStyle = '#39432a';
    ctx.fillRect(-16, -3.6, 3, 7.2); ctx.fillRect(13, -3.6, 3, 7.2);
    ctx.fillStyle = '#2a2a2e';
    ctx.fillRect(-3, 3, 2.5, 4); ctx.fillRect(4, 3, 2.5, 3);
    ctx.fillStyle = '#c9b458';
    ctx.fillRect(-1, -5, 5, 2);
  } else {
    // Wooden stock and fore-end, steel receiver and barrel
    ctx.fillStyle = '#7a4e2a';
    ctx.beginPath(); ctx.moveTo(-14, -1.6); ctx.lineTo(-3, -1.8); ctx.lineTo(-3, 2.2); ctx.lineTo(-9, 2.4); ctx.lineTo(-14, 4); ctx.closePath(); ctx.fill();
    ctx.fillRect(3, -0.6, 8, 2.6);
    ctx.fillStyle = '#2a2a2e';
    ctx.fillRect(-3, -2, 7, 3.6);
    ctx.fillRect(4, -1.4, 13, 1.6);
    ctx.fillRect(-1, 1.6, 1.6, 2.4);
    if (style === 1) {
      ctx.beginPath(); ctx.arc(3, 4.2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#55555c';
      ctx.beginPath(); ctx.arc(3, 4.2, 1.2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#1b1b1f';
      ctx.fillRect(-1.5, -4, 5, 1.6);
    }
  }
  if (flash > 0) {
    const m = GUN_MUZZLE[style], f = 1 + flash * 8;
    ctx.fillStyle = style === 2 ? '#ffb347' : '#ffe066';
    ctx.beginPath();
    ctx.moveTo(m, 0); ctx.lineTo(m + 3 * f, -2.5 * f); ctx.lineTo(m + 2 * f, 0); ctx.lineTo(m + 3 * f, 2.5 * f); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(m + 1, 0, 1.6 * f, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawGunStuff() {
  ctx.filter = OUTLINE;
  for (const g of state.guns) {
    const x = toScreenX(g.x), y = toScreenY(g.alt) - 3;
    if (x < -40 || x > W + 40) continue;
    drawRifle(x, y, g.alt > 0 ? state.time * 6 : 0, 1.6, gunStyle());
  }
  // Rockets in flight
  for (const r of state.rockets) {
    const x = toScreenX(r.x), y = toScreenY(r.alt);
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(-r.vy * cam.zoomY, r.vx * cam.zoom));
    ctx.fillStyle = '#4d5a32'; ctx.fillRect(-6, -2, 10, 4);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(8, 0); ctx.lineTo(4, 2); ctx.fill();
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(-6, -1.5); ctx.lineTo(-11 - Math.random() * 4, 0); ctx.lineTo(-6, 1.5); ctx.fill();
    ctx.restore();
  }
  ctx.filter = 'none';
  for (const b of state.blasts) {
    const k = b.t / 0.6, r = ROCKET_BLAST * cam.zoom * (0.4 + 0.6 * Math.sqrt(k));
    const x = toScreenX(b.x), y = toScreenY(b.alt);
    ctx.fillStyle = `rgba(255,${150 + 80 * (1 - k)},60,${0.75 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,220,${1 - k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r * 1.1, 0, Math.PI * 2); ctx.stroke();
  }
  // Glint over grounded rifles so they're findable
  for (const g of state.guns) {
    if (g.alt > 0) continue;
    const x = toScreenX(g.x), y = toScreenY(0) - 22 - Math.sin(state.time * 4) * 3;
    if (x < -40 || x > W + 40) continue;
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath(); ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y - 6); ctx.lineTo(x, y + 2); ctx.fill();
  }
  for (const tr of state.tracers) {
    ctx.strokeStyle = `rgba(255,230,140,${tr.t / 0.25})`; ctx.lineWidth = gunAuto() ? 2 : 3;
    ctx.beginPath(); ctx.moveTo(toScreenX(tr.x0), toScreenY(tr.a0)); ctx.lineTo(toScreenX(tr.x1), toScreenY(tr.a1)); ctx.stroke();
  }
  if (gunAimHeld() && !state.over) {
    const { ux, uy } = gunRay(), { t, hit } = gunTrace(ux, uy);
    const x0 = toScreenX(bird.x), y0 = toScreenY(bird.alt);
    const x1 = toScreenX(bird.x + ux * t), y1 = toScreenY(bird.alt + uy * t);
    ctx.strokeStyle = hit ? 'rgba(255,40,30,0.9)' : 'rgba(255,120,100,0.5)'; ctx.lineWidth = hit ? 2.5 : 1.5;
    ctx.setLineDash(hit ? [] : [6, 6]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.setLineDash([]);
    if (gunBazooka()) {
      ctx.strokeStyle = 'rgba(255,150,60,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x1, y1, ROCKET_BLAST * cam.zoom, ROCKET_BLAST * cam.zoomY, 0, 0, Math.PI * 2); ctx.stroke();
    }
    if (hit) {
      const r = 14 + Math.sin(state.time * 10) * 2;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x1, y1, r, 0, Math.PI * 2);
      ctx.moveTo(x1 - r - 6, y1); ctx.lineTo(x1 - r + 4, y1); ctx.moveTo(x1 + r - 4, y1); ctx.lineTo(x1 + r + 6, y1);
      ctx.moveTo(x1, y1 - r - 6); ctx.lineTo(x1, y1 - r + 4); ctx.moveTo(x1, y1 + r - 4); ctx.lineTo(x1, y1 + r + 6);
      ctx.stroke();
    }
  }
}

// Screen angle the carried gun points: along the aim while held, otherwise along the flight
function carriedGunAngle() {
  const { ux, uy } = gunAimHeld() ? gunRay() : { ux: Math.cos(bird.angle), uy: Math.sin(bird.angle) };
  return Math.atan2(-uy * cam.zoomY, ux * cam.zoom);
}

// Carried item: the gun is gripped in the talons just under the body; a turtle hangs lower
function drawCarried(x, y, s) {
  if (!bird.carrying) return;
  if (bird.carrying.kind === 'gun') {
    const ang = carriedGunAngle(), gx = x, gy = y + 7.5 * s;
    // Legs from the body down to the grip
    ctx.strokeStyle = '#e0b030'; ctx.lineWidth = 1.6 * s; ctx.lineCap = 'round';
    for (const o of [-2, 2]) {
      const lx = gx + Math.cos(ang) * o * s, ly = gy + Math.sin(ang) * o * s;
      ctx.beginPath(); ctx.moveTo(x + o * s * 0.6, y + 1.5 * s); ctx.lineTo(lx, ly); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    drawRifle(gx, gy, ang, 1.05 * s, gunStyle(), bird.carrying.flash || 0);
  } else {
    drawTurtle(x, y + 15 * s, { vx: bird.vx }, SPECIES.turtle.scale * s / FALCON_SCALE);
  }
}

function drawFallers() {
  drawGunStuff();
  // While intentionally holding right-click to throw a carried turtle, show the simulated arc (and, with Homing turtle, the target).
  // With only the Sight upgrade, the plain-drop path is shown the whole time a turtle is carried.
  const aiming = mouse.aiming && bird.carrying && bird.carrying.kind !== 'gun' && mouse.throwHeld && !state.over;
  if (aiming) {
    const { vx, vy } = throwVelocity(true);
    const path = simulateThrow(bird.x, bird.alt, vx, vy);
    const guided = turtleHoming() > 0;
    let target = guided ? pickThrowTarget(path) : null;
    if (guided && !target) {
      const end = path[path.length - 1];
      let best = null, bestD = Infinity;
      for (const r of state.rivals) {
        if (r.gone) continue;
        const d = Math.hypot(r.x - end.x, r.alt - end.alt);
        if (d < bestD) { bestD = d; best = { kind: 'buzzard', x: r.x, alt: r.alt, target: r }; }
      }
      if (best && bestD < THROW_LOCK_AIR * lockScale() + 10) target = best;
    }
    ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,80,60,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath();
    path.forEach((pt, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, toScreenX(pt.x), toScreenY(pt.alt)));
    ctx.stroke();
    ctx.setLineDash([]);
    const end = path[path.length - 1], lx = toScreenX(end.x), gy = toScreenY(0);
    ctx.strokeStyle = 'rgba(255,80,60,0.9)';
    ctx.beginPath(); ctx.ellipse(lx, gy, 12, 4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx - 6, gy - 6); ctx.lineTo(lx + 6, gy + 6); ctx.moveTo(lx + 6, gy - 6); ctx.lineTo(lx - 6, gy + 6); ctx.stroke();
    if (target) {
      const isAir = isBuzzardTarget(target) || target.air || SPECIES[target.kind]?.air;
      const tx = toScreenX(target.x), ty = isAir ? toScreenY(target.alt) : gy - (target.kind === 'hunter' ? 25 * HAZARD_SCALE : 10);
      const r = 16 + Math.sin(state.time * 10) * 2;
      ctx.strokeStyle = '#ff5544'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx - r - 6, ty); ctx.lineTo(tx - r + 4, ty); ctx.moveTo(tx + r - 4, ty); ctx.lineTo(tx + r + 6, ty); ctx.stroke();
      if (isBuzzardTarget(target) || HAZARD_NAME[target.kind]) {
        ctx.beginPath(); ctx.arc(tx, ty, r + 8, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  ctx.filter = OUTLINE;
  for (const f of state.fallers) drawTurtle(toScreenX(f.x), toScreenY(f.alt), { vx: f.vx }, SPECIES.turtle.scale, f.spin);
  ctx.filter = 'none';
}

const hash = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
// World layout (thermals, ridges, lakes, clouds, rivals) is re-rolled each run via this seed
let worldSeed = 0;
const wh = n => hash(n + worldSeed);
const GRASS_COLORS = ['#2d5a1d', '#3d7726', '#5ca032', '#82bf56'];

function drawDustDevils() {
  if (!DUST_DEVILS_ENABLED) return;
  for (const dv of state.devils) {
    const f = devilFade(dv);
    if (f <= 0.05) continue;
    const bx = toScreenX(dv.x), gy = toScreenY(0); 
    const radius = Math.max(10, dv.w * cam.zoom * 2.2);
    const twist = state.time * 15 + dv.x * 0.7;
    ctx.save();
    ctx.translate(bx, gy - 2);
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.7 * f;
    ctx.strokeStyle = 'rgba(235, 179, 96, 0.95)';
    ctx.lineWidth = Math.max(2, 4 * f);
    for (let k = 0; k < 8; k++) {
      const ang = twist + k * 0.9;
      const rr = radius * (0.18 + k * 0.1);
      const x = Math.cos(ang) * rr * 0.7;
      const y = -Math.sin(ang) * rr * 0.8 - (k * 2.5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(x * 0.55, -4 - k * 1.5, x, y);
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(194, 112, 52, ${0.45 * f})`;
    ctx.beginPath(); ctx.ellipse(0, 2, radius * 1.2, radius * 0.38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 6, radius * 0.8, radius * 0.24, Math.sin(twist) * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawGrass() {
  const BLADE_M = 0.12;
  const keep = Math.min(1, BLADE_M * cam.zoom / 5.5);
  const groundY = toScreenY(0);
  const t = state.time;
  const i0 = Math.floor((cam.x - (W / 2 + 30) / cam.zoom) / BLADE_M);
  const i1 = Math.ceil((cam.x + (W / 2 + 30) / cam.zoom) / BLADE_M);
  const paths = GRASS_COLORS.map(() => new Path2D());
  for (let i = i0; i <= i1; i++) {
    if (hash(i) > keep) continue;
    const r2 = hash(i + 0.37), r3 = hash(i + 0.71), r4 = hash(i + 1.23);
    const wx = (i + r2) * BLADE_M;
    if (lakeAtX(wx)) continue;
    const sx = toScreenX(wx);
    const h = 10 + r3 * 16 + r4 * 8;
    const tuft = Math.sin(t * 1.6 + wx * 0.45) * 0.22 + Math.sin(t * 0.7 + wx * 0.07) * 0.18 + windX(2) * 0.06;
    let bend = tuft;
    for (const w of state.wake) {
      const dxPx = (wx - w.x) * cam.zoom;
      if (dxPx > 90 || dxPx < -90) continue;
      const inf = Math.exp(-((dxPx / 28) ** 2)) * w.s * (1 - (t - w.t) / 1.5);
      bend += (Math.sign(dxPx) || 1) * inf * 1.4 + Math.sin(t * 18 + i) * inf * 0.2;
    }
    bend = Math.max(-1.4, Math.min(1.4, bend));
    const p = paths[Math.floor(r4 * (paths.length - 0.01))];
    const sway = Math.sin(bend) * h * 0.3;
    p.moveTo(sx, groundY + 2);
    p.quadraticCurveTo(sx + sway * 0.7, groundY - h * 0.35, sx + Math.sin(bend) * h * 0.9, groundY - h);
    p.moveTo(sx, groundY + 3);
    p.quadraticCurveTo(sx - sway * 0.4, groundY - h * 0.25, sx + Math.sin(bend + 0.6) * h * 0.7, groundY - h * 0.9);
  }
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  paths.forEach((p, k) => { ctx.strokeStyle = GRASS_COLORS[k]; ctx.stroke(p); });
  ctx.lineCap = 'butt';
}

function drawLens(cx, cy, bg, drawContent) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, LENS_R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = bg; ctx.fillRect(cx - LENS_R, cy - LENS_R, LENS_R * 2, LENS_R * 2);
  drawContent();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, LENS_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
}

function birdScreenAngle() {
  return Math.atan2(Math.sin(bird.angle) * cam.zoomY, Math.cos(bird.angle) * cam.zoom);
}

function birdAboveScreen() { return toScreenY(bird.alt) < 8; }

// Bird's on-screen reference point: its real position, or the lens when it's above the screen
function birdAnchor() {
  const x = toScreenX(bird.x);
  if (!birdAboveScreen()) return { x, y: toScreenY(bird.alt) };
  return { x: Math.max(LENS_R + 10, Math.min(W - LENS_R - 10, x)), y: LENS_R + 12 };
}

function drawBirdLens() {
  if (!birdAboveScreen()) return;
  const { x, y } = birdAnchor();
  drawLens(x, y, '#9cc8ef', () => {
    if (bird.carrying) {
      if (bird.carrying.kind === 'gun') drawRifle(x, y + 14, 0, 1.4, gunStyle());
      else drawTurtle(x, y + 18, { vx: bird.vx }, 1.2);
    }
    drawBirdSprite(x, y, birdScreenAngle(), 1.8);
  });
  const label = `+${(bird.alt - MAX_ALT).toFixed(0)} m`;
  ctx.font = 'bold 12px monospace';
  const w = ctx.measureText(label).width + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(x - w / 2, y + LENS_R + 6, w, 18);
  ctx.fillStyle = '#66ccff'; ctx.textAlign = 'center';
  ctx.fillText(label, x, y + LENS_R + 19);
}

function drawBird() {
  const sx = toScreenX(bird.x), sy = toScreenY(bird.alt);
  ctx.filter = OUTLINE;
  const sprite = FALCON_SCALE * spriteK();
  if (bird.invulnT > 0) ctx.globalAlpha = 0.45 + 0.45 * Math.sin(state.time * 30);
  if (bird.carrying) drawCarried(sx, sy, sprite);
  // Player sprite shrinks with the zoom-out like everything else
  drawBirdSprite(sx, sy, birdScreenAngle(), sprite);
  ctx.filter = 'none'; ctx.globalAlpha = 1;

  // Speed streaks
  if (bird.speed > DIVE_SPEED) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 4; i++) {
      const ox = (Math.random() - 0.5) * 30, oy = (Math.random() - 0.5) * 30;
      ctx.beginPath();
      ctx.moveTo(sx + ox, sy + oy);
      ctx.lineTo(sx + ox - bird.vx * cam.zoom * 0.08, sy + oy + bird.vy * cam.zoomY * 0.08);
      ctx.stroke();
    }
  }
}

// Breath left underwater: a row of bubbles above the bird
function drawBreath(x, y) {
  const n = 7, k = (bird.breath ?? BREATH_TIME) / BREATH_TIME, lit = Math.ceil(k * n);
  for (let i = 0; i < n; i++) {
    const bx = x + (i - (n - 1) / 2) * 9;
    ctx.beginPath(); ctx.arc(bx, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = i < lit ? (k < 0.3 ? '#ff9a7a' : '#bfe8ff') : 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
  }
  if (k <= 0) {
    ctx.fillStyle = '#ff9a7a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('out of breath!', x, y - 9);
  }
}

// Young hawks: small rufous-brown buteo-ish birds, carrying their catch for a while
function drawEyases() {
  if (!state.eyases) return;
  const s = 0.75 * spriteK() * FALCON_SCALE;
  ctx.filter = OUTLINE;
  for (const e of state.eyases) {
    const x = toScreenX(e.x), y = toScreenY(e.alt);
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    const f = e.mode === 'chase' ? 0.25 + 0.3 * Math.sin(e.flapT * 1.4) : Math.sin(e.flapT);
    const ang = Math.atan2(e.vy * cam.zoomY, e.vx * cam.zoom);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-ang * (e.mode === 'chase' ? 1 : 0.4));
    ctx.scale(s, s * (Math.cos(ang) < 0 ? -1 : 1));
    ctx.fillStyle = '#9a6a3c';
    ctx.beginPath(); ctx.moveTo(3, -1); ctx.lineTo(-3, -2 - f * 11); ctx.lineTo(-10, -1 - f * 8); ctx.lineTo(-5, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a4e2a';
    ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f0dcb4';
    ctx.beginPath(); ctx.ellipse(1, 1.4, 5, 1.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a4e2a';
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-14, -2.5); ctx.lineTo(-14, 2.5); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -1, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe14a';
    ctx.beginPath(); ctx.moveTo(10.5, -1.5); ctx.lineTo(13, 0); ctx.lineTo(10.5, 0.6); ctx.fill();
    if (e.carry) { ctx.fillStyle = '#6b5a48'; ctx.beginPath(); ctx.ellipse(0, 5.5, 3.5, 2, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  ctx.filter = 'none';
}

function drawFeatherFx() {
  for (const f of state.featherFx) {
    ctx.save();
    ctx.translate(toScreenX(f.x), toScreenY(f.alt)); ctx.rotate(f.rot);
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = '#fff4d6';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawBirdSprite(sx, sy, screenAngle, sprite) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-screenAngle);
  ctx.scale(sprite, sprite);

  // Wing shape depends on mode
  const effort = bird.tuck ?? 0.5;
  let span, sweep;
  if (bird.mode === 'DIVE') { span = 12 - effort * 7; sweep = -16; }   // tucked
  else if (bird.mode === 'BRAKE') { span = 20; sweep = 4; }            // flared
  else if (bird.mode === 'FLAP') { span = 16 + Math.sin(bird.flapT) * 10; sweep = -6; }
  else { span = 18 - effort * 6; sweep = -6 - effort * 4; }

  ctx.fillStyle = '#4a4a52';
  // wings
  ctx.beginPath();
  ctx.moveTo(4, 0); ctx.lineTo(sweep, -span); ctx.lineTo(-6, 0);
  ctx.lineTo(sweep, span); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = '#2f2f36';
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
  // tail
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-18, -4); ctx.lineTo(-18, 4); ctx.fill();
  // head + beak
  ctx.fillStyle = '#1c1c22';
  ctx.beginPath(); ctx.arc(11, 0, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2c230';
  ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(18, 1); ctx.lineTo(14, 2); ctx.fill();
  ctx.restore();
}

function drawArrow(tipX, tipY, ux, uy) {
  ctx.fillStyle = '#d62828'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - ux * 16 - uy * 9, tipY - uy * 16 + ux * 9);
  ctx.lineTo(tipX - ux * 16 + uy * 9, tipY - uy * 16 - ux * 9);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawLabel(text, x, y) {
  ctx.font = 'bold 12px monospace';
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(x - w / 2, y - 9, w, 18);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText(text, x, y + 4);
}

function drawPreyIndicators() {
  // Arrow over the nearest target; if off-screen, a lens at the screen edge on the line from the bird
  if (bird.carrying) return;
  let near = null, best = Infinity;
  for (const p of prey) {
    if (p.gone || p.hidden || p.spent) continue;
    const d = Math.hypot(p.x - bird.x, (SPECIES[p.kind].air ? p.alt : 0) - bird.alt);
    if (d < best) { best = d; near = p; }
  }
  if (!near || best < 40) return;
  const s = SPECIES[near.kind];
  const label = `${best.toFixed(0)} m`;
  const rx = toScreenX(near.x), ry = s.air ? toScreenY(near.alt) : toScreenY(0) - 10;
  if (rx >= 0 && rx <= W && ry >= 0 && ry <= H) {
    const awarenessOffset = preyHasAlert(near) || near.aware > 0 ? 32 : 0;
    drawArrow(rx, ry - (s.air ? 18 : 14) - awarenessOffset, 0, 1);
    return;
  }
  const { x: bx, y: by } = birdAnchor();
  const dx = rx - bx, dy = ry - by, inset = LENS_R + 14;
  let t = 1;
  if (dx > 0) t = Math.min(t, (W - inset - bx) / dx);
  if (dx < 0) t = Math.min(t, (inset - bx) / dx);
  if (dy > 0) t = Math.min(t, (H - inset - by) / dy);
  if (dy < 0) t = Math.min(t, (inset - by) / dy);
  const cx = bx + dx * t, cy = by + dy * t;
  const len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  drawLens(cx, cy, '#bfe3ff', () => {
    if (s.air) {
      drawSpecies(near.kind, cx, cy, near, animalScaleFor(near.kind) * 0.9);
    } else {
      ctx.fillStyle = '#5c8a3a';
      ctx.fillRect(cx - LENS_R, cy + 10, LENS_R * 2, LENS_R);
      drawSpecies(near.kind, cx, cy + 10, near, animalScaleFor(near.kind) * 0.9);
    }
  });
  drawArrow(cx + ux * (LENS_R + 20), cy + uy * (LENS_R + 20), ux, uy);
  drawLabel(label, cx, cy - LENS_R - 12);
}

function drawPausePanel() {
  if (!paused) return;
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px sans-serif';
  ctx.fillText('Paused', W / 2, H / 2 - 10);

  ctx.font = '14px sans-serif';
