<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falcon Dive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d'); // swapped temporarily when pre-rendering cached sprites
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- Tunables ----------
const G = 9.81;               // gravity m/s²
const MAX_ALT = 500;
const DRAG = G / (95 * 95);   // base drag; terminal dive speed scales with the Streamlining upgrade
const BRAKE_DRAG = DRAG * 10;
const STALL_SPEED = 10;
const DIVE_SPEED = 40;        // above this (and pointing down) = dive mode
const SAFE_VSPEED = 14;       // max descent rate on ground contact (m/s)
const CRASH_REVEAL_DELAY = 0.9;
const BRAKE_UNLOCK = 0.3;     // after running dry, the meter must refill this far before braking again
const SHELL_CRACK_SPEED = 65; // m/s impact needed to crack a dropped turtle (~215 m free fall from rest)
const TURTLE_THROW = 10;      // m/s max extra push toward the cursor when releasing an aimed throw
const THROW_LOCK_GROUND = 20; // m from the predicted landing spot to lock onto a ground animal
const THROW_LOCK_AIR = 15;    // m from the predicted arc to lock onto a flying animal
const TURTLE_HOMING = 5;      // m/s² of sideways correction toward a locked target while falling
const SHADOW_VISIBLE_ALT = 125; // the bird casts a visibly noticeable shadow only below this height
const SHADOW_SPOOK_RANGE = 100; // shadow crossing within this horizontal distance is enough to spook prey
const shadowWorldX = () => bird.x + shadowOffset(bird.alt);
const shadowMaxReach = p => p.kind === 'squirrel' ? SHADOW_SPOOK_RANGE * 1.35 : p.kind === 'mouse' ? SHADOW_SPOOK_RANGE * 1.1 : SHADOW_SPOOK_RANGE;
const shadowInFront = p => {
  const dx = shadowWorldX() - p.x;
  return (dx * (facing(p) || 1) > 0 && Math.abs(dx) < SHADOW_SPOOK_RANGE);
};
const STARLING_COMBO_TIME = 2;    // seconds to grab more starlings after the first
const VIEW_MARGIN = 70;       // px kept between the top of the screen and the bird
const AIR_FOCUS_DIST = 70;    // metres; closer than this to a flying target and the camera frames the chase
// View height in metres = base + perSpeed·speed + perAlt·altitude, capped at max
const CAMERA_VIEW = { base: 25, perSpeed: 1.5, perAlt: 0.45, max: 300 };
const CHASE_ZOOM_MAX = 2.2;   // air-chase zoom never exceeds this × the normal zoom
// Soft ground framing: zoom out by up to (1 - zoomOut) to fit the ground with the bird `top` from the screen
// top, and pull the view toward the ground by `stick` (0 = pure bird-centred, 1 = ground always on the band);
// `fade` sets how far above the band (in band heights) the pull keeps working
const GROUND_FRAME = { top: 0.2, stick: 0.6, zoomOut: 0.58, fade: 2.6 };
function groundFitZoom(z) {
  const fit = (H * (1 - GROUND_FRAME.top) - groundPx()) / Math.max(1, bird.alt);
  return Math.max(Math.min(z, fit), z * GROUND_FRAME.zoomOut);
}
const CEILING_MARGIN = 12;    // m of sky shown above the ceiling at most
const CHASE_MIN_FLY = 0.8;    // s a bird must be airborne before the camera will frame a chase on it
const TURN_TIME = 1.2;        // s for a calm animal to turn around (body and gaze); spooked ones turn 3× faster
const lerp = (a, b, t) => a + (b - a) * t;
const groundPx = () => Math.max(90, H * 0.15); // screen space reserved for ground
const HILL_SCROLL = 0.5;      // px the far hills scroll per metre flown, independent of zoom
const LENS_R = 38;
const ABOVE_CEILING_DRAG = 0.35; // thin air above the ceiling: no flapping, but less drag
const PAUSE_BTN = { x: 10, y: 10, w: 44, h: 44 };
const DUST_DEVILS_ENABLED = false;

// ---------- Progression ----------
// A day runs from the Early Riser start hour to 20:00; clockText() maps tod -> hour as tod * 24 + 1.2
const todForHour = h => (h - 1.2) / 24;
const DAY_END_HOUR = 20;
const DUSK_WARN_HOUR = 19.5;
const CHAIN_TIME = 20, CHAIN_STEP = 0.2, CHAIN_MAX = 2;
const STARLING_EXTRA = 4;     // $ per extra starling grabbed in a combo
const BUZZARD_BOUNTY = 80;
// Turtle-only targets: the predators that hunt you
const HAZARD_BOUNTY = { cat: 200, hunter: 120, hawk: 150 };
const HAZARD_NAME = { cat: 'Cat', hunter: 'Hunter', hawk: 'Goshawk' };
const UPGRADE_COSTS = [40, 100, 220, 450];
// Per-tier stat tables (index = tier)
const STATS = {
  thrust:     [30, 37, 44, 52, 60],             // m/s² while flapping
  flapMax:    [180, 198, 216, 234, 252],        // km/h flapping speed cap
  stream:     [1, 1.1, 1.22, 1.35, 1.5],        // terminal dive speed multiplier
  agility:    [1, 1.2, 1.4, 1.6, 1.85],
  brakeDur:   [2.5, 3.4, 4.4, 5.5, 7.0],        // seconds of braking from a full meter
  brakeRef:   [5.0, 4.2, 3.5, 2.9, 2.4],        // seconds to refill from empty
  noise:      [1, 0.8, 0.62, 0.47, 0.35],
  // Stealth: prey sight, shadow, and how buzzards treat you
  sight:      [1, 0.85, 0.72, 0.6, 0.5],
  shadowAlt:  [75, 60, 48, 38, 30],             // prey only notice your shadow below this height
  steal:      [6, 4.5, 3.5, 2.5, 1.5],          // s a fresh catch can be stolen
  notice:     [150, 120, 95, 75, 55],           // m buzzards notice a prize from
  catchAlt:   [1, 1.25, 1.5, 1.75, 2],          // ground catch height multiplier
  airReach:   [1, 1.15, 1.3, 1.45, 1.6],        // air strike radius multiplier
  startHour:  [8, 7, 6.5, 6],
};
const fmtHour = h => `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.round((h % 1) * 60)).padStart(2, '0')}`;
const topKmh = (t = tier('stream')) => Math.round(Math.sqrt(G / (DRAG / STATS.stream[t] ** 2 * 0.8)) * 3.6);
// Hold-right-click aiming is always available; the track improves the throw itself
const AIM_LEVELS = ['Aimed throw', 'Strong throw (1.8× push)', 'Homing turtle (locks & homes)', 'Ricochet (bounces to 2 more targets)'];
const AIM_STATS = { push: [10, 18, 18, 18], homing: [0, 0, 6, 8], lock: [0, 0, 1, 1.3], bounces: [0, 0, 0, 2] };
const RICOCHET_RANGE = 80; // m a ricocheting shell looks for its next target
const UPGRADES = [
  { id: 'muscles', name: 'Flight Muscles', desc: 'Faster acceleration and flapping speed',
    stat: t => `${STATS.thrust[t]} m/s² · ${STATS.flapMax[t]} km/h` },
  { id: 'stream', name: 'Streamlining', desc: 'Less drag: higher top dive speed', stat: t => `top ${topKmh(t)} km/h` },
  { id: 'agility', name: 'Agility', desc: 'Turn faster at every speed', stat: t => `turning ×${STATS.agility[t]}` },
  { id: 'focus', name: 'Focus', desc: 'Bigger brake / slow-mo meter, faster refill',
    stat: t => `${STATS.brakeDur[t]} s · refill ${STATS.brakeRef[t]} s` },
  { id: 'silent', name: 'Silent Feathers', desc: 'Make less noise flapping, braking, diving', stat: t => `noise ×${STATS.noise[t]}` },
  { id: 'stealth', name: 'Stealth', desc: 'Prey and buzzards spot you later; less gets stolen',
    stat: t => `sight ×${STATS.sight[t]} · shadow <${STATS.shadowAlt[t]} m · steal ${STATS.steal[t]} s` },
  { id: 'talons', name: 'Talons', desc: 'Bigger catch window; longer turtle re-grab',
    stat: t => `ground ×${STATS.catchAlt[t]} · air reach ×${STATS.airReach[t]}` },
  { id: 'aim', name: 'Turtle Aim', desc: 'Stronger throws, then turtles that home and ricochet', costs: [60, 160, 350], stat: t => AIM_LEVELS[t] },
  { id: 'early', name: 'Early Riser', desc: 'Start hunting earlier in the day', costs: [75, 180, 350],
    stat: t => `start ${fmtHour(STATS.startHour[t])}` },
  { id: 'shell', name: 'Packed Lunch', desc: 'Start each day with a turtle in your talons', costs: [60],
    stat: t => t ? 'start carrying a turtle' : 'start empty-handed' },
  { id: 'rifle', name: 'Rifle', desc: 'Free aim, auto-fire, bazooka · armed at start from 6 shots',
    costs: [40, 90, 160, 280, 450], locked: () => !progress.gunFound,
    stat: t => `${GUN_LEVELS[t]} · ${GUN_STATS.ammo[t]} ${t >= 5 ? 'rockets' : 'shots'}` },
  { id: 'eyas', name: 'Eyas Brood', desc: 'Young hawks fly with you and hunt nearby prey for a 50% share', costs: [120, 260, 480],
    stat: t => t ? `${EYAS.count[t]} eyas${t > 1 ? 'es' : ''} · ${Math.round(EYAS.speed[t] * 3.6)} km/h · ${EYAS.range[t]} m` : 'hunting alone' },
  { id: 'screech', name: 'Screech', desc: 'Press E: everything nearby freezes in fear (even cats and hunters)', costs: [90, 220],
    stat: t => t ? `${SCREECH.radius[t]} m · ${SCREECH.freeze[t]} s freeze · every ${SCREECH.cool[t]} s` : 'no screech' },
  { id: 'lucky', name: 'Lucky Feather', desc: 'Survive a fatal cat, hunter or goshawk attack each day', costs: [150, 400],
    stat: t => `${LUCKY[t]} save${LUCKY[t] === 1 ? '' : 's'} per day` },
];
// Hunter rifle per Rifle tier: shots per gun, range (m), hit width (m), radius that spooks animals (m)
const GUN_LEVELS = ['Straight ahead', 'Double shot', 'Free aim', 'Six-shooter', 'Auto-fire (hold)', 'Bazooka (14 m blast)'];
const GUN_STATS = { ammo: [1, 2, 2, 6, 30, 8], range: [220, 240, 280, 320, 320, 400], width: [2.5, 2.5, 3, 3, 2.5, 3], spook: [150, 150, 150, 120, 120, 200] };
const shopUpgrades = () => UPGRADES.filter(u => !u.locked || !u.locked());
const upgradeCosts = u => u.costs || UPGRADE_COSTS;

const PROGRESS_KEY = 'falconDive.progress';
const freshProgress = () => ({ day: 1, money: 0, up: {}, best: { earned: 0, speed: 0 } });
let progress = freshProgress();
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (saved && typeof saved === 'object') {
      progress = { ...freshProgress(), ...saved, up: { ...(saved.up || {}) }, best: { ...freshProgress().best, ...(saved.best || {}) } };
      // Camouflage + Buzzard Wariness merged into Stealth: keep the higher tier
      const up = progress.up;
      if (up.camo || up.wary) {
        up.stealth = Math.max(up.stealth || 0, up.camo || 0, up.wary || 0);
        delete up.camo; delete up.wary;
      }
    }
  } catch { /* storage unavailable or corrupt */ }
}
function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch { /* storage unavailable */ }
}
const tier = id => progress.up[id] || 0;
function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u || (u.locked && u.locked())) return false;
  const t = tier(id), costs = upgradeCosts(u);
  if (t >= costs.length || progress.money < costs[t]) return false;
  progress.money -= costs[t];
  progress.up[id] = t + 1;
  saveProgress();
  return true;
}
loadProgress();

// Upgrade-driven flight and stealth stats
const dragBase = () => DRAG / STATS.stream[tier('stream')] ** 2;
const flapThrust = () => STATS.thrust[tier('muscles')];
const flapMaxSpeed = () => STATS.flapMax[tier('muscles')] / 3.6;
const brakeDuration = () => STATS.brakeDur[tier('focus')];
const brakeRecharge = () => STATS.brakeRef[tier('focus')];
const shadowDetectAlt = () => STATS.shadowAlt[tier('stealth')];
// Sprites shrink as the camera zooms out (down to SPRITE_MIN), so things that look close really are close
const SPRITE_REF_ZOOM = 5, SPRITE_MIN = 0.5;
const spriteK = () => clamp(cam.zoom / SPRITE_REF_ZOOM, SPRITE_MIN, 1);
// Air strike reach: ~22 px of (zoom-shrunk) sprite on screen, min 3 m, widened by Talons. Re-grabbing a falling turtle needs half that.
const airCatchRadius = () => Math.max(3, 22 * spriteK() / cam.zoom) * STATS.airReach[tier('talons')];
const talonGrabRange = () => airCatchRadius() * 0.5;
const stealWindow = () => STATS.steal[tier('stealth')];
const aimTier = () => tier('aim');
const throwPush = () => AIM_STATS.push[aimTier()];
const turtleHoming = () => AIM_STATS.homing[aimTier()];
const lockScale = () => AIM_STATS.lock[aimTier()];

// ---------- Input ----------
const mouse = { x: W / 2, y: H / 2, down: false, sliderDrag: false, sliderKind: null, aiming: false, talonTarget: null, throwHeld: false, steer: null };
const inPauseBtn = (x, y) =>
  x >= PAUSE_BTN.x && x <= PAUSE_BTN.x + PAUSE_BTN.w && y >= PAUSE_BTN.y && y <= PAUSE_BTN.y + PAUSE_BTN.h;

const SETTINGS_KEY = 'falconDive.settings';
const DEFAULT_ANIMAL_SIZES = {
  rabbit: 1.6,
  hare: 1.4,
  mouse: 2,
  squirrel: 1,
  turtle: 1.8,
  pigeon: 1.5,
  duck: 1.5,
  swift: 1,
  flock: 1.2,
};
let settings = { animalSizes: { ...DEFAULT_ANIMAL_SIZES }, previewKind: 'rabbit' };
function loadSettings() {
  settings.animalSizes = { ...DEFAULT_ANIMAL_SIZES };
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) {
      saveSettings();
      return;
    }
    const next = JSON.parse(raw);
    const saved = next.animalSizes && typeof next.animalSizes === 'object' ? next.animalSizes :
                  (next.animalScales && typeof next.animalScales === 'object' ? next.animalScales : null);
    if (saved) {
      for (const kind of Object.keys(DEFAULT_ANIMAL_SIZES)) {
        const value = saved[kind];
        if (typeof value === 'number') settings.animalSizes[kind] = clamp(value, 0.5, 4.5);
      }
      saveSettings();
      return;
    }
    if (typeof next.animalScale === 'number') {
      const scale = clamp(next.animalScale, 0.5, 4.5);
      for (const kind of Object.keys(DEFAULT_ANIMAL_SIZES)) settings.animalSizes[kind] = scale;
    }
    saveSettings();
  } catch {
    saveSettings();
  }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ animalSizes: DEFAULT_ANIMAL_SIZES })); } catch { /* storage unavailable */ }
}
function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
function setAnimalScale(kind, value) {
  if (!DEFAULT_ANIMAL_SIZES[kind]) return;
  settings.animalSizes[kind] = clamp(value, 0.5, 4.5);
  saveSettings();
}
function animalSizeFor(kind) { return settings.animalSizes[kind] ?? (SPECIES[kind]?.scale ?? 1); }
function animalScaleFor(kind) { return animalSizeFor(kind); }
function animalScaleSlider(kind, index) {
  const labelW = 78;
  const panelW = Math.min(W - 80, 660);
  const panelH = Math.min(H - 80, 420);
  const x0 = W / 2 - panelW / 2;
  const y0 = H / 2 - panelH / 2;
  const x = x0 + 90;
  const y = y0 + 46 + index * 26;
  const w = 160;
  return { kind, x, y, labelW, w };
}
function animalScaleHit(x, y) {
  for (const [index, kind] of Object.keys(DEFAULT_ANIMAL_SIZES).entries()) {
    const r = animalScaleSlider(kind, index);
    const hitX = x >= r.x && x <= r.x + r.w && y >= r.y - 8 && y <= r.y + 12;
    if (hitX) return kind;
  }
  return null;
}
function setAnimalScaleFromClientX(kind, clientX) {
  const index = Object.keys(DEFAULT_ANIMAL_SIZES).indexOf(kind);
  const r = animalScaleSlider(kind, index);
  const t = clamp((clientX - r.x) / r.w, 0, 1);
  setAnimalScale(kind, 0.5 + t * 3.5);
}
function copyAnimalSizes() {
  const text = `const DEFAULT_ANIMAL_SIZES = ${JSON.stringify(settings.animalSizes, null, 2)};`;
  try {
    if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    } else if (document && document.execCommand) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    state.toast = { text: 'Copied sizes', t: 1.8 };
  } catch {
    state.toast = { text: 'Copy blocked', t: 1.8 };
  }
}
function pauseCopyButtonHit(x, y) {
  const panelW = Math.min(W - 80, 660);
  const panelH = Math.min(H - 80, 420);
  const x0 = W / 2 - panelW / 2;
  const y0 = H / 2 - panelH / 2;
  const leftW = 320;
  const previewX = x0 + leftW + 18;
  const previewW = panelW - leftW - 36;
  const copyX = previewX + 10;
  const copyY = y0 + panelH - 82;
  const copyW = previewW - 20;
  return x >= copyX && x <= copyX + copyW && y >= copyY && y <= copyY + 26;
}
loadSettings();

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (screen !== 'hunt') {
    canvas.style.cursor = uiHit(e.clientX, e.clientY) ? 'pointer' : 'default';
    return;
  }
  if (paused && mouse.sliderDrag && mouse.sliderKind) {
    setAnimalScaleFromClientX(mouse.sliderKind, e.clientX);
  }
  if (paused) {
    canvas.style.cursor = inPauseBtn(e.clientX, e.clientY) ? 'pointer' : 'crosshair';
    return;
  }
  canvas.style.cursor = inPauseBtn(e.clientX, e.clientY) ? 'pointer' : 'crosshair';
});
canvas.addEventListener('mousedown', e => {
  if (screen !== 'hunt') {
    if (e.button === 0) clickUI(e.clientX, e.clientY);
    return;
  }
  if (state.crash && state.crash.t < CRASH_REVEAL_DELAY) return;
  if (state.over) { showRecap(); return; }
  if (inPauseBtn(e.clientX, e.clientY)) { togglePause(); return; }
  if (paused) {
    paused = false;
    return;
  }
  if (e.button === 2) {
    if (bird.carrying) {
      // Without the Aimed Throw upgrade, right-click just lets go
      mouse.aiming = true;
      mouse.throwHeld = true;
      mouse.talonTarget = null;
      // Free aim: hold the current course while the cursor aims the gun
      const a = birdAnchor();
      mouse.steer = bird.carrying.kind === 'gun' && gunFreeAim() ? { dx: mouse.x - a.x, dy: mouse.y - a.y } : null;
      return;
    }
    const target = nearestFallingTurtle();
    if (target) {
      mouse.aiming = true;
      mouse.throwHeld = false;
      mouse.talonTarget = target;
    }
    return;
  }
  mouse.down = true;
});
addEventListener('mouseup', e => {
  if (e.button !== 2) {
    mouse.down = false;
    mouse.sliderDrag = false;
    mouse.sliderKind = null;
    return;
  }
  if (mouse.aiming) {
    if (bird.carrying && mouse.throwHeld) {
      if (bird.carrying.kind !== 'gun') dropTurtle(true);
      else if (!gunAuto()) fireGun();
    } else if (mouse.talonTarget && nearestFallingTurtle() === mouse.talonTarget) {
      grabFallingTurtle(mouse.talonTarget);
    }
  }
  mouse.aiming = false;
  mouse.throwHeld = false;
  mouse.talonTarget = null;
  mouse.steer = null;
  mouse.sliderDrag = false;
  mouse.sliderKind = null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

let paused = false;
function togglePause() { paused = !paused; mouse.down = false; mouse.sliderDrag = false; mouse.sliderKind = null; mouse.aiming = false; mouse.throwHeld = false; mouse.talonTarget = null; }
addEventListener('keydown', e => {
  if (screen !== 'hunt') {
    if (e.key === 'Enter') { if (screen === 'recap') showShop(); else startDay(); }
    return;
  }
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && !state.over) togglePause();
  if (e.key === ' ') { e.preventDefault(); dropTurtle(); }
  if (e.key === 'e' || e.key === 'E') screech();
});
addEventListener('blur', () => { if (!state.over) paused = true; mouse.down = false; mouse.aiming = false; mouse.sliderDrag = false; mouse.sliderKind = null; });

// ---------- State ----------
let state, bird, prey, particles, cam;
function reset() {
  // New world layout each run, re-rolled until no thermal (and its buzzard) sits right at the start
  for (let tries = 0; tries < 30; tries++) {
    worldSeed = Math.random() * 1000;
    if (![-1, 0, 1].some(i => { const th = thermalCol(i); return th.on && Math.abs(th.x) < 350; })) break;
  }
  bird = { x: 0, alt: 220, speed: 20, angle: 0, flapT: 0, mode: 'GLIDE', passMin: Infinity, carrying: null,
           brakeE: 1, brakeLocked: false };
  prey = [];
  particles = [];
  cam = { x: 0, alt: 220, zoom: 2.5, zoomY: 2.5, gz: NaN, ox: NaN, oa: NaN, focus: 0, ft: null, shake: 0, lock: null, pin: null };
  state = { score: 0, catches: 0, over: false, msg: '', msgT: 0, msgTags: '', maxSpeed: 0, spawn: newSpawnWindow(0),
            hearingRadius: 8, crash: null,
            catchLog: [], time: 0, wake: [], wakeT: 0, fallers: [], rings: [], guns: [], tracers: [], rockets: [], blasts: [], fish: [],
            wind: { x: (Math.random() * 2 - 1) * 6, target: 0, changeT: 0, hx: (Math.random() * 2 - 1) * 10, htarget: 0, hchangeT: 0 },
            cloudOff: 0, cirrusOff: 0, fog: 0,
            tod: todForHour(STATS.startHour[tier('early')]), storm: { t: 0, dur: 1, next: 90 + Math.random() * 90, dir: 1, k: 0, flash: 0 },
            devils: [], devilT: 15, rivals: [], rivalSeen: {}, hazards: newHazards(), lastCatch: null,
            day: progress.day, dayCounts: {}, chainN: 0, chainT: -Infinity, bestChain: 1, steals: [],
            duskWarned: false, sunset: false, overT: 0, recap: null, eyases: [], featherFx: [], feathers: 0, screechCD: 0 };
  spawnPreyAhead();
}

// ---------- Day flow ----------
// 'hunt' → (sunset or crash) → 'recap' → 'shop' → next day's 'hunt'
let screen = 'hunt';
let uiButtons = [];
let uiT = 0;
let confirmReset = false;
const huntHour = () => state.tod * 24 + 1.2;

function endDay(reason) {
  if (state.over) return;
  state.over = true;
  state.overT = 0;
  mouse.down = false; mouse.aiming = false; mouse.throwHeld = false; mouse.talonTarget = null;
  const earned = Math.max(0, state.score);
  const records = [];
  if (earned > progress.best.earned) {
    if (progress.best.earned > 0) records.push(`Best day ever: $${earned}`);
    progress.best.earned = earned;
  }
  const topSpeed = Math.round(state.maxSpeed * 3.6);
  if (topSpeed > progress.best.speed) {
    if (progress.best.speed > 0) records.push(`Top speed record: ${topSpeed} km/h`);
    progress.best.speed = topSpeed;
  }
  state.recap = { day: state.day, reason, clock: clockText(), earned, walletBefore: progress.money,
                  catches: state.catchLog.slice(), steals: state.steals.slice(), topSpeed, bestChain: state.bestChain, records };
  progress.money += earned;
  progress.day = state.day + 1;
  saveProgress();
}
function showRecap() {
  if (!state.recap) return;
  screen = 'recap'; uiT = 0; paused = false;
}
function showShop() {
  screen = 'shop'; uiT = 0; confirmReset = false;
}
function startDay() {

// ---------- Scoring ----------
// $ = (bounty × repeat fatigue × (1 + bonuses) + first-of-species) × chain. dry = preview only (no side effects)
function priceCatch(kind, o = {}, dry = false) {
  const n = state.dayCounts[kind] || 0;
  const tags = [];
  let base = kind === 'buzzard' ? BUZZARD_BOUNTY : HAZARD_BOUNTY[kind] ?? SPECIES[kind].bounty;
  if (o.turtleHit && SPECIES[kind]) { base *= 3; tags.push('Turtle ×3'); }
  const fatigue = Math.max(0.4, 0.8 ** n);
  if (fatigue < 1) tags.push(`Repeat ×${fatigue.toFixed(2)}`);
  let bonus = 0;
  if (o.speed != null) {
    const kmh = o.speed * 3.6;
    const sp = kmh >= 300 ? ['Stoop', 1] : kmh >= 220 ? ['Blistering', 0.5] : kmh >= 150 ? ['Fast', 0.25] : null;
    if (sp) { bonus += sp[1]; tags.push(`${sp[0]} +${sp[1] * 100}%`); }
  }
  if (o.minAlt != null) {
    // Skim: pull out within the lowest 30% of the species' base catch height
    const skim = 0.5 * clamp(1 - o.minAlt / (0.3 * o.catchAlt), 0, 1);
    if (skim >= 0.05) { bonus += skim; tags.push(`Skim +${Math.round(skim * 100)}%`); }
  }
  if (o.unseen) { bonus += 0.5; tags.push('Unseen +50%'); }
  if (o.skeet) { bonus += 1; tags.push('Skeet +100%'); }
  if (o.below) { bonus += 1; tags.push('From below +100%'); }
  if (o.impact != null) {
    const imp = Math.max(0, Math.floor((o.impact - SHELL_CRACK_SPEED) * 3.6 / 10)) * 0.05;
    if (imp > 0) { bonus += imp; tags.push(`Impact +${Math.round(imp * 100)}%`); }
  }
  const fresh = n === 0 ? 10 : 0;
  if (fresh) tags.push('Fresh +$10');
  const chainN = state.time - state.chainT <= CHAIN_TIME ? state.chainN + 1 : 0;
  const chain = Math.min(CHAIN_MAX, 1 + CHAIN_STEP * chainN);
  if (chain > 1) tags.push(`Chain ×${chain.toFixed(1)}`);
  if (o.share) tags.push(`Eyas share ×${o.share}`);
  if (!dry) {
    state.dayCounts[kind] = n + 1;
    state.chainN = chainN; state.chainT = state.time;
    state.bestChain = Math.max(state.bestChain, chain);
  }
  return { value: Math.round((base * fatigue * (1 + bonus) + fresh) * chain * (o.share ?? 1)), tags };
}

// ---------- Prey species ----------
// scale: on-screen sprite size (deliberately larger than true scale so animals read clearly)
// bounty: base $ value, priced by how common and how hard each animal is
const SPECIES = {

  // minStrike: your own speed needed; minRel: speed relative to the prey needed (both m/s, written as km/h / 3.6)
  pigeon:   { name: 'Pigeon',   air: true,  bounty: 10, weight: 40, minStrike: 90 / 3.6, minRel: 54 / 3.6, alt: [30, 200], speed: 18, scale: 1.45 },
  duck:     { name: 'Duck',     air: true,  bounty: 45, weight: 20, minStrike: 120 / 3.6, minRel: 72 / 3.6, alt: [20, 120], speed: 25, scale: 1.7 },
  swift:    { name: 'Swift',    air: true,  bounty: 35, weight: 15, minStrike: 60 / 3.6, minRel: 36 / 3.6, alt: [40, 250], speed: 22, scale: 2.0 },
  flock:    { name: 'Starling', air: true,  bounty: 8,  weight: 25, minStrike: 0, minRel: 0, alt: [80, 300], speed: 15, scale: 2.7 },

  trout:    { name: 'Trout',    air: 'water', bounty: 30, weight: 0, depth: [0.6, 3], speed: 2.5, dart: 8, scale: 1.6 },
  pike:     { name: 'Pike',     air: 'water', bounty: 75, weight: 0, depth: [3, 15], speed: 1.6, dart: 6, scale: 2 },
};
const ICON_SCALE = 2.0;   // sprite scale that maps to 1.0 in catch-card icons
const FALCON_SCALE = 1.5; // minimum on-screen size of the player

// Spawn-weight multiplier by time of day (d = daylight 0..1, tw = twilight 0..1)
const ACTIVITY = {
  mouse: (d) => 0.5 + (1 - d) * 1.5,          // nocturnal
  hare: (d) => 0.5 + (1 - d),
  rabbit: (d, tw) => 0.6 + tw * 1.2,          // dawn and dusk
  squirrel: (d) => 0.2 + d,
  turtle: (d) => 0.2 + d,
  pigeon: (d) => 0.15 + d,
  duck: (d, tw) => 0.4 + d * 0.6 + tw * 0.5,
  swift: (d) => 0.1 + d,
  flock: (d, tw) => 0.4 + tw * 2,             // dusk murmurations
};

function pickKind(air) {
  const d = daylight(), tw = twilight();
  const kinds = Object.keys(SPECIES).filter(k => SPECIES[k].air === air);
  const wt = k => SPECIES[k].weight * ACTIVITY[k](d, tw);
  let r = Math.random() * kinds.reduce((sum, k) => sum + wt(k), 0);
  for (const k of kinds) { r -= wt(k); if (r <= 0) return k; }
  return kinds[0];
}

const randDir = () => (Math.random() < 0.5 ? -1 : 1);

function makeGround(x, kind = pickKind(false)) {
  const dir = randDir();
  const p = { kind, x, vx: dir * (2 + Math.random() * 4), hopT: Math.random() * 10, failCD: 0, alertT: 0, shadowReach: 0 };
  if (kind === 'hare') p.vx = dir * (1 + Math.random() * 2);
  if (kind === 'mouse') {
    p.home = x + randDir() * (20 + Math.random() * 25); p.wanderX = x;
    p.vx = dir * (1 + Math.random()); p.moving = true; p.pauseT = 0;
  }
  if (kind === 'squirrel') { p.wanderX = x; p.vx = dir * 2; }
  if (kind === 'turtle') p.vx = dir * 0.4;
  return p;
}

function makeAir(x, kind = pickKind(true)) {
  const s = SPECIES[kind], dir = randDir();
  const alt = s.alt[0] + Math.random() * (s.alt[1] - s.alt[0]);
  const p = { kind, x, alt, baseAlt: alt, vx: dir * s.speed, vy: 0, h: dir > 0 ? 0 : Math.PI,
              flapT: Math.random() * 10, t: Math.random() * 10, spookT: 0, turnT: 0, failCD: 0, alertT: 0, shadowReach: 0 };
  if (kind === 'flock') {
    p.scatterT = 0;
    p.members = Array.from({ length: 24 }, () => ({
      ox: (Math.random() - 0.5) * 30, oy: (Math.random() - 0.5) * 14, ph: Math.random() * 6.28,
      r: 1 + Math.random() * 3, dx: 0, dy: 0, svx: 0, svy: 0, caught: false, x, alt

}

// Prey live in a window around the bird that works in both directions. Each side has a spawn frontier that
// moves outward as the bird flies; when prey beyond SPAWN_KEEP are culled, the frontier is pulled back
// so that stretch is repopulated on a return visit.
const SPAWN_REACH = 1500, SPAWN_KEEP = 2500;
const groundGap = () => 150 + Math.random() * 300;
const airGap = () => 250 + Math.random() * 350;
function newSpawnWindow(x) {
  return { gLo: x - 150, gHi: x + 150, aLo: x - 300, aHi: x + 300, lakes: new Set() };
}

function spawnPreyAhead() {
  let s = state.spawn;
  const lo = bird.x - SPAWN_REACH, hi = bird.x + SPAWN_REACH;
  const keepLo = bird.x - SPAWN_KEEP, keepHi = bird.x + SPAWN_KEEP;
  // A jump past the whole window (e.g. a teleport) leaves nothing worth keeping; start a fresh window
  if (s.gHi < keepLo || s.gLo > keepHi) s = state.spawn = newSpawnWindow(bird.x);
  s.gHi = Math.min(s.gHi, keepHi); s.gLo = Math.max(s.gLo, keepLo);
  s.aHi = Math.min(s.aHi, keepHi); s.aLo = Math.max(s.aLo, keepLo);
  const ground = x => { if (!lakeAtX(x)) prey.push(makeGround(x)); };
  for (; s.gHi < hi; s.gHi += groundGap()) ground(s.gHi);
  for (; s.gLo > lo; s.gLo -= groundGap()) ground(s.gLo);
  for (; s.aHi < hi; s.aHi += airGap()) prey.push(makeAir(s.aHi));
  for (; s.aLo > lo; s.aLo -= airGap()) prey.push(makeAir(s.aLo));
  // Ducks resting on each lake in reach, ready to take off when they notice you
  for (let i = Math.floor((lo - 1300) / LAKE_SPACING); i <= Math.ceil((hi - 400) / LAKE_SPACING); i++) {
    const l = lakeAt(i);
    if (!l.on || s.lakes.has(i) || l.x0 > hi || l.x0 + l.w < lo) continue;
    s.lakes.add(i);
    for (let n = 0; n < 2 + Math.floor(Math.random() * 3); n++) {
      const d = makeAir(l.x0 + l.w * (0.15 + Math.random() * 0.7), 'duck');
      Object.assign(d, { sitting: true, alt: 0.4, lake: l, vx: randDir() * (0.6 + Math.random() * 0.6) });
      prey.push(d);
    }
    for (let n = 0; n < 4 + Math.floor(Math.random() * 4); n++) state.fish.push(makeFish(l, Math.random() < 0.7 ? 'trout' : 'pike'));
  }
  for (const i of s.lakes) {
    const l = lakeAt(i);
    if (l.x0 > keepHi || l.x0 + l.w < keepLo) s.lakes.delete(i);
  }
  prey = prey.filter(p => !p.gone && p.x > keepLo && p.x < keepHi);
  state.fish = state.fish.filter(f => !f.gone && f.x > keepLo && f.x < keepHi);
}

// ---------- Senses ----------
// Vision cone (world angle, up = positive) plus hearing that depends on how noisy the bird is
// Flying birds watch forward and down (where they're going and the ground below), so a stoop from above or behind goes unseen
// Gaze follows the animal's eased facing (turnK), so it sweeps over the top while it turns around

const SENSES = {
  rabbit:    { range: 60,  half: 1.0, reaction: 0.45, look: p => groundLook(p, 0.8) },
  hare:      { range: 75,  half: 1.2, reaction: 0.3,  look: p => groundLook(p, 0.9) }, // hare looks ahead; hearing is a simple full-circle radius
  mouse:     { range: 50,  half: 0.9, reaction: 0.5,  look: p => groundLook(p, 0.7) },
  squirrel:  { range: 75,  half: 1.0, reaction: 0.5,  look: p => groundLook(p, 0.8) }, // cone reaches down to the ground so it can see shadows
  turtle:    { range: 35,  half: 0.8, reaction: 0.7,  look: p => groundLook(p, 0.5) },
  pigeon:    { range: 45,  half: 1.4, reaction: 0.25, look: p => forwardDown(p, 0.6) },
  duck:      { range: 70,  half: 1.3, reaction: 0.4,  look: p => (p.sitting ? forwardDown(p, -0.8) : forwardDown(p, 0.6)) }, // resting ducks watch the sky
  swift:     { range: 30,  half: 1.5, reaction: 0.1,  look: p => forwardDown(p, 0.5) },

function updateHearingRange(dt) {
  const target = Math.max(bird.mode === 'FLAP' ? 40 : bird.mode === 'BRAKE' ? 25 : 0, diveNoise()) * STATS.noise[tier('silent')];
  const duration = target > state.hearingRadius ? 0.5 : 0.8;

const lookAngle = p => p.lookA ?? SENSES[p.kind].look(p);

// Gaze turns gradually so vision cones don't snap when an animal changes direction
function updateLook(p, dt) {

  // Nothing on land or in the air can make out a bird swimming more than a metre down

// ---------- Wind & thermals ----------
// Horizontal wind (m/s, + = rightward). Low and high layers change independently (wind shear),
// blended between 100 m and 350 m; gusts on top; weaker near the ground
function windX(alt) {
  const t = state.time, w = state.wind;
  const gust = Math.sin(t * 0.7) * 1.5 + Math.sin(t * 1.9 + 1) * 0.8;
  const k = Math.min(1, Math.max(0, (alt - 100) / 250));
  const layer = w.x + (w.hx - w.x) * k * k * (3 - 2 * k);
  const storm = state.storm.dir * 16 * state.storm.k * (1 + 0.3 * Math.sin(t * 3));
  return (layer + gust + storm) * (0.3 + 0.7 * Math.min(1, Math.max(0, alt) / 200));
}

function updateWind(dt) {
  const w = state.wind;
  w.changeT -= dt;
  if (w.changeT <= 0) { w.target = (Math.random() * 2 - 1) * 10; w.changeT = 20 + Math.random() * 20; }
  w.hchangeT -= dt;
  if (w.hchangeT <= 0) { w.htarget = (Math.random() * 2 - 1) * 14; w.hchangeT = 25 + Math.random() * 25; }
  w.x += (w.target - w.x) * Math.min(1, dt * 0.1);
  w.hx += (w.htarget - w.hx) * Math.min(1, dt * 0.08);
  state.cloudOff += windX(CLOUD_BASE) * dt;
  state.cirrusOff += windX(480) * dt;
}

const THERMAL_SPACING = 700;
function thermalCol(i) {
  return { x: i * THERMAL_SPACING + wh(i * 3.1) * 400, on: wh(i * 7.7) < 0.6,
           s: 12 + wh(i * 5.3) * 12, w: 30 + wh(i * 2.9) * 20 };
}

// Broad sinking air, roughly between thermals
function sinkCol(i) {
  return { x: (i + 0.5) * THERMAL_SPACING + (wh(i * 4.1) - 0.5) * 200, on: wh(i * 6.6) < 0.5,
           s: 2 + wh(i * 8.2) * 3, w: 50 + wh(i * 9.4) * 40 };
}

// Vertical air movement (m/s): thermal lift minus sink, fading in near the ground and out at the ceiling
function updraft(x, alt) {
  if (alt > MAX_ALT) return 0;
  const i0 = Math.floor(x / THERMAL_SPACING);
  let u = 0;
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const th = thermalCol(i);
    if (th.on) {
      const d = (x - th.x) / th.w;
      if (Math.abs(d) < 3) u += th.s * Math.exp(-d * d);
    }
    const sk = sinkCol(i);
    if (sk.on) {
      const d = (x - sk.x) / sk.w;
      if (Math.abs(d) < 3) u -= sk.s * Math.exp(-d * d);
    }
  }
  u += ridgeLift(x, alt);
  if (DUST_DEVILS_ENABLED) {
    for (const dv of state.devils) {
      if (alt > dv.top) continue;
      const d = (x - dv.x) / dv.w;
      if (Math.abs(d) < 3) u += dv.s * Math.exp(-d * d) * devilFade(dv) * (1 - alt / dv.top);
    }
  }
  return u * Math.min(1, Math.max(0, alt) / 15) * Math.min(1, (MAX_ALT - alt) / 50);
}

// ---------- Day/night ----------
const DAY_LENGTH = 240; // seconds per full day
const sunPhase = () => ((state.tod - 0.15) / 0.7) * Math.PI; // 0 at sunrise (east/left), PI at sunset
const daylight = () => Math.max(0, Math.min(1, Math.sin(sunPhase()) * 3 + 0.3));
const twilight = () => Math.max(0, 1 - Math.abs(Math.sin(sunPhase())) * 4); // peaks at sunrise/sunset
const clockText = () => {
  const h = (state.tod * 24 + 1.2) % 24;
  return `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')}`;
};
// Horizontal offset of a shadow cast from this altitude, away from the sun
function shadowOffset(alt) {
  const ph = sunPhase();
  return (alt * Math.cos(ph)) / Math.max(0.25, Math.sin(ph));
}

// ---------- Weather ----------
function updateWeather(dt) {
  if (!DUST_DEVILS_ENABLED) {
    state.devils = [];
    state.devilT = Infinity;
    state.tod = (state.tod + dt / DAY_LENGTH) % 1;
    const s = state.storm;
    s.next -= dt;
    if (s.t <= 0 && s.next <= 0) {
      s.t = s.dur = 20 + Math.random() * 15; s.dir = randDir(); s.next = 120 + Math.random() * 120;
      state.msg = 'A storm front is rolling in!'; state.msgT = 2.5;
    }
    if (s.t > 0) s.t -= dt;
    s.k = s.t > 0 ? Math.sin(Math.PI * (1 - s.t / s.dur)) : 0;
    s.flash = Math.max(0, s.flash - dt);
    if (s.k > 0.6 && Math.random() < dt * 0.15) s.flash = 0.15;
    return;
  }
  state.tod = (state.tod + dt / DAY_LENGTH) % 1;
  const s = state.storm;
  s.next -= dt;
  if (s.t <= 0 && s.next <= 0) {
    s.t = s.dur = 20 + Math.random() * 15; s.dir = randDir(); s.next = 120 + Math.random() * 120;
    state.msg = 'A storm front is rolling in!'; state.msgT = 2.5;
  }
  if (s.t > 0) s.t -= dt;
  s.k = s.t > 0 ? Math.sin(Math.PI * (1 - s.t / s.dur)) : 0;
  s.flash = Math.max(0, s.flash - dt);
  if (s.k > 0.6 && Math.random() < dt * 0.15) s.flash = 0.15;

  // Dust devils: short-lived spinning columns that wander over open ground ahead of you
  state.devilT -= dt;
  if (state.devilT <= 0) {
    state.devilT = 15 + Math.random() * 20;
    const x = bird.x + Math.sign(bird.vx || 1) * (250 + Math.random() * 350);
    if (!lakeAtX(x)) state.devils.push({ x, vx: randDir() * (1 + Math.random() * 2), t: 0,
      life: 12 + Math.random() * 10, s: 20 + Math.random() * 8, w: 6 + Math.random() * 3, top: 100 + Math.random() * 60 });
  }
  for (const dv of state.devils) { dv.t += dt; dv.x += (dv.vx + windX(5)) * dt; }
  state.devils = state.devils.filter(dv => dv.t < dv.life);
}
const devilFade = dv => Math.min(1, dv.t / 2, (dv.life - dv.t) / 2);

// ---------- Terrain: ridges (background) and lakes ----------
const RIDGE_SPACING = 1800;
function ridgeAt(i) {
  return { x: i * RIDGE_SPACING + 600 + wh(i * 1.7 + 3) * 600, on: wh(i * 2.3 + 1) < 0.55,
           h: 60 + wh(i * 3.9 + 2) * 80, w: 220 + wh(i * 5.1 + 4) * 160 };
}
// Wind striking a ridge rises on the windward slope and tumbles into turbulence on the lee side
function ridgeLift(x, alt) {
  const i0 = Math.floor(x / RIDGE_SPACING);
  let u = 0;
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const r = ridgeAt(i);
    if (!r.on || alt > r.h * 2.5) continue;
    const dx = x - r.x, reach = r.w * 0.9;
    if (Math.abs(dx) > reach) continue;
    const w = windX(r.h);
    const hFade = 1 - alt / (r.h * 2.5), xFade = 1 - Math.abs(dx) / reach;
    if (Math.sign(dx) === -Math.sign(w)) u += Math.abs(w) * 1.5 * hFade * xFade;
    else u -= Math.abs(w) * 0.5 * hFade * xFade * (0.5 + 0.5 * Math.sin(state.time * 5 + x * 0.3));
  }
  return u;
}

const LAKE_SPACING = 1300;
function lakeAt(i) {
  return { x0: i * LAKE_SPACING + 400 + wh(i * 6.1 + 5) * 700, w: 150 + wh(i * 7.3 + 6) * 300, on: wh(i * 8.9 + 7) < 0.75,
           depth: 10 + wh(i * 4.3 + 8) * 8 };
}
function lakeAtX(x) {
  const i = Math.floor((x - 400) / LAKE_SPACING);
  for (const l of [lakeAt(i), lakeAt(i - 1)]) if (l.on && x >= l.x0 && x <= l.x0 + l.w) return l;
  return null;
}

// ---------- Clouds ----------
const CLOUD_BASE = 300; // cumulus form where thermals reach the condensation level

function makeCumulus(x, seed, size = 1) {
  return { x, seed, base: CLOUD_BASE + (wh(seed) - 0.5) * 40,
           w: (80 + wh(seed + 1) * 90) * size, h: (35 + wh(seed + 2) * 45) * size };
}

// Cumulus capping each active thermal, plus smaller drifting fair-weather clouds
function cumulusIn(x0, x1) {
  const out = [];
  for (let i = Math.floor(x0 / THERMAL_SPACING) - 1; i <= Math.ceil(x1 / THERMAL_SPACING) + 1; i++) {
    const th = thermalCol(i);
    if (th.on) out.push(makeCumulus(th.x, i * 1.37));
  }
  const S = 520, off = state.cloudOff;
  for (let j = Math.floor((x0 - off) / S) - 1; j <= Math.ceil((x1 - off) / S) + 1; j++) {
    if (wh(j * 2.71 + 9) < 0.45) out.push(makeCumulus(j * S + off + wh(j * 1.9) * 200, j * 3.3 + 50, 0.6));
  }
  return out;
}

function insideCloud(x, alt) {
  return cumulusIn(x - 200, x + 200).some(c =>
    Math.abs(x - c.x) < c.w * 0.4 && alt > c.base && alt < c.base + c.h * 1.2);
}

const groundEscapeTime = {
  rabbit: 4.5, hare: 3.2, squirrel: 4.5, turtle: 5.0,
};
const airEscapeTime = {
  pigeon: 4.5, duck: 3.5, swift: 3.2, flock: 3.8,
};

function updateGroundPrey(p, dt) {
  const hdx = p.x - bird.x, hdist = Math.abs(hdx);
  let vx = p.vx;
  switch (p.kind) {
    case 'rabbit':
      p.hopT += dt;
      wanderFlip(p, dt);
      vx = p.vx;
      break;
    case 'hare':
      // Bolts with zig-zag jukes once it sees or hears the bird
      if (!(p.spookT > 0) && sensed(p, dt)) {
        p.spookT = 4; p.alertT = 0.8; p.dir = Math.sign(hdx) || 1; p.jukeT = 0.6 + Math.random() * 0.6;
      }
      if (p.spookT > 0) {
        p.spookT -= dt; p.jukeT -= dt;
        if (p.jukeT <= 0) {
          p.dir = -p.dir;
          const away = p.dir === (Math.sign(p.x - bird.x) || 1);
          p.jukeT = away ? 0.6 + Math.random() * 0.6 : 0.2 + Math.random() * 0.25;
        }
        vx = p.dir * 16;
        p.hopT += dt * 2.5;
      } else {
        wanderFlip(p, dt);
        vx = p.vx; p.hopT += dt;
      }
      break;
    case 'mouse': {
      if (p.hidden) {
        p.hideT -= dt;
        if (p.hideT <= 0 && hdist > 60) p.hidden = false;
        return;
      }
      if (!p.fleeing && sensed(p, dt)) { p.fleeing = true; p.alertT = 0.8; }
      if (p.fleeing) {
        const d = p.home - p.x;
        if (Math.abs(d) < 0.5) {
          p.hidden = true; p.fleeing = false; p.hideT = 5; p.x = p.home;
          p.curVx = 0; p.moving = false; p.aware = 0; p.alertT = 0;
          return;
        }
        vx = Math.sign(d) * Math.min(9, Math.abs(d) / dt);
        p.moving = true;
        p.hopT += dt * 4;
        break;
      }
      p.pauseT -= dt;
      if (p.pauseT <= 0) {
        p.moving = !p.moving;
        p.pauseT = p.moving ? 0.3 + Math.random() * 0.8 : 0.5 + Math.random() * 1.5;
        if (p.moving && Math.random() < 0.5) p.vx *= -1;
      }
      if (Math.abs(p.x - p.wanderX) > 10) p.vx = Math.sign(p.wanderX - p.x) * Math.abs(p.vx);
      vx = p.moving ? p.vx : 0;
      if (p.moving) p.hopT += dt;
      break;
    }
    case 'squirrel': {
      if (!p.fleeing && sensed(p, dt)) { p.fleeing = true; p.alertT = 0.8; }
      if (p.fleeing) {
        p.feintT = (p.feintT ?? 0) - dt;
        if (p.feintT <= 0) {
          p.feint = !p.feint;
          p.feintT = p.feint ? 0.12 + Math.random() * 0.1 : 0.55 + Math.random() * 0.35;
          const away = Math.sign(hdx) || Math.sign(p.face || p.vx) || 1;
          p.dir = p.feint ? -away : away;
        }
        vx = p.dir * (p.feint ? 7 : 22);
        p.hopT += dt * (p.feint ? 2 : 4);
      } else {
        if (Math.abs(p.x - p.wanderX) > 10) p.vx = Math.sign(p.wanderX - p.x) * 2;
        else wanderFlip(p, dt);
        vx = p.vx; p.hopT += dt;
      }
      break;
    }
    case 'turtle':
      p.hopT += dt;
      break;
  }
  if (p.fleeing && !p.hidden && p.kind !== 'mouse') {
    const away = Math.sign(p.x - bird.x) || (p.face ?? (p.vx || 1));
    p.escapeT = (p.escapeT || 0) + dt;
    const maxEscape = groundEscapeTime[p.kind] ?? 4;
    if (!p.spent && p.escapeT >= maxEscape) {
      p.spent = true;
      p.outran = true;
      p.fadeT = 1.2;
      p.alertT = 0.8;
    }
    if (p.kind !== 'squirrel') {
      const speedBoost = 10 + Math.min(8, p.escapeT * 2);
      vx = away * speedBoost;
      if (p.kind === 'hare') vx += (Math.random() - 0.5) * 2.5;
      p.hopT += dt * 2.4;
    }
  }
  if (p.spent) {
    p.fadeT = (p.fadeT ?? 1.2) - dt;
    if (p.fadeT <= 0) { p.gone = true; return; }
  }
  if (vx !== 0) p.face = vx;
  vx *= turnAlign(p, vx);
  p.curVx = vx;
  p.x += vx * dt;
}

function spookAir(p) {
  p.spookT = 3; p.alertT = 0.8;
  p.vx = (Math.sign(p.x - bird.x) || 1) * Math.abs(p.vx);
  if (p.kind === 'swift') p.h = Math.atan2(p.alt - bird.alt, p.x - bird.x);
}

// A duck resting on the water bursts into flight, away from the bird
function duckTakeOff(p) {
  if (!p.sitting) return;
  p.sitting = false; p.alertT = 0.8; p.spookT = 2; p.noticed = true;
  p.vx = (Math.sign(p.x - bird.x) || 1) * SPECIES[p.kind].speed * 0.6; p.vy = 8;
}

function updateAirPrey(p, dt) {
  const s = SPECIES[p.kind];
  p.t += dt; p.spookT -= dt;
  if (p.spookT > 0 || p.fleeing || p.scatterT > 0) {
    p.escapeT = (p.escapeT || 0) + dt;
    const maxEscape = airEscapeTime[p.kind] ?? 4;
    if (!p.spent && p.escapeT >= maxEscape) {
      p.spent = true;
      p.outran = true;
      p.fadeT = 1.2;
      p.alertT = 0.8;
    }
  }
  p.flapT += dt * (p.kind === 'duck' ? 18 : p.kind === 'swift' ? 9 : 13);
  if (p.sitting) {
    // Paddling on the lake until something gives you away
    p.flapT = 0; p.alt = 0.4; p.vy = 0;
    if (p.x < p.lake.x0 + 5) p.vx = Math.abs(p.vx);
    if (p.x > p.lake.x0 + p.lake.w - 5) p.vx = -Math.abs(p.vx);
    p.x += p.vx * dt;
    if (sensed(p, dt)) duckTakeOff(p);
    return;
  }
  if (p.kind === 'pigeon' || p.kind === 'duck') {
    if (p.spookT <= 0 && sensed(p, dt)) spookAir(p);
    const target = (p.spookT > 0 ? 1.5 : 1) * s.speed;
    p.vx = Math.sign(p.vx) * (Math.abs(p.vx) + (target - Math.abs(p.vx)) * Math.min(1, dt * 2));
    p.vy = p.spookT > 0 ? 4 : (p.baseAlt - p.alt) * 0.5 + Math.sin(p.t * 1.3) * 1.2;
  } else if (p.kind === 'swift') {
    p.turnT -= dt;
    if (p.spookT <= 0 && sensed(p, dt)) { spookAir(p); p.spookT = 1; }
    else if (p.turnT <= 0) { p.h += randDir() * (0.8 + Math.random() * 0.8); p.turnT = 0.4 + Math.random() * 0.6; }
    if ((p.alt < s.alt[0] && Math.sin(p.h) < 0) || (p.alt > s.alt[1] && Math.sin(p.h) > 0)) p.h = -p.h;
    p.vx = Math.cos(p.h) * s.speed;
    p.vy = Math.sin(p.h) * s.speed;
  } else if (p.kind === 'flock') {
    p.vy = (p.baseAlt - p.alt) * 0.3 + Math.sin(p.t * 0.5) * 2;
    if (!p.combo && p.scatterT <= 0 && sensed(p, dt)) {
      p.scatterT = 3; p.alertT = 0.8;
      for (const m of p.members) {
        const a = Math.atan2(m.oy, m.ox) + (Math.random() - 0.5);
        m.svx = Math.cos(a) * 14; m.svy = Math.sin(a) * 14;
      }
    }
    p.scatterT -= dt;
    const damp = 1 - Math.min(1, dt * 0.8), regroup = 1 - Math.min(1, dt * 0.6);
    for (const m of p.members) {
      m.ph += dt * (1.2 + m.r * 0.2);
      m.dx += m.svx * dt; m.dy += m.svy * dt;
      m.svx *= damp; m.svy *= damp;
      if (p.scatterT <= 0) { m.dx *= regroup; m.dy *= regroup; }
      m.x = p.x + m.ox + Math.cos(m.ph) * m.r * 2 + m.dx;
      m.alt = Math.max(2, p.alt + m.oy + Math.sin(m.ph * 1.3) * m.r + m.dy);
    }
    if (p.members.every(m => m.caught)) p.gone = true;
    if (p.combo && !p.spent && (p.combo.t -= dt) <= 0) { p.spent = true; p.fadeT = 1; }
  }
  if (p.spent && (p.fadeT -= dt) <= 0) p.gone = true;
  p.x += (p.vx + windX(p.alt)) * dt;
  p.alt = Math.max(3, p.alt + p.vy * dt);
}

// Closest approach between a point and the bird's path during this frame
function sweptDist(px, palt, dt) {
  const x0 = bird.x - bird.vx * dt, a0 = bird.alt - bird.vy * dt;
  const sx = bird.x - x0, sa = bird.alt - a0;
  const len2 = sx * sx + sa * sa || 1;
  const u = Math.max(0, Math.min(1, ((px - x0) * sx + (palt - a0) * sa) / len2));
  return Math.hypot(px - (x0 + sx * u), palt - (a0 + sa * u));
}

function award(entry, priced, msg) {
  const e = { ...entry, pts: priced.value, tags: priced.tags, t: state.time };
  state.score += e.pts;
  state.catches++;
  state.catchLog.push(e);
  state.lastCatch = e;
  state.msg = `${msg} +$${e.pts}`;
  state.msgTags = priced.tags.join('  ·  ');
  state.msgTagsFor = state.msg;
  state.msgT = 2;
  return e;
}

// Extra starlings grabbed while a flock combo is open add a flat amount (×3 for turtle hits) and keep the chain alive
function addStarling(p, turtleHit) {
  const e = p.combo.entry;
  const extra = Math.round(STARLING_EXTRA * (turtleHit ? 3 : 1) * chainMult());
  e.count++; e.pts += extra; e.t = state.time;
  state.score += extra;
  state.chainT = state.time;
  state.msg = `Starlings ×${e.count}! +$${e.pts}`;
  state.msgT = 2;
}

function checkCatch(p, dt) {
  const s = SPECIES[p.kind];
  // An animal fading out after its flee timer ran out is still on screen and can still be caught
  if (p.spent && !p.outran) return;
  if (p.failCD > 0) { p.failCD -= dt; return; }
  if (!s.air) {
    if (p.hidden) return;
    const dx = p.x - bird.x, prevDx = dx + (bird.vx - (p.curVx || 0)) * dt;
    const crossed = Math.sign(dx) !== Math.sign(prevDx);
    if (!((Math.abs(dx) < s.radius || crossed) && bird.alt < s.catchAlt * STATS.catchAlt[tier('talons')])) return;
    if (p.kind === 'turtle') {
      p.gone = true;
      bird.carrying = { kind: 'turtle' };
      state.msg = 'Got the turtle! Drop it hard enough to crack the shell';
      state.msgT = 3;
      return;
    }
    p.gone = true;
    const minAlt = Math.min(bird.passMin, bird.alt);
    const priced = priceCatch(p.kind, { speed: bird.speed, minAlt, catchAlt: s.catchAlt, unseen: !p.noticed });
    award({ kind: p.kind, speed: bird.speed, minAlt }, priced, `${s.name}!`);
    return;
  }
  const r = airCatchRadius();
  const strike = bird.speed;
  // Points reward the angle of attack: relative speed between you and the prey
  const closing = Math.hypot(bird.vx - p.vx - windX(p.alt), bird.vy - p.vy);
  const targets = p.kind === 'flock' ? p.members.filter(m => !m.caught) : [p];
  for (const tgt of targets) {
    if (sweptDist(tgt.x, tgt.alt, dt) > r) continue;
    if (strike < s.minStrike || closing < s.minRel) {
      if (p.combo) continue;
      p.failCD = 1.5;
      if (p.kind === 'flock') p.scatterT = 0;
      else { spookAir(p); p.spent = true; p.fadeT = 1.5; } // escaped for good: flees and fades out
      state.msg = strike < s.minStrike
        ? `Too slow — ${s.name} escaped (${(strike * 3.6).toFixed(0)} km/h, need ${(s.minStrike * 3.6).toFixed(0)})`
        : `Bad angle — ${s.name} escaped (relative ${(closing * 3.6).toFixed(0)} km/h, need ${(s.minRel * 3.6).toFixed(0)})`;
      state.msgT = 2;
      return;
    }
    if (p.kind === 'flock') {
      tgt.caught = true;
      if (!p.combo) {
        // First catch scatters the flock for good; grab more before they're gone
        const priced = priceCatch('flock', { speed: bird.speed, unseen: !p.noticed });
        const entry = award({ kind: 'flock', speed: bird.speed, rel: closing, alt: tgt.alt, air: true, count: 1 }, priced, 'Starling! Grab more');
        p.combo = { entry, t: STARLING_COMBO_TIME };
        p.scatterT = Infinity;
        for (const m of p.members) {
          const a = Math.atan2(m.oy + m.dy, m.ox + m.dx) + (Math.random() - 0.5);
          m.svx = Math.cos(a) * 20; m.svy = Math.sin(a) * 20;
        }
      } else {
        addStarling(p, false);
      }
      return;
    }
    p.gone = true;
    const priced = priceCatch(p.kind, { speed: bird.speed, unseen: !p.noticed });
    award({ kind: p.kind, speed: bird.speed, rel: closing, alt: tgt.alt, air: true }, priced, `${s.name}!`);
    return;
  }
}

// Release velocity: the bird's own, plus (when aimed) a push toward the cursor
function throwVelocity(aimed) {
  let vx = bird.vx, vy = bird.vy;
  if (aimed) {
    const ax = cam.x + (mouse.x - W / 2) / cam.zoom - bird.x;
    const ay = cam.alt + (H / 2 - mouse.y) / cam.zoomY - bird.alt;
    const d = Math.hypot(ax, ay) || 1, push = Math.min(throwPush(), d * 0.2 * throwPush() / TURTLE_THROW);
    vx += (ax / d) * push; vy += (ay / d) * push;
  }
  return { vx, vy };
}

function nearestFallingTurtle() {
  let best = null, bestD = Infinity;
  for (const f of state.fallers) {
    if (f.done || (f.alt <= 0 && (f.struck || f.hitBuzzard))) continue;
    const d = Math.hypot(f.x - bird.x, f.alt - bird.alt);
    if (d < bestD) { bestD = d; best = f; }
  }
  return best;
}

function grabFallingTurtle(target, dt = 0) {
  if (!target || target.done || bird.carrying || state.over || paused) return;
  if (target.alt <= 0) return;
  // Swept along this frame's path (like air strikes) so a fast pass can't skip over the small grab range
  const d = dt ? sweptDist(target.x, target.alt, dt) : Math.hypot(target.x - bird.x, target.alt - bird.alt);
  if (d > talonGrabRange()) return;
  target.done = true;
  bird.carrying = { kind: 'turtle', midair: true };
  state.msg = 'Talon grab! Turtle in hand';
  state.msgT = 2;
}

function dropTurtle(aimed = false) {
  if (!bird.carrying || state.over || paused) return;
  if (bird.carrying.kind === 'gun') {
    // Space with the rifle: let it fall; it can be picked up again
    state.guns.push({ x: bird.x, alt: bird.alt, vx: bird.vx, vy: bird.vy, ammo: bird.carrying.ammo, noGrab: GUN_REGRAB_T });
    bird.carrying = null;
    return;
  }
  const { vx, vy } = throwVelocity(aimed);
  const target = aimed && turtleHoming() > 0 ? pickThrowTarget(simulateThrow(bird.x, bird.alt, vx, vy)) : null;
  state.fallers.push({ x: bird.x, alt: bird.alt, vx, vy, dropAlt: bird.alt, spin: 0, target, homing: turtleHoming(), bounces: AIM_STATS.bounces[aimTier()] });
  bird.carrying = null;
}

// Same integration as a real falling turtle (gravity + drifting toward the wind), sampled for the aim preview
function simulateThrow(x, alt, vx, vy) {
  const pts = [{ x, alt }], step = 1 / 30;
  for (let i = 0; i < 600 && alt > 0; i++) {
    vy -= G * step;
    vx += (windX(alt) - vx) * Math.min(1, step * 0.2);
    x += vx * step; alt += vy * step;
    pts.push({ x, alt: Math.max(0, alt) });
  }
  return pts;
}

// Animal the throw is lined up on: a ground animal near the landing spot, or a flier close to the arc
function pickThrowTarget(path) {
  const end = path[path.length - 1], LA = THROW_LOCK_AIR * (lockScale() || 1), LG = THROW_LOCK_GROUND * (lockScale() || 1);
  let best = null, bestD = Infinity;
  for (const p of prey) {
    if (p.gone || p.hidden || p.spent || p.kind === 'turtle') continue;
    let d;
    if (SPECIES[p.kind].air && !p.sitting) {
      d = Infinity;
      for (let i = 0; i < path.length; i += 3) d = Math.min(d, Math.hypot(path[i].x - p.x, path[i].alt - p.alt));
      if (d > LA) continue;
    } else {
      d = Math.abs(p.x - end.x);
      if (d > LG) continue;
    }
    if (d < bestD) { bestD = d; best = p; }
  }
  for (const r of state.rivals) {
    if (r.gone || r.mode === 'return' && Math.hypot(r.x - end.x, r.alt - end.alt) > LA) continue;
    const d = Math.hypot(r.x - end.x, r.alt - end.alt);
    const match = d < LA && (Math.abs(r.x - end.x) < LG || d < LA);
    if (!match) continue;
    if (d < bestD) { bestD = d; best = { kind: 'buzzard', x: r.x, alt: r.alt, target: r }; }
  }
  for (const t of hazardTargets()) {
    let d;
    if (t.air) {
      d = Infinity;
      for (let i = 0; i < path.length; i += 3) d = Math.min(d, Math.hypot(path[i].x - t.x, path[i].alt - t.alt));
      if (d > LA) continue;
    } else {
      d = Math.abs(t.x - end.x);
      if (d > LG) continue;
    }
    if (d < bestD) { bestD = d; best = t; }
  }
  return best;
}

function isBuzzardTarget(target) {
  return target && target.kind === 'buzzard';
}

// Predators as turtle targets (wrappers like the buzzard lock). Cats can't be locked: hitting one is pure skill
function hazardTargets() {
  const hz = state.hazards, out = [];
  for (const h of hz.hunters) if (!h.gone) out.push({ kind: 'hunter', x: h.x, alt: 0, air: false, target: h });
  if (hz.hawk && !hz.hawk.gone) out.push({ kind: 'hawk', x: hz.hawk.x, alt: hz.hawk.alt, air: true, target: hz.hawk });
  return out;
}

// Body boxes: a hunter stands ~1.9 m tall, a cat ~0.6 m; the goshawk is hit like a buzzard
function hazardHitBy(f) {
  const hz = state.hazards;
  for (const c of hz.cats) {
    if (!c.gone && Math.abs(c.x - f.x) < 2.5 && f.alt < c.alt + 1.2 && f.alt > c.alt - 0.8) return { kind: 'cat', obj: c };
  }
  for (const h of hz.hunters) {
    if (!h.gone && Math.abs(h.x - f.x) < 2 && f.alt < 2.2) return { kind: 'hunter', obj: h };
  }
  const h = hz.hawk;
  if (h && !h.gone && Math.hypot(h.x - f.x, h.alt - f.alt) < 5) return { kind: 'hawk', obj: h };
  return null;
}

function hazardStrike(f, kind, obj) {
  const impact = Math.hypot(f.vx, f.vy);
  const unseen = kind === 'cat' && obj.mode === 'hide';
  // Marked stolen so a buzzard can't steal it back
  award({ kind: 'turtle', speed: impact, turtleHit: true, targetKind: kind, stolen: true },
        priceCatch(kind, { impact, unseen }), `TURTLE STRIKE! ${HAZARD_NAME[kind]}`);
  state.msgT = 2.5;
  removeHazard(kind, obj);
  f.struck = true;
  f.hitBuzzard = true;
  ricochet(f);
}

// Takes a predator out for the day; a downed hunter drops his rifle
function removeHazard(kind, obj) {
  obj.gone = true;
  const hz = state.hazards;
  if (kind === 'hawk') { hz.hawk = null; hz.hawkT = Math.max(hz.hawkT, 45); }
  if (kind === 'hunter') {
    state.guns.push({ x: obj.x, alt: 1.5, vx: (Math.random() - 0.5) * 6, vy: 5, ammo: gunStat('ammo') });
    state.msg += '  ·  He dropped his rifle!';
  }
  for (let i = 0; i < 20; i++) particles.push({
    x: obj.x, alt: Math.max(0.5, obj.alt || 1), vx: (Math.random() - 0.5) * 18, vy: Math.random() * 12, life: 1.1
  });
}

// ---------- Hunter's rifle ----------
// Pick it up off the ground like a turtle; right-click fires. The base rifle shoots along your heading (hold to see
// the line, release to fire). Free aim holds your course while right-click is down so the cursor can aim anywhere.
// Auto-fire sprays while held; the Bazooka fires rockets that take everything in a blast. The bang spooks animals.
const GUN_GRAB_R = 3, GUN_GRAB_ALT = 3;
const GUN_AIR_GRAB = 0.8;   // fraction of the air-catch radius for snatching a falling rifle
const GUN_REGRAB_T = 0.6;   // a rifle you just let go can't be re-caught for this long
const AUTO_FIRE_DT = 0.11, ROCKET_SPEED = 110, ROCKET_BLAST = 14, ROCKET_FUSE = 3.5;
const gunStat = k => GUN_STATS[k][tier('rifle')];
const gunFreeAim = () => tier('rifle') >= 2;
const gunAuto = () => tier('rifle') === 4;
const gunBazooka = () => tier('rifle') >= 5;
const gunAimHeld = () => !!(bird.carrying && bird.carrying.kind === 'gun' && mouse.aiming && mouse.throwHeld);

function aimWorld() {
  return { x: cam.x + (mouse.x - W / 2) / cam.zoom, alt: cam.alt + (H / 2 - mouse.y) / cam.zoomY };
}

function gunRay() {
  if (!gunFreeAim()) return { ux: Math.cos(bird.angle), uy: Math.sin(bird.angle) };
  const a = aimWorld(), dx = a.x - bird.x, dy = a.alt - bird.alt, l = Math.hypot(dx, dy) || 1;
  return { ux: dx / l, uy: dy / l };
}

// Everything a bullet or blast can take: [x, alt, hit radius, hit]
function gunTargets() {
  const out = [], w = gunStat('width');
  for (const p of prey) {
    if (p.gone || p.hidden || p.spent) continue;
    if (p.kind === 'flock') { for (const m of p.members) if (!m.caught) out.push([m.x, m.alt, w, { type: 'prey', p, m }]); continue; }
    const alt = SPECIES[p.kind].air && !p.sitting ? p.alt : (p.alt ?? 0) + 0.4;
    out.push([p.x, alt, w, { type: 'prey', p, m: p }]);
  }
  for (const r of state.rivals) if (!r.gone) out.push([r.x, r.alt, w + 1, { type: 'buzzard', r }]);
  const hz = state.hazards;
  for (const c of hz.cats) if (!c.gone) out.push([c.x, c.alt + 0.4, w, { type: 'hz', kind: 'cat', obj: c }]);
  for (const h of hz.hunters) if (!h.gone) out.push([h.x, 1, w, { type: 'hz', kind: 'hunter', obj: h }]);
  if (hz.hawk) out.push([hz.hawk.x, hz.hawk.alt, w + 1, { type: 'hz', kind: 'hawk', obj: hz.hawk }]);
  // Turtles in flight: skeet
  for (const f of state.fallers) if (!f.done && f.alt > 0.5) out.push([f.x, f.alt, w, { type: 'skeet', f }]);
  return out;
}

// First thing along the ray (t = metres along it); stops at the ground
function gunTrace(ux, uy) {
  let best = null, bestT = gunStat('range');
  if (uy < 0) bestT = Math.min(bestT, Math.max(0, bird.alt) / -uy);
  for (const [x, alt, r, hit] of gunTargets()) {
    const px = x - bird.x, py = alt - bird.alt, t = px * ux + py * uy;
    if (t > 0 && t < bestT + r && Math.abs(px * uy - py * ux) < r) { bestT = Math.min(bestT, t); best = hit; }
  }
  return { t: bestT, hit: best };
}

// Award whatever a bullet or rocket took out
function takeShot(hit, verb) {
  if (hit.type === 'prey') {
    const { p, m } = hit, s = SPECIES[p.kind];
    if (p.kind === 'flock') {
      m.caught = true; p.scatterT = 3; p.alertT = 0.8;
      award({ kind: 'flock', speed: bird.speed, air: true, count: 1, shot: true }, priceCatch('flock', {}), `${verb} Starling`);
    } else {
      p.gone = true;
      const what = p.kind === 'turtle' ? 'Turtle — shell cracked' : s.name;
      award({ kind: p.kind, speed: bird.speed, air: s.air, shot: true }, priceCatch(p.kind, { unseen: !p.noticed }), `${verb} ${what}`);
    }
  } else if (hit.type === 'buzzard') {
    const r = hit.r;
    r.gone = true; r.mode = 'leave';
    award({ kind: 'turtle', speed: bird.speed, targetKind: 'buzzard', stolen: true, shot: true }, priceCatch('buzzard', {}), `${verb} Buzzard`);
  } else if (hit.type === 'skeet') {
    hit.f.done = true;
    award({ kind: 'turtle', speed: bird.speed, shot: true }, priceCatch('turtle', { skeet: true }), `${verb} Skeet shot — shell shattered`);
  } else {
    award({ kind: 'turtle', speed: bird.speed, targetKind: hit.kind, stolen: true, shot: true }, priceCatch(hit.kind, {}), `${verb} ${HAZARD_NAME[hit.kind]}`);
    removeHazard(hit.kind, hit.obj);
  }
}

// The bang sends everything nearby running
function gunSpook(x, r) {
  for (const p of prey) {
    if (p.gone || p.spent || Math.abs(p.x - x) > r) continue;
    if (SPECIES[p.kind].air) spookAir(p); else { p.fleeing = true; p.alertT = 1; }
  }
}

function fireGun() {
  const g = bird.carrying;
  if (!g || g.kind !== 'gun' || g.ammo <= 0 || state.over || paused || bird.inWater) return;
  const { ux, uy } = gunRay();
  g.ammo--; g.flash = 0.09;
  state.rings.push({ x: bird.x, alt: bird.alt, t: 0, r: 60, kind: 'shot' });
  if (gunBazooka()) {
    state.rockets.push({ x: bird.x + ux * 2, alt: bird.alt + uy * 2, vx: ux * ROCKET_SPEED, vy: uy * ROCKET_SPEED, t: 0 });
    gunSpook(bird.x, 60);
  } else {
    const { t, hit } = gunTrace(ux, uy);
    state.tracers.push({ x0: bird.x, a0: bird.alt, x1: bird.x + ux * t, a1: bird.alt + uy * t, t: 0.25 });
    if (hit) {
      takeShot(hit, 'BANG!');
      const hx = bird.x + ux * t, ha = Math.max(0.5, bird.alt + uy * t);
      for (let i = 0; i < 16; i++) particles.push({ x: hx, alt: ha, vx: (Math.random() - 0.5) * 16, vy: Math.random() * 10, life: 1 });
    } else if (!gunAuto()) {
      state.msg = 'BANG! Missed'; state.msgT = 1.5; state.msgTags = null;
    }
    gunSpook(bird.x, gunStat('spook'));
  }
  if (g.ammo <= 0) {
    bird.carrying = null;
    mouse.aiming = false; mouse.throwHeld = false; mouse.steer = null;
    state.toast = { text: gunBazooka() ? 'Last rocket away — launcher dropped' : 'Out of ammo — gun dropped', t: 2.5 };
  }
}

function explodeRocket(r) {
  r.done = true;
  const bx = r.x, ba = Math.max(0, r.alt);
  state.blasts.push({ x: bx, alt: ba, t: 0 });
  state.rings.push({ x: bx, alt: ba, t: 0, r: 120, kind: 'shot' });
  cam.shake = Math.max(cam.shake, 8);
  let n = 0, total = 0;
  for (const [x, alt, rad, hit] of gunTargets()) {
    if (Math.hypot(x - bx, alt - ba) > ROCKET_BLAST + rad) continue;
    const before = state.score;
    takeShot(hit, 'BOOM!');
    n++; total += state.score - before;
  }
  if (n > 1) { state.msg = `BOOM! ${n} at once +$${total}`; state.msgTags = null; state.msgT = 2.5; }
  else if (!n) { state.msg = 'BOOM! Missed'; state.msgTags = null; state.msgT = 1.5; }
  for (let i = 0; i < 40; i++) particles.push({
    x: bx, alt: ba + 1, vx: (Math.random() - 0.5) * 40, vy: Math.random() * 26, life: 1.2
  });
  gunSpook(bx, gunStat('spook'));
}

function updateRockets(dt) {
  for (const r of state.rockets) {
    r.t += dt;
    // Sub-steps so a fast rocket can't skip past a small target
    const steps = Math.ceil(Math.hypot(r.vx, r.vy) * dt / 1.5);
    for (let k = 0; k < steps && !r.done; k++) {
      const h = dt / steps;
      r.vy -= G * 0.15 * h; r.x += r.vx * h; r.alt += r.vy * h;
      let boom = r.alt <= 0 || r.t > ROCKET_FUSE;
      if (!boom) for (const [x, alt, rad] of gunTargets()) if (Math.hypot(x - r.x, alt - r.alt) < rad + 1) { boom = true; break; }
      if (boom) explodeRocket(r);
    }
    if (!r.done && Math.random() < 0.6) particles.push({ x: r.x, alt: r.alt, vx: -r.vx * 0.05, vy: -r.vy * 0.05 + 1, life: 0.5 });
  }
  state.rockets = state.rockets.filter(r => !r.done);
  for (const b of state.blasts) b.t += dt;
  state.blasts = state.blasts.filter(b => b.t < 0.6);
}

function updateGuns(dt) {
  for (const t of state.tracers) t.t -= dt;
  state.tracers = state.tracers.filter(t => t.t > 0);
  updateRockets(dt);
  const held = bird.carrying;
  if (held && held.kind === 'gun') {
    held.flash = Math.max(0, (held.flash || 0) - dt);
    held.cool = (held.cool || 0) - dt;
    if (gunAuto() && gunAimHeld() && held.cool <= 0) { held.cool = AUTO_FIRE_DT; fireGun(); }
  }
  for (const g of state.guns) {
    g.noGrab = Math.max(0, (g.noGrab || 0) - dt);
    if (g.alt > 0) {
      g.vy -= G * dt; g.x += g.vx * dt; g.alt += g.vy * dt;
      if (g.alt <= 0) { g.alt = 0; g.vx = 0; g.vy = 0; }
    }
  }
  if (!bird.carrying && !state.over && !bird.inWater) {
    for (const g of state.guns) {
      if (g.noGrab > 0) continue;
      // In flight: snatch it like air prey; on the ground: swoop low over it
      const inAir = g.alt > 0.5;
      if (inAir ? sweptDist(g.x, g.alt, dt) > airCatchRadius() * GUN_AIR_GRAB
        : g.alt > 0 || Math.abs(g.x - bird.x) > GUN_GRAB_R || bird.alt > GUN_GRAB_ALT * STATS.catchAlt[tier('talons')]) continue;
      g.gone = true;
      bird.carrying = { kind: 'gun', ammo: g.ammo };
      const how = gunAuto() ? 'hold right-click to spray' : gunFreeAim() ? 'hold right-click to aim anywhere, release to fire' : 'hold right-click, release to fire straight ahead';
      state.msg = `${inAir ? 'Caught it mid-air' : 'Got the ' + (gunBazooka() ? 'bazooka' : 'rifle')}! ${how}`; state.msgT = 3; state.msgTags = null;
      if (!progress.gunFound) {
        progress.gunFound = true; saveProgress();
        state.toast = { text: 'New upgrade unlocked in the Roost: Rifle', t: 4 };
      }
      break;
    }
  }
  state.guns = state.guns.filter(g => !g.gone && Math.abs(g.x - bird.x) < 3000);
}

// Ground impact speed of something released here, from energy: horizontal speed plus vertical gained over the fall
const predictImpact = (alt, vx, vy) => Math.hypot(vx, Math.sqrt(vy * vy + 2 * G * Math.max(0, alt)));

const ACH_KEY = 'falconDive.achievements';
function unlockAchievement(id, text) {
  let got = {};
  try { got = JSON.parse(localStorage.getItem(ACH_KEY)) || {}; } catch { /* storage unavailable */ }
  const first = !got[id];
  got[id] = true;
  try { localStorage.setItem(ACH_KEY, JSON.stringify(got)); } catch { /* storage unavailable */ }
  state.toast = { text: `${first ? 'Secret achievement unlocked' : 'Achievement'}: ${text}`, t: 4 };
}

// A falling turtle that lands on (or passes through) another animal takes it out
function turtleStrike(p, member, f) {
  if (f.hitBuzzard || f.done || !member || member.caught) return;
  const s = SPECIES[p.kind];
  const impact = Math.hypot(f.vx, f.vy);
  const unseen = !p.noticed;
  if (p.kind === 'flock') {
    member.caught = true;
    p.scatterT = 3;
    p.alertT = 0.8;
    if (!p.combo) {
      const priced = priceCatch('flock', { turtleHit: true, impact, unseen });
      const entry = award({ kind: 'flock', speed: impact, rel: impact, alt: member.alt ?? 0, air: true, count: 1, turtleHit: true }, priced, 'TURTLE STRIKE! Starling');
      p.combo = { entry, t: STARLING_COMBO_TIME };
    } else {
      addStarling(p, true);
    }
  } else {
    p.gone = true;
    f.struck = true;
    const priced = priceCatch(p.kind, { turtleHit: true, impact, unseen });
    award({ kind: p.kind, speed: impact, turtleHit: true, air: s.air, alt: member.alt ?? 0, minAlt: 0 }, priced, `TURTLE STRIKE! ${s.name}`);
  }
  unlockAchievement('aeschylus', 'Aeschylus — hit prey with a falling turtle');
  for (let i = 0; i < 20; i++) particles.push({
    x: member.x ?? p.x, alt: Math.max(0.5, member.alt ?? 0.5), vx: (Math.random() - 0.5) * 16, vy: Math.random() * 10, life: 1
  });
  if (p.kind !== 'flock') { f.struck = true; ricochet(f); }
}

// Ricochet: after a hit, hop on a ballistic arc toward the nearest other target and keep homing
function ricochet(f) {
  if (!(f.bounces > 0)) return;
  let best = null, bestD = RICOCHET_RANGE;
  for (const p of prey) {
    if (p.gone || p.hidden || p.spent || p.kind === 'turtle' || p.kind === 'flock') continue;
    const alt = SPECIES[p.kind].air && !p.sitting ? p.alt : 0;
    const d = Math.hypot(p.x - f.x, alt - f.alt);
    if (d < bestD) { bestD = d; best = { t: p, x: p.x, alt }; }
  }
  for (const r of state.rivals) {
    if (r.gone) continue;
    const d = Math.hypot(r.x - f.x, r.alt - f.alt);
    if (d < bestD) { bestD = d; best = { t: { kind: 'buzzard', x: r.x, alt: r.alt, target: r }, x: r.x, alt: r.alt }; }
  }
  for (const t of hazardTargets()) {
    const d = Math.hypot(t.x - f.x, t.alt - f.alt);
    if (d < bestD) { bestD = d; best = { t, x: t.x, alt: t.alt }; }
  }
  if (!best) return;
  const T = Math.max(0.7, Math.min(1.8, bestD / 30));
  f.vx = (best.x - f.x) / T;
  f.vy = (best.alt - f.alt + 0.5 * G * T * T) / T;
  f.alt = Math.max(f.alt, 0.5);
  f.target = best.t;
  f.bounces--;
  f.struck = false; f.hitBuzzard = false; f.done = false;
  f.ricochets = (f.ricochets || 0) + 1;
  f.bounced = true;
  state.msg += f.ricochets > 1 ? '  ·  DOUBLE RICOCHET!' : '  ·  Ricochet!';
}

function buzzardStrike(f, r) {
  const impact = Math.hypot(f.vx, f.vy);
  // Marked stolen so a buzzard can't steal it back
  const e = award({ kind: 'turtle', speed: impact, turtleHit: true, buzzard: true, targetKind: 'buzzard', stolen: true },
                  priceCatch('buzzard', { impact }), 'TURTLE STRIKE! Buzzard');
  state.msgT = 2.5;
  r.gone = true;
  r.mode = 'leave'; r.t = 4; r.alertT = 0.8;
  f.struck = true;
  f.hitBuzzard = true;
  for (let i = 0; i < 20; i++) particles.push({
    x: r.x, alt: r.alt, vx: (Math.random() - 0.5) * 18, vy: Math.random() * 12, life: 1.1
  });
  ricochet(f);
}

function updateFallers(dt) {
  for (const f of state.fallers) {
    f.bounced = false;
    f.vy -= G * dt;
    f.vx += (windX(f.alt) - f.vx) * Math.min(1, dt * 0.2);
    // Gentle homing on the animal that was locked when thrown
    if (f.target && !f.target.gone && !f.target.hidden && !(f.target.target && f.target.target.gone)) {
      // Buzzard / predator locks hold a reference to the live object; follow it rather than the snapshot
      const tg = f.target.target || f.target;
      const tAlt = f.target.kind === 'buzzard' || f.target.air || SPECIES[f.target.kind]?.air ? tg.alt : 0;
      const drop = f.alt - tAlt;
      if (drop > 0) {
        const tRem = (f.vy + Math.sqrt(f.vy * f.vy + 2 * G * drop)) / G;
        const wantVx = (tg.x - f.x) / Math.max(0.3, tRem) + (tg.vx || 0) * 0.5;
        const hm = f.homing || TURTLE_HOMING;
        f.vx += Math.max(-hm, Math.min(hm, (wantVx - f.vx) * 2)) * dt;
      }
    }
    f.x += f.vx * dt; f.alt += f.vy * dt; f.spin += dt * 5;

    if (!(f.struck && f.alt > 0 && !f.hitBuzzard)) {
      for (const r of state.rivals) {
        if (Math.hypot(r.x - f.x, r.alt - f.alt) < 5) {
          buzzardStrike(f, r);
          break;
        }
      }
      const hit = hazardHitBy(f);
      if (hit) hazardStrike(f, hit.kind, hit.obj);
      for (const p of prey) {
        if (p.gone || p.spent || !SPECIES[p.kind].air) continue;
        const targets = p.kind === 'flock' ? p.members.filter(m => !m.caught) : [p];
        for (const t of targets) if (Math.hypot(t.x - f.x, t.alt - f.alt) < 3) turtleStrike(p, t, f);
      }
    }
    if (f.alt > 0) continue;
    if (f.struck || f.hitBuzzard) {
      f.done = true;
      const t = makeGround(f.x, 'turtle');
      t.failCD = 2;
      prey.push(t);
      continue;
    }
    for (const p of prey) {
      if (p.gone || p.hidden || SPECIES[p.kind].air || p.kind === 'turtle') continue;
      if (Math.abs(p.x - f.x) < 3) turtleStrike(p, p, f);
    }
    f.done = true;
    // A ground hit that ricocheted is airborne again
    if (f.bounced) { f.bounced = false; f.done = false; continue; }
    // A ricochet that missed its next target just lands; the turtle walks off
    if (f.ricochets) { const t = makeGround(f.x, 'turtle'); t.failCD = 2; prey.push(t); continue; }
    const impact = Math.hypot(f.vx, f.vy);
    if (impact >= SHELL_CRACK_SPEED) {
      award({ kind: 'turtle', speed: impact, drop: f.dropAlt }, priceCatch('turtle', { impact }), 'Shell cracked!');
      for (let i = 0; i < 25; i++) particles.push({
        x: f.x, alt: 0.5, vx: (Math.random() - 0.5) * 20, vy: Math.random() * 12, life: 1.2
      });
    } else {
      const t = makeGround(f.x, 'turtle');
      t.failCD = 2;
      prey.push(t);
      if (!f.struck) {
        state.msg = `Hit at ${(impact * 3.6).toFixed(0)} km/h — the turtle walked away (need ${(SHELL_CRACK_SPEED * 3.6).toFixed(0)})`;
        state.msgT = 2.5;
      }
    }
  }
  state.fallers = state.fallers.filter(f => !f.done);
}

// ---------- Rivals ----------
// Buzzards circle some thermals. Make a kill or carry a turtle nearby and they give chase;
// if one reaches you it steals the turtle or your most recent catch. Outfly them in a dive.
const RIVAL_SPEED = 24;

function updateRivals(dt) {
  const i0 = Math.floor(bird.x / THERMAL_SPACING);
  for (let i = i0 - 2; i <= i0 + 2; i++) {
    const th = thermalCol(i);
    if (!th.on || wh(i * 11.1 + 2) > 0.45 || state.rivalSeen[i]) continue;
    state.rivalSeen[i] = true;
    const alt = 160 + wh(i * 12.7) * 160;
    state.rivals.push({ cx: th.x, calt: alt, x: th.x, alt, ang: Math.random() * 6.28, mode: 'circle', t: 0, flapT: 0, vx: 1, vy: 0 });
  }
  for (const r of state.rivals) {
    r.t -= dt; r.flapT += dt * 6;
    const dx = bird.x - r.x, dy = bird.alt - r.alt, d = Math.hypot(dx, dy);
    const fresh = state.lastCatch && state.time - state.lastCatch.t < stealWindow() && !state.lastCatch.stolen && !state.lastCatch.eyas;
    if (r.mode === 'circle' && d < STATS.notice[tier('stealth')] && (bird.carrying || fresh)) {
      r.mode = 'chase'; r.t = 7; r.alertT = 0.8;
      state.msg = 'A buzzard is after your prize!'; state.msgT = 2;
    }
    if (r.mode === 'chase') {
      const cs = rivalChaseSpeed();
      r.vx = dx / (d || 1) * cs; r.vy = dy / (d || 1) * cs;
      if (d < 4) {
        if (bird.carrying) {
          state.msg = `A buzzard snatched your ${bird.carrying.kind === 'gun' ? 'rifle' : 'turtle'}!`;
          bird.carrying = null;
        } else if (fresh) {
          const e = state.lastCatch;
          e.stolen = true;
          state.score -= e.pts;
          state.catchLog.splice(state.catchLog.indexOf(e), 1);
          state.steals.push(e);
          breakChain();
          state.msg = `A buzzard stole your ${SPECIES[e.kind].name}! -$${e.pts}`;
        }
        state.msgT = 2.5;
        r.mode = 'leave'; r.t = 5;
      } else if (r.t <= 0 || !(bird.carrying || fresh)) {
        r.mode = 'return';
      }
    } else if (r.mode === 'leave') {
      r.vx = Math.sign(r.x - bird.x || 1) * RIVAL_SPEED; r.vy = 4;
      if (r.t <= 0) r.mode = 'return';
    } else if (r.mode === 'return') {
      const ex = r.cx + Math.cos(r.ang) * 35 - r.x, ey = r.calt - r.alt, ed = Math.hypot(ex, ey);
      r.vx = ex / (ed || 1) * RIVAL_SPEED * 0.7; r.vy = ey / (ed || 1) * RIVAL_SPEED * 0.7;
      if (ed < 5) r.mode = 'circle';
    } else {
      r.ang += dt * 0.6;
      const nx = r.cx + Math.cos(r.ang) * 35, na = r.calt + Math.sin(r.ang * 2) * 6;
      r.vx = (nx - r.x) / dt; r.vy = (na - r.alt) / dt;
    }
    r.x += r.vx * dt; r.alt = Math.max(5, r.alt + r.vy * dt);
    r.alertT = (r.alertT || 0) - dt;
  }
  state.rivals = state.rivals.filter(r => !r.gone && Math.abs(r.x - bird.x) < 3000);
}

// ---------- Hazards ----------
// Cats hide in the grass and pounce on slow, low passes; hunters lock on to slow fliers in range; a goshawk
// stalks you and stoops. Any of them ends the day. They appear and get sharper as the days go on.
const danger = () => clamp((state.day - 1) / 6, 0, 1);
const CAT_CELL = 220, CAT_REACH = 32, CAT_ALT = 18, CAT_LEAP_T = 0.45, CAT_LEAP_MAX = 40, CAT_LEAP_VY = 34, CAT_HIT = 3;
const CAT_STALK_DIST = 120, CAT_STALK_ALT = 45, CAT_STALK_SPEED = 4;
const HUNTER_CELL = 900, HUNTER_RANGE = 230, HUNTER_TRACK = 4, HUNTER_LOCK_DIST = 10, HUNTER_FROM_DAY = 2;
const HUNTER_AIM_T = 0.7, HUNTER_HIT = 3, HUNTER_RELOAD = 1.5;   // s of visible aim before the shot; m from the shot line that kills; s between shots
const HUNTER_SEE_ALT = 190, HUNTER_SNAP_LEAD = 0.4, HUNTER_SNAP_SPREAD = 7;   // snap shots: share of the full lead, ± m scatter
const HAWK_SPEED = 70, HAWK_TURN = 2.4, HAWK_HIT = 3, HAWK_FROM_DAY = 3;
const HAWK_STOOP_DIST = 110, HAWK_COMMIT = 45, HAWK_ACCEL = 35;
// The aim trails the bird by speed / HUNTER_TRACK, so a slow flier gets a quick clean lock; anyone else in
// range still draws a snap shot after hunterSnapTime of watching
const hunterLockTime = () => 1.2 - 0.4 * danger();
const hunterSnapTime = () => 1.5 - 0.5 * danger();
const rivalChaseSpeed = () => 30 + 6 * danger();

function newHazards() {
  return { cats: [], hunters: [], hawk: null, hawkT: 40 + Math.random() * 20, seen: new Set() };
}

function killBird(reason, msg) {
  if (state.over || bird.invulnT > 0) return;
  if (state.feathers > 0) {
    // Lucky Feather: shrug off one fatal attack, a cloud of feathers and a moment of grace
    state.feathers--; bird.invulnT = LUCKY_INVULN;
    if (reason === 'hawk' && state.hazards.hawk) { state.hazards.hawk.mode = 'leave'; state.hazards.hawk.commit = false; }
    state.msg = `Lucky Feather! ${msg.replace(/!$/, '')} — but you slipped away`; state.msgT = 2.5; state.msgTags = null;
    for (let i = 0; i < 30; i++) state.featherFx.push({ x: bird.x, alt: bird.alt, vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.3) * 10, rot: Math.random() * 6, life: 1.6 });
    return;
  }
  bird.carrying = null;
  state.crash = { t: 0, smoke: [], killer: reason };
  endDay(reason);
  state.msg = `${msg} — the hunt is over for today`;
  for (let i = 0; i < 35; i++) particles.push({
    x: bird.x, alt: bird.alt, vx: (Math.random() - 0.5) * 24, vy: Math.random() * 14, life: 1.4
  });
}

// ---------- Whacky upgrades: Eyases, Screech, Lucky Feather ----------
// Eyases (young hawks) fly in loose formation behind you, peel off after prey near you and bring you a share
const EYAS = { count: [0, 1, 2, 3], speed: [0, 32, 35, 39], range: [0, 160, 190, 220] };
const EYAS_SHARE = 0.5, EYAS_TURN = 3.2, EYAS_CHASE_T = 8, EYAS_REST_T = 4, EYAS_CATCH_R = 2.2, EYAS_SPOOK_D = 30, EYAS_DROP = 160;
// Screech (E): everything within the radius freezes in fear for a moment
const SCREECH = { radius: [0, 60, 100], freeze: [0, 2, 3], cool: [0, 15, 10] };
// Lucky Feather: survive this many fatal attacks (cat / hunter / goshawk) per day
const LUCKY = [0, 1, 2], LUCKY_INVULN = 2.5;

function spawnEyases() {
  state.eyases = [];
  for (let i = 0; i < EYAS.count[tier('eyas')]; i++) {
    state.eyases.push({ i, x: bird.x - 15 - 10 * i, alt: bird.alt + 6 + 5 * i, vx: 12, vy: 0, mode: 'follow', t: 2 + i * 1.5,
                        flapT: i * 2, target: null, carry: null });
  }
}

function eyasCanTake(p) {
  if (p.gone || p.spent || p.hidden || p.kind === 'flock' || p.kind === 'turtle') return false;
  const s = SPECIES[p.kind];
  return s.air !== 'water';
}
const preyAlt = p => SPECIES[p.kind].air && !p.sitting ? p.alt : (p.alt ?? 0) + 0.4;

function updateEyases(dt) {
  const t = tier('eyas');
  if (!t || !state.eyases) return;
  const dir = Math.sign(bird.vx) || 1, bsp = Math.hypot(bird.vx, bird.vy);
  for (const e of state.eyases) {
    e.t -= dt; e.flapT += dt * 11;
    if (e.mode === 'chase') {
      const p = e.target;
      if (!p || p.gone || p.spent || p.hidden || e.t <= 0) {
        e.mode = 'follow'; e.t = 2; e.target = null;
      } else {
        const pa = preyAlt(p), air = SPECIES[p.kind].air && !p.sitting;
        const pvx = p.curVx ?? p.vx ?? 0, pvy = air ? (p.vy || 0) : 0;
        const d = Math.hypot(p.x - e.x, pa - e.alt), sp = EYAS.speed[t];
        const lead = Math.min(1.5, d / sp);
        const want = Math.atan2(pa + pvy * lead - e.alt, p.x + pvx * lead - e.x), cur = Math.atan2(e.vy, e.vx);
        const ang = cur + clamp(wrapAngle(want - cur), -EYAS_TURN * dt, EYAS_TURN * dt);
        const cs = Math.min(sp, Math.hypot(e.vx, e.vy) + 25 * dt);
        e.vx = Math.cos(ang) * cs; e.vy = Math.sin(ang) * cs;
        if (d < EYAS_SPOOK_D && !p.eyasSpooked) {
          p.eyasSpooked = true; p.noticed = true;
          if (p.sitting) duckTakeOff(p); else if (SPECIES[p.kind].air) spookAir(p); else p.alertT = 0.8;
        }
        // Swept: closest approach of this step's flight segment to the prey
        const sx = e.vx * dt, sy = e.vy * dt, rx = p.x - e.x, ry = pa - e.alt;
        const k = clamp((rx * sx + ry * sy) / (sx * sx + sy * sy || 1), 0, 1);
        if (Math.hypot(rx - sx * k, ry - sy * k) < EYAS_CATCH_R) {
          p.gone = true;
          const priced = priceCatch(p.kind, { share: EYAS_SHARE });
