  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Click anywhere or press P / Esc to resume', W / 2, H / 2 + 22);
}

function drawHUD() {
  // Altitude meter (sqrt scale so low altitudes stay readable)
  const mx = 40, top = 80, bottom = H - 60;
  const altY = a => bottom - Math.sqrt(Math.min(1, Math.max(0, a) / MAX_ALT)) * (bottom - top);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(mx - 30, top - 10, 60, bottom - top + 20);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(mx + 10, top); ctx.lineTo(mx + 10, bottom); ctx.stroke();
  ctx.font = '10px monospace'; ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
  for (const a of [0, 25, 50, 100, 200, 300, 400, MAX_ALT]) {
    ctx.fillText(a, mx + 4, altY(a) + 3);
  }
  const ay = altY(bird.alt);
  ctx.fillStyle = '#ffdd55';
  ctx.beginPath(); ctx.moveTo(mx + 10, ay); ctx.lineTo(mx + 22, ay - 6); ctx.lineTo(mx + 22, ay + 6); ctx.fill();
  const altLabel = `${bird.alt.toFixed(0)} m`;
  ctx.font = 'bold 13px monospace';
  const altW = ctx.measureText(altLabel).width + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(mx + 24, ay - 10, altW, 20);
  ctx.fillStyle = bird.alt > MAX_ALT ? '#66ccff' : '#ffdd55'; ctx.textAlign = 'left';
  ctx.fillText(altLabel, mx + 29, ay + 4);

  if (bird.carrying && bird.carrying.kind === 'gun') {
    const text = gunAuto() ? 'Hold right-click to spray · Space drops'
      : gunFreeAim() ? 'Hold right-click: course holds, cursor aims · release fires · Space drops'
      : 'Hold right-click: fires straight ahead on release · Space drops';
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(text).width + 24;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W / 2 - tw / 2, 14, tw, 26);
    ctx.fillStyle = '#ffdd55';
    ctx.fillText(text, W / 2, 32);
  } else if (bird.carrying) {
    // Marker: the lowest altitude from which a release at your current speed would still crack the shell
    const needH = (SHELL_CRACK_SPEED ** 2 - bird.vx ** 2 - bird.vy ** 2) / (2 * G);
    if (needH > 0) {
      const dy = altY(needH);
      ctx.strokeStyle = '#7fd67f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(mx - 4, dy); ctx.lineTo(mx + 14, dy); ctx.stroke();
    }
    const impact = predictImpact(bird.alt, bird.vx, bird.vy);
    const ready = impact >= SHELL_CRACK_SPEED;
    const est = priceCatch('turtle', { impact }, true).value;
    const how = 'hold right-click to aim, release to throw · Space drops';
    const text = ready
      ? `Drop now: ~${(impact * 3.6).toFixed(0)} km/h impact (~$${est})  ·  ${how}`
      : `Turtle would hit at ~${(impact * 3.6).toFixed(0)} km/h — need ${(SHELL_CRACK_SPEED * 3.6).toFixed(0)}. Climb or dive faster`;
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(text).width + 24;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W / 2 - tw / 2, 14, tw, 28);
    ctx.fillStyle = ready ? '#7fd67f' : '#fff';
    ctx.fillText(text, W / 2, 33);
  }

  // Readouts
  drawSpeedometer(240, H - 170, 80);
  if (bird.carrying && bird.carrying.kind === 'gun') drawAmmo(360, H - 170 - 68);
  drawPerks(bird.carrying && bird.carrying.kind === 'gun' ? 488 : 360, H - 170 - 68);
  drawCatchLog();

  // Scale bar
  const barM = niceStep(100 / cam.zoom), barPx = barM * cam.zoom;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W - 20 - barPx, H - 40); ctx.lineTo(W - 20 - barPx, H - 34);
  ctx.lineTo(W - 20, H - 34); ctx.lineTo(W - 20, H - 40);
  ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'right';
  ctx.fillText(`${barM} m`, W - 20, H - 44);

  if ((state.msgT > 0 || state.over) && (!state.crash || state.crash.t >= CRASH_REVEAL_DELAY)) {
    ctx.fillStyle = state.over ? '#ff5555' : '#ffffff';
    ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(state.msg, W / 2, H / 2 - 80);
    if (state.msgTags && state.msgTagsFor === state.msg) {
      ctx.fillStyle = '#ffdd55'; ctx.font = 'bold 14px sans-serif';
      ctx.fillText(state.msgTags, W / 2, H / 2 - 56);
    }
  }
  if (state.toast && state.toast.t > 0) {
    ctx.globalAlpha = Math.min(1, state.toast.t);
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(state.toast.text).width + 30;
    ctx.fillStyle = 'rgba(40,30,0,0.85)';
    ctx.fillRect(W / 2 - tw / 2, 52, tw, 32);
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - tw / 2, 52, tw, 32);
    ctx.fillStyle = '#ffd34d';
    ctx.fillText(state.toast.text, W / 2, 74);
    ctx.globalAlpha = 1;
  }

}

// Small badges for the whacky upgrades: screech cooldown, lucky feathers left, eyases
function drawPerks(x, y) {
  const rows = [];
  const st = tier('screech');
  if (st) {
    const cd = state.screechCD || 0;
    rows.push([cd > 0 ? `E screech ${Math.ceil(cd)}s` : 'E screech ready', cd > 0 ? '#9aa7b8' : '#ff9ad6', 1 - cd / SCREECH.cool[st]]);
  }
  if (tier('lucky')) rows.push([`Lucky feather ×${state.feathers}`, state.feathers ? '#fff1b8' : '#9aa7b8', null]);
  if (tier('eyas') && state.eyases) {
    const hunting = state.eyases.filter(e => e.mode === 'chase').length;
    rows.push([`Eyases ${state.eyases.length}${hunting ? ` · ${hunting} hunting` : ''}`, '#d9a46a', null]);
  }
  rows.forEach(([text, col, k], i) => {
    const ry = y + i * 26;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, ry, 150, 22);
    if (k != null) { ctx.fillStyle = 'rgba(255,154,214,0.25)'; ctx.fillRect(x, ry, 150 * clamp(k, 0, 1), 22); }
    ctx.fillStyle = col; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(text, x + 8, ry + 15);
  });
}

// Ammo panel beside the brake bar: weapon, then one round per shot left (a bar + count for the 30-round drum)
function drawAmmo(x, y) {
  const g = bird.carrying, max = gunStat('ammo'), n = g.ammo, style = gunStyle();
  const w = 118, h = 136;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = n <= Math.max(1, max * 0.2) ? '#ff7766' : 'rgba(255,221,85,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.filter = OUTLINE;
  drawRifle(x + w / 2 - 2, y + 26, 0, 2.4, style, g.flash || 0);
  ctx.filter = 'none';
  ctx.fillStyle = '#ffdd55'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`${n}`, x + w / 2, y + 74);
  ctx.fillStyle = '#cfe6f7'; ctx.font = '10px monospace';
  ctx.fillText(`/ ${max} ${style === 2 ? 'ROCKETS' : 'SHOTS'}`, x + w / 2, y + 88);
  const by = y + 100;
  if (max <= 8) {
    const rw = style === 2 ? 11 : 7, gap = 4, tot = max * rw + (max - 1) * gap;
    for (let i = 0; i < max; i++) {
      const rx = x + (w - tot) / 2 + i * (rw + gap), on = i < n;
      ctx.fillStyle = on ? (style === 2 ? '#8a9a52' : '#d9a74a') : 'rgba(255,255,255,0.15)';
      ctx.fillRect(rx, by + 6, rw, 18);
      if (on) { ctx.fillStyle = style === 2 ? '#c0392b' : '#b07a2a'; ctx.fillRect(rx, by, rw, 6); }
    }
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x + 12, by + 6, w - 24, 14);
    ctx.fillStyle = '#d9a74a'; ctx.fillRect(x + 12, by + 6, (w - 24) * n / max, 14);
  }
}

function drawSpeedometer(cx, cy, r) {
  const MAX_KMH = Math.max(360, Math.ceil(topKmh() / 60) * 60), A0 = Math.PI * 0.75, SWEEP = Math.PI * 1.5;
  const ang = kmh => A0 + SWEEP * Math.min(kmh, MAX_KMH) / MAX_KMH;
  const kmh = bird.speed * 3.6;

  // Brake energy: vertical bar to the right of the dial
  const bx = cx + r + 18, bh = r * 1.6, btop = cy - bh / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 6, btop - 4, 12, bh + 8);
  ctx.fillStyle = bird.brakeLocked ? '#ff5544' : '#66ccff';
  ctx.fillRect(bx - 3, btop + bh * (1 - bird.brakeE), 6, bh * bird.brakeE);
  if (bird.brakeLocked) {
    ctx.strokeStyle = '#ffdd55'; ctx.lineWidth = 1;
    const uy = btop + bh * (1 - BRAKE_UNLOCK);
    ctx.beginPath(); ctx.moveTo(bx - 6, uy); ctx.lineTo(bx + 6, uy); ctx.stroke();
  }
  ctx.fillStyle = '#cfe6f7'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
  ctx.fillText('BRK', bx, btop + bh + 16);

  // Wind at the bird's altitude: arrow length and label above the dial
  const w = windX(bird.alt), wy = cy - r - 24;
  const len = Math.min(40, Math.abs(w) * 4) * Math.sign(w);
  ctx.strokeStyle = '#cfe6f7'; ctx.fillStyle = '#cfe6f7'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - len, wy); ctx.lineTo(cx + len, wy); ctx.stroke();
  if (Math.abs(len) > 2) {
    const d = Math.sign(len);
    ctx.beginPath(); ctx.moveTo(cx + len + d * 6, wy); ctx.lineTo(cx + len - d * 2, wy - 5); ctx.lineTo(cx + len - d * 2, wy + 5); ctx.fill();
  }
  ctx.font = '11px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`wind ${(Math.abs(w) * 3.6).toFixed(0)} km/h`, cx, wy - 9);

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, Math.PI * 2); ctx.fill();

  // Zones: cruise / dive / extreme
  ctx.lineWidth = 6;
  for (const [a, b, c] of [[0, DIVE_SPEED * 3.6, '#7fd67f'], [DIVE_SPEED * 3.6, 300, '#ffdd55'], [300, MAX_KMH, '#ff5544']]) {
    ctx.strokeStyle = c;
    ctx.beginPath(); ctx.arc(cx, cy, r - 4, ang(a), ang(b)); ctx.stroke();
  }

  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  ctx.font = '10px monospace'; ctx.textAlign = 'center';
  for (let v = 0; v <= MAX_KMH; v += 20) {
    const a = ang(v), major = v % 60 === 0;
    const r0 = r - (major ? 18 : 12);
    ctx.lineWidth = major ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * (r - 8), cy + Math.sin(a) * (r - 8));
    ctx.stroke();
    if (major) ctx.fillText(v, cx + Math.cos(a) * (r - 28), cy + Math.sin(a) * (r - 28) + 3);
  }

  // Session max marker
  const am = ang(state.maxSpeed * 3.6);
  ctx.fillStyle = '#66ccff';
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(am) * (r - 1), cy + Math.sin(am) * (r - 1));
  ctx.lineTo(cx + Math.cos(am - 0.06) * (r + 8), cy + Math.sin(am - 0.06) * (r + 8));
  ctx.lineTo(cx + Math.cos(am + 0.06) * (r + 8), cy + Math.sin(am + 0.06) * (r + 8));
  ctx.fill();

  // Needle
  const a = ang(kmh);
  ctx.strokeStyle = '#ff6633'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(a) * 10, cy - Math.sin(a) * 10);
  ctx.lineTo(cx + Math.cos(a) * (r - 14), cy + Math.sin(a) * (r - 14));
  ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#ddd';
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace';
  ctx.fillText(kmh.toFixed(0), cx, cy + r * 0.45);
  ctx.font = '10px monospace'; ctx.fillStyle = '#bbb';
  ctx.fillText('km/h', cx, cy + r * 0.45 + 13);

  // Mode badge and vertical speed under the dial
  const modeColor = { BRAKE: '#66ccff', DIVE: '#ffdd55', FLAP: '#7fd67f', STALL: '#ff8866' }[bird.mode] || '#fff';
  ctx.font = 'bold 13px sans-serif';
  const mw = ctx.measureText(bird.mode).width + 20;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(cx - mw / 2, cy + r + 14, mw, 22);
  ctx.strokeStyle = modeColor; ctx.lineWidth = 2;
  ctx.strokeRect(cx - mw / 2, cy + r + 14, mw, 22);
  ctx.fillStyle = modeColor;
  ctx.fillText(bird.mode, cx, cy + r + 30);

  const vs = bird.vy || 0;
  ctx.font = '12px monospace';
  ctx.fillStyle = -vs > SAFE_VSPEED ? '#ff8866' : '#fff';
  ctx.fillText(`V/S ${vs >= 0 ? '▲' : '▼'} ${Math.abs(vs).toFixed(1)} m/s`, cx, cy + r + 54);
}

// Round species badge used on catch cards and the day recap
function drawCatchIcon(targetKind, ix, iy, ir, turtleHit) {
  const water = SPECIES[targetKind]?.air === 'water';
  const air = targetKind === 'cat' || targetKind === 'hunter' || water ? false : SPECIES[targetKind]?.air ?? true;
  const k = ir / 14;
  ctx.save();
  ctx.beginPath(); ctx.arc(ix, iy, ir, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = water ? '#4a88b8' : '#cfe6f7'; ctx.fillRect(ix - ir, iy - ir, ir * 2, ir * 2);
  if (water) {
    ctx.fillStyle = '#cfe6f7'; ctx.fillRect(ix - ir, iy - ir, ir * 2, ir * 0.45);
    drawFish(ix, iy + 2 * k, { kind: targetKind, vx: 1, ph: 0 }, (targetKind === 'pike' ? 1 : 1.3) * k);
  } else if (!air) { ctx.fillStyle = '#7fae55'; ctx.fillRect(ix - ir, iy + 11 * k, ir * 2, ir); }
  if (water) { /* drawn above */ } else if (targetKind === 'buzzard') {
    drawBuzzard(ix, iy, { flapT: 1.2 }, 0.9 * k);
  } else if (targetKind === 'cat') {
    drawCat(ix - 2 * k, iy + 11 * k, { mode: 'sit', dir: 1 }, 0.85 * k);
  } else if (targetKind === 'hunter') {
    drawHunter(ix, iy + 13 * k, { tracking: false, flash: 0 }, 0.6 * k);
  } else if (targetKind === 'hawk') {
    drawHawk(ix, iy, { mode: 'stalk', flapT: 1.2, vx: 1, vy: 0 }, 0.85 * k);
  } else {
    drawSpecies(targetKind, ix, air ? iy : iy + 11 * k, { hopT: 0, vx: 1, flapT: 1.2 }, animalScaleFor(targetKind) / ICON_SCALE * k);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(ix, iy, ir, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  if (turtleHit) drawTurtle(ix + 9 * k, iy + 15 * k, { vx: 1 }, 0.7 * k);
}

function drawCatchLog() {
  const log = state.catchLog;
  const right = W - 14;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffdd55'; ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`DAY ${state.day}  ·  TODAY $${state.score}`, right, 28);
  // Chain multiplier with a bar showing time left to extend it
  const chain = chainMult();
  if (chain > 1) {
    const left = 1 - (state.time - state.chainT) / CHAIN_TIME;
    const cy = log.length ? 104 : 40;
    ctx.fillStyle = '#ff9f40'; ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`CHAIN ×${chain.toFixed(1)}`, right, cy + 12);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(right - 90, cy + 18, 90, 5);
    ctx.fillStyle = '#ff9f40'; ctx.fillRect(right - 90 * left, cy + 18, 90 * left, 5);
  }
  if (!log.length) return;

  const CW = 92, CH = 50, GAP = 6;
  const maxCards = Math.max(1, Math.floor((W * 0.5) / (CW + GAP)));
  const shown = log.slice(-maxCards);
  const total = shown.length * (CW + GAP) - GAP;
  let x = right - total;
  const y = 38;
  if (log.length > shown.length) {
    ctx.fillStyle = '#ddd'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`+${log.length - shown.length}`, x - 8, y + CH / 2 + 5);
  }
  for (const c of shown) {
    const fresh = state.time - c.t < 1.5;
    const targetKind = c.targetKind || c.kind;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, CW, CH);
    ctx.strokeStyle = fresh ? '#ffdd55' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = fresh ? 2 : 1;
    ctx.strokeRect(x + 0.5, y + 0.5, CW - 1, CH - 1);
    // Light badge behind the icon so dark animals (starlings, swifts) stay visible
    drawCatchIcon(targetKind, x + 17, y + 25, 14, c.turtleHit);
    if (c.count > 1) {
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(`×${c.count}`, x + 3, y + 13);
      ctx.fillStyle = '#ffdd55'; ctx.fillText(`×${c.count}`, x + 3, y + 13);
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace';
    const sp = ((c.rel ?? c.speed) * 3.6).toFixed(0);
    ctx.fillText(sp, x + 34, y + 21);
    const spW = ctx.measureText(sp).width;
    ctx.fillStyle = '#bbb'; ctx.font = '9px monospace';
    ctx.fillText(c.rel != null ? 'rel' : 'km/h', x + 37 + spW, y + 21);
    ctx.fillStyle = '#ffdd55'; ctx.font = 'bold 13px monospace';
    ctx.fillText(`$${c.pts}`, x + 34, y + 40);
    x += CW + GAP;
  }
}

function drawPauseButton() {
  const { x, y, w, h } = PAUSE_BTN;
  const hover = inPauseBtn(mouse.x, mouse.y);
  ctx.fillStyle = hover ? 'rgba(0,0,0,0.75)' : 'rgba(0,0,0,0.5)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = '#fff';
  if (paused) {
    ctx.beginPath(); ctx.moveTo(x + 16, y + 12); ctx.lineTo(x + 32, y + 22); ctx.lineTo(x + 16, y + 32); ctx.fill();
  } else {
    ctx.fillRect(x + 14, y + 12, 6, 20);
    ctx.fillRect(x + 24, y + 12, 6, 20);
  }

  // Time of day beside the pause button
  const sunUp = Math.sin(sunPhase()) > 0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x + w + 8, y + 8, 78, 28);
  ctx.fillStyle = sunUp ? '#ffd34d' : '#cfd8ee';
  ctx.beginPath(); ctx.arc(x + w + 22, y + 22, 7, 0, Math.PI * 2); ctx.fill();
  if (!sunUp) { ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.beginPath(); ctx.arc(x + w + 25, y + 20, 6, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
  // Clock pulses orange in the last half hour of the hunt
  if (huntHour() >= DUSK_WARN_HOUR) ctx.fillStyle = `rgba(255,${140 + Math.sin(state.time * 8) * 60},60,1)`;
  ctx.fillText(clockText(), x + w + 34, y + 27);
}

// Target reticle during an air chase. Colour: green when your own speed meets minStrike, red otherwise.
// Fill: relative speed toward minRel (angle of attack). Catchable when green and full (it pulses).
function drawClosingHint() {
  const t = cam.tgt;
  if (!t || t.gone || t.spent || cam.focus < 0.3 || !SPECIES[t.kind].minStrike) return;
  const s = SPECIES[t.kind];
  const fast = bird.speed >= s.minStrike;
  const fill = Math.min(1, Math.hypot(bird.vx - t.vx - windX(t.alt), bird.vy - t.vy) / s.minRel);
  const ready = fast && fill >= 1;
  const x = toScreenX(t.x), y = toScreenY(t.alt);
  const r = 22 + (ready ? Math.sin(state.time * 10) * 2 : 0);

  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = fast ? '#7fd67f' : '#ff5544';
  ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + fill * Math.PI * 2); ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawThermals() {
  const half = W / 2 / cam.zoom;
  const i0 = Math.floor((cam.x - half) / THERMAL_SPACING) - 1, i1 = Math.ceil((cam.x + half) / THERMAL_SPACING) + 1;
  for (let i = i0; i <= i1; i++) {
    const th = thermalCol(i);
    if (!th.on) continue;
    // Faint warm column, plus rising motes whose speed matches the thermal's strength
    const cx = toScreenX(th.x), cw = th.w * cam.zoom * 1.6;
    const col = ctx.createLinearGradient(cx - cw, 0, cx + cw, 0);
    col.addColorStop(0, 'rgba(255,225,170,0)');
    col.addColorStop(0.5, 'rgba(255,225,170,0.12)');
    col.addColorStop(1, 'rgba(255,225,170,0)');
    ctx.fillStyle = col;
    const top = toScreenY(MAX_ALT), bottom = toScreenY(0);
    ctx.fillRect(cx - cw, top, cw * 2, bottom - top);
    ctx.fillStyle = '#fff0c8';
    for (let k = 0; k < 40; k++) {
      const alt = ((k * 37.7) % MAX_ALT + state.time * th.s * 3) % MAX_ALT;
      const x = th.x + Math.sin(k * 2.3 + state.time * 0.8) * th.w * 0.7;
      ctx.globalAlpha = 0.6 * Math.min(1, alt / 30) * Math.min(1, (MAX_ALT - alt) / 60);
      ctx.fillRect(toScreenX(x) - 2, toScreenY(alt) - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }
  // Sinking air: cool motes drifting down
  ctx.fillStyle = '#bed7ff';
  for (let i = i0; i <= i1; i++) {
    const sk = sinkCol(i);
    if (!sk.on) continue;
    for (let k = 0; k < 20; k++) {
      const alt = MAX_ALT - ((k * 41.3) % MAX_ALT + state.time * sk.s * 3) % MAX_ALT;
      const x = sk.x + Math.sin(k * 1.7 + state.time * 0.5) * sk.w * 0.8;
      ctx.globalAlpha = 0.45 * Math.min(1, alt / 30) * Math.min(1, (MAX_ALT - alt) / 60);
      ctx.fillRect(toScreenX(x) - 1.5, toScreenY(alt) - 1.5, 3, 3);
    }
  }
  ctx.globalAlpha = 1;
}

function drawSoundRings() {
  for (const r of state.rings) {
    const k = r.t / 0.8;
    const rad = r.r * Math.sqrt(k);
    ctx.beginPath();
    ctx.ellipse(toScreenX(r.x), toScreenY(r.alt), Math.max(1, rad * cam.zoom), Math.max(1, rad * cam.zoomY), 0, 0, Math.PI * 2);
    ctx.strokeStyle = r.kind === 'brake' ? `rgba(140,210,255,${0.25 * (1 - k)})`
      : r.kind === 'wind' ? `rgba(220,230,255,${0.12 * (1 - k)})`
      : r.kind === 'shot' ? `rgba(255,190,120,${0.6 * (1 - k)})`
      : r.kind === 'screech' ? `rgba(255,120,200,${0.8 * (1 - k)})`
      : `rgba(255,255,255,${0.3 * (1 - k)})`;
    ctx.lineWidth = r.kind === 'screech' ? 4 : 1;
    ctx.stroke();
  }
}

function drawDetectionZones() {
  const hear = hearingRange();
  for (const p of prey) {
    const sn = SENSES[p.kind];
    if (!sn || IGNORE_DETECTION.has(p.kind) || p.gone || p.hidden || p.spent || p.fleeing || p.spookT > 0 || p.scatterT > 0) continue;
    const a = Math.max(0, 1 - Math.abs(p.x - bird.x) / 400);
    if (a <= 0.02) continue;
    const ex = toScreenX(p.x), ey = toScreenY(eyeAlt(p));

    // Vision cone (red); the gap is the blind spot
    const dir = lookAngle(p), range = visionRange(sn);
    ctx.beginPath();
    if (sn.half < Math.PI) ctx.moveTo(ex, ey);
    const N = 24;
    for (let i = 0; i <= N; i++) {
      const ang = dir - sn.half + (2 * sn.half * i) / N;
      const alt = Math.max(0, eyeAlt(p) + Math.sin(ang) * range);
      ctx.lineTo(toScreenX(p.x + Math.cos(ang) * range), toScreenY(alt));
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(255,60,60,${0.1 * a})`; ctx.fill();
    ctx.strokeStyle = `rgba(255,90,90,${0.5 * a})`; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]); ctx.stroke();

    // Hearing ring (orange); grows when you flap or brake
    ctx.beginPath();
    ctx.ellipse(ex, ey, hear * cam.zoom, hear * cam.zoomY, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,170,60,${0.7 * a})`;
    ctx.setLineDash([2, 5]); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawDevils() {
  if (!DUST_DEVILS_ENABLED) return;
  for (const dv of state.devils) {
    const f = devilFade(dv);
    if (f <= 0) continue;
    const bx = toScreenX(dv.x), gy = toScreenY(0);
    if (bx < -200 || bx > W + 200) continue;
    ctx.fillStyle = `rgba(190,160,110,${0.35 * f})`;
    ctx.beginPath(); ctx.ellipse(bx, gy - 2, (dv.w * 1.5) * cam.zoom + 6, 5, 0, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 60; k++) {
      const a = k / 60, alt = a * dv.top;
      const rr = dv.w * (0.3 + a * 1.2);
      const ang = dv.t * 7 + k * 0.9;
      ctx.fillStyle = `rgba(200,170,120,${0.5 * f * (1 - a * 0.7)})`;
      ctx.fillRect(toScreenX(dv.x + Math.cos(ang) * rr) - 2, toScreenY(alt) - 2, 4, 4);
    }
  }
}

function drawBuzzard(x, y, r, s) {
  const f = Math.sin(r.flapT) * (r.mode === 'chase' ? 1 : 0.35);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale((r.vx < 0 ? -1 : 1) * s, s);
  ctx.fillStyle = '#6b4a2e';
  ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(-6, -2 - f * 16); ctx.lineTo(-16, -1 - f * 12); ctx.lineTo(-8, 1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5a3d25';
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9b08a';
  ctx.beginPath(); ctx.ellipse(1, 2, 8, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a3d25';
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-20, -4); ctx.lineTo(-20, 4); ctx.fill();
  ctx.beginPath(); ctx.arc(12, -1, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8c040';
  ctx.beginPath(); ctx.moveTo(15, -2); ctx.lineTo(19, 0); ctx.lineTo(15, 1); ctx.fill();
  ctx.restore();
}

function drawRivals() {
  ctx.filter = OUTLINE;
  for (const r of state.rivals) {
    if (r.gone) continue;
    const x = toScreenX(r.x), y = toScreenY(r.alt);
    if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
    drawBuzzard(x, y, r, 1.5);
  }
  ctx.filter = 'none';
  for (const r of state.rivals) if (!r.gone && r.alertT > 0) drawAlert(toScreenX(r.x), toScreenY(r.alt) - 24);
}

// ---------- Hazard drawing ----------
const HAZARD_SCALE = 1.5;

function drawCat(x, y, c, s) {
  const crouch = c.mode === 'crouch', leap = c.mode === 'leap';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(c.dir * s, s);
  if (leap) ctx.rotate(-Math.atan2(c.vy, Math.abs(c.vx) + 1) * 0.6);
  ctx.fillStyle = '#3b3530';
  const bh = crouch ? 4 : 6;
  ctx.beginPath(); ctx.ellipse(0, -bh, leap ? 12 : 10, crouch ? 3.5 : 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -bh - 3, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7, -bh - 6); ctx.lineTo(8.5, -bh - 11); ctx.lineTo(11, -bh - 6.5);
  ctx.moveTo(10.5, -bh - 6.5); ctx.lineTo(13.5, -bh - 10.5); ctx.lineTo(14, -bh - 5); ctx.fill();
  ctx.strokeStyle = '#3b3530'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -bh); ctx.quadraticCurveTo(-17, -bh - (leap ? 2 : 10), -15, -bh - (leap ? 0 : 14)); ctx.stroke();
  if (!leap) {
    ctx.beginPath(); ctx.moveTo(-6, -bh + 2); ctx.lineTo(-6, 0); ctx.moveTo(6, -bh + 2); ctx.lineTo(6, 0); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(8, -bh + 1); ctx.lineTo(16, -bh + 3); ctx.moveTo(-7, -bh + 1); ctx.lineTo(-15, -bh + 4); ctx.stroke();
  }
  ctx.fillStyle = '#e8d040';
  ctx.beginPath(); ctx.arc(12, -bh - 3.5, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawHunter(x, y, h, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  const face = h.tracking ? Math.sign(toScreenX(h.ax) - x) || 1 : 1;
  ctx.fillStyle = '#4a5a32';
  ctx.fillRect(-4, -14, 3, 14); ctx.fillRect(1, -14, 3, 14);
  ctx.fillRect(-5, -28, 10, 15);
  ctx.fillStyle = '#e0b48a';
  ctx.beginPath(); ctx.arc(0, -32, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e06a1a';
  ctx.fillRect(-6, -36, 12, 3); ctx.fillRect(-4, -39, 8, 3);
  // Rifle points at the current aim
  const ang = h.tracking ? Math.atan2(toScreenY(h.aalt) - (y - 26 * s), toScreenX(h.ax) - x) : face > 0 ? -0.5 : Math.PI + 0.5;
  ctx.translate(0, -25);
  ctx.rotate(ang);
  ctx.fillStyle = '#2a1d12';
  ctx.fillRect(-4, -1.5, 22, 3);
  if (h.flash > 0) {
    ctx.fillStyle = '#ffd36b';
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(28, -5); ctx.lineTo(30, 0); ctx.lineTo(28, 5); ctx.fill();
  }
  ctx.restore();
}

function drawHawk(x, y, h, s) {
  const stoop = h.mode === 'stoop';
  const f = stoop ? 0.15 : Math.sin(h.flapT);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(-h.vy, h.vx) * (stoop ? 1 : 0.4));
  ctx.scale(s, s * (Math.abs(Math.atan2(-h.vy, h.vx)) > Math.PI / 2 ? -1 : 1));
  ctx.fillStyle = '#4e5660';
  ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(-4, -2 - f * 14); ctx.lineTo(-13, -1 - f * 10); ctx.lineTo(-6, 1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3e454e';
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 3.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d9d9d0';
  ctx.beginPath(); ctx.ellipse(1, 1.8, 7, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3e454e';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-19, -3); ctx.lineTo(-19, 3); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -1, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff7a1a';
  ctx.beginPath(); ctx.arc(11, -1.6, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8c040';
  ctx.beginPath(); ctx.moveTo(13, -2); ctx.lineTo(16, 0); ctx.lineTo(13, 0.8); ctx.fill();
  ctx.restore();
}

// Hunters stand behind the grass; cats only show when they break cover (hidden ones just show ears and eyes)
function drawHazardsBehind() {
  const gy = toScreenY(0);
  ctx.filter = OUTLINE;
  for (const h of state.hazards.hunters) {
    const x = toScreenX(h.x);
    if (x < -60 || x > W + 60) continue;
    drawHunter(x, gy, h, HAZARD_SCALE);
  }
  ctx.filter = 'none';
}

function drawHazardsFront() {
  const hz = state.hazards, gy = toScreenY(0);
  for (const c of hz.cats) {
    const x = toScreenX(c.x);
    if (x < -40 || x > W + 40) continue;
    if (c.mode === 'hide') {
      // Eyes open now and then (more often while stalking); the rest of the time the cat is almost invisible
      c.ph ??= Math.random() * 100;
      const blink = Math.sin(state.time * 1.3 + c.ph) + 0.5 * Math.sin(state.time * 3.1 + c.ph * 2);
      const eyesOpen = blink > (c.stalk ? 0.4 : 1.1);
      if (gy > H + 4) continue;
      // Ear tips poke out of the grass; the eyes glint only when open
      const ex = x + c.dir * 11 * HAZARD_SCALE, ey = gy - 4 * HAZARD_SCALE;
      ctx.save(); ctx.translate(ex, ey); ctx.scale(1.3, 1.3);
      ctx.fillStyle = '#4a5a2a';
      ctx.beginPath();
      ctx.moveTo(-5, 1); ctx.lineTo(-3, -8); ctx.lineTo(-0.5, 0);
      ctx.moveTo(0.5, 0); ctx.lineTo(3.5, -8); ctx.lineTo(5.5, 1); ctx.fill();
      if (eyesOpen) {
        ctx.fillStyle = 'rgba(255,225,74,0.25)';
        ctx.beginPath(); ctx.arc(0.25, 1, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe14a';
        ctx.beginPath(); ctx.arc(-2, 1, 1.4, 0, Math.PI * 2); ctx.moveTo(3.9, 1); ctx.arc(2.5, 1, 1.4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      continue;
    }
    ctx.filter = OUTLINE;
    drawCat(x, toScreenY(c.alt), c, HAZARD_SCALE);
    ctx.filter = 'none';
    if (c.alertT > 0) drawAlert(x, toScreenY(c.alt) - 30, '!', 1, 'sight');
  }
  for (const h of hz.hunters) {
    if (state.over && !(h.tracer > 0)) continue;
    const x = toScreenX(h.x), y = gy - 25 * HAZARD_SCALE;
    // The shot line, extended well past the aim point
    const shotEnd = () => {
      const dx = h.ax - h.x, dy = h.aalt - 1.6, len = Math.hypot(dx, dy) || 1;
      return [toScreenX(h.x + dx / len * 600), toScreenY(1.6 + dy / len * 600)];
    };
    if (h.tracer > 0) {
      const [ex, ey] = shotEnd();
      ctx.strokeStyle = `rgba(255,230,140,${h.tracer / 0.3})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
      continue;
    }
    if (h.aim > 0) {
      // About to fire: solid, pulsing laser line along the shot
      const [ex, ey] = shotEnd(), k = 1 - h.aim / HUNTER_AIM_T;
      ctx.strokeStyle = `rgba(255,30,20,${0.55 + 0.35 * Math.sin(state.time * 30)})`; ctx.lineWidth = 2 + 2 * k;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
      const ax = toScreenX(h.ax), ay = toScreenY(h.aalt);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ax, ay, 14 - 6 * k, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    if (!h.tracking || h.reload > 0) continue;
    // Sight line: faint while tracking, brighter as the lock builds
    ctx.strokeStyle = `rgba(255,40,30,${0.12 + 0.6 * h.lock})`; ctx.lineWidth = 1 + h.lock * 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(toScreenX(h.ax), toScreenY(h.aalt)); ctx.stroke();
    ctx.setLineDash([]);
    if (h.lock > 0.05) {
      const ax = toScreenX(h.ax), ay = toScreenY(h.aalt), r = 18 - h.lock * 8;
      ctx.strokeStyle = `rgba(255,40,30,${0.4 + 0.6 * h.lock})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ax, ay, r, 0, Math.PI * 2);
      ctx.moveTo(ax - r - 5, ay); ctx.lineTo(ax - r + 4, ay); ctx.moveTo(ax + r - 4, ay); ctx.lineTo(ax + r + 5, ay);
      ctx.moveTo(ax, ay - r - 5); ctx.lineTo(ax, ay - r + 4); ctx.moveTo(ax, ay + r - 4); ctx.lineTo(ax, ay + r + 5);
      ctx.stroke();
    }
  }
  const h = hz.hawk;
  if (h) {
    const x = toScreenX(h.x), y = toScreenY(h.alt);
    ctx.filter = OUTLINE;
    if (x > -60 && x < W + 60 && y > -60 && y < H + 60) drawHawk(x, y, h, 1.7);
    ctx.filter = 'none';
    if (h.alertT > 0) drawAlert(x, y - 26, '!', 1, 'sight');
  }
}

// Edge-of-screen marker for an off-screen goshawk, and a banner when something is about to get you
function drawHazardWarnings() {
  if (state.over) return;
  const h = state.hazards.hawk;
  if (h && h.mode !== 'leave') {
    const x = toScreenX(h.x), y = toScreenY(h.alt);
    if (x < 0 || x > W || y < 0 || y > H) {
      const { x: bx, y: by } = birdAnchor();
      const dx = x - bx, dy = y - by, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      let t = Infinity;
      if (ux > 0) t = Math.min(t, (W - 30 - bx) / ux);
      if (ux < 0) t = Math.min(t, (30 - bx) / ux);
      if (uy > 0) t = Math.min(t, (H - 30 - by) / uy);
      if (uy < 0) t = Math.min(t, (30 - by) / uy);
      const cx = bx + ux * t, cy = by + uy * t;
      ctx.fillStyle = h.mode === 'stoop' ? '#ff4433' : 'rgba(255,140,60,0.85)';
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(cx, cy); ctx.scale(0.8, 0.8);
      drawHawk(0, 0, { ...h, vx: 1, vy: 0, mode: 'stalk' }, 0.9);
      ctx.restore();
    }
  }
  let warn = null;
  if (h && h.mode === 'stoop') warn = h.commit ? 'GOSHAWK STRIKING — DIVE OR CLIMB NOW!' : 'GOSHAWK STOOPING — break away when it commits (!)';
  const hs = state.hazards.hunters;
  const lock = Math.max(0, ...hs.filter(x => x.tracking && x.reload <= 0).map(x => x.lock));
  if (lock > 0.35) warn = 'HUNTER TRACKING YOU — fly faster or get out of range!';
  if (hs.some(x => x.aim > 0)) warn = 'HUNTER AIMING — change course NOW!';
  if (!warn) return;
  ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  const tw = ctx.measureText(warn).width + 28;
  ctx.fillStyle = `rgba(150,10,10,${0.55 + 0.25 * Math.sin(state.time * 12)})`;
  ctx.fillRect(W / 2 - tw / 2, H - 120, tw, 30);
  ctx.fillStyle = '#fff';
  ctx.fillText(warn, W / 2, H - 99);
}

// Storm darkening, rain and lightning; plus night and golden-hour tints over the world
function drawAtmosphere() {
  const d = daylight(), tw = twilight(), s = state.storm;
  if (d < 1) { ctx.fillStyle = `rgba(8,12,35,${0.3 * (1 - d)})`; ctx.fillRect(0, 0, W, H); }
  if (tw > 0) { ctx.fillStyle = `rgba(255,140,60,${0.1 * tw})`; ctx.fillRect(0, 0, W, H); }
  if (s.k > 0.01) {
    ctx.fillStyle = `rgba(25,30,45,${0.4 * s.k})`;
    ctx.fillRect(0, 0, W, H);
    const slant = windX(bird.alt) / 25;
    ctx.strokeStyle = `rgba(200,210,230,${0.45 * s.k})`; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < Math.round(260 * s.k); i++) {
      const y = (hash(i * 1.3) * H + state.time * 900) % H;
      const x = ((hash(i * 2.9) * W + y * slant) % W + W) % W;
      ctx.moveTo(x, y); ctx.lineTo(x + slant * 14, y + 14);
    }
    ctx.stroke();
  }
  if (s.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${s.flash * 4})`; ctx.fillRect(0, 0, W, H); }
}

function drawCrashSmoke() {
  if (!state.crash) return;
  ctx.save();
  for (const puff of state.crash.smoke) {
    const age = puff.maxLife - puff.life;
    ctx.globalAlpha = Math.min(1, age / 0.12) * Math.max(0, puff.life / puff.maxLife) * 0.65;
    ctx.fillStyle = '#aaa49b';
    ctx.beginPath();
    ctx.ellipse(toScreenX(puff.x), toScreenY(puff.alt), puff.radius * cam.zoom, puff.radius * cam.zoomY, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- Recap & Roost screens ----------
function drawPanel(x, y, w, h) {
  ctx.fillStyle = 'rgba(12,20,34,0.94)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,211,77,0.6)'; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function drawButton(x, y, w, h, label, onClick, { enabled = true, primary = false, font = 'bold 15px sans-serif' } = {}) {
  uiButtons.push({ x, y, w, h, onClick, enabled });
  const hover = enabled && mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.fillStyle = !enabled ? '#333a44' : primary ? (hover ? '#ffe07a' : '#ffd34d') : (hover ? '#41698f' : '#2c4b69');
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = enabled ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = !enabled ? '#7a828c' : primary ? '#2a1d00' : '#fff';
  ctx.font = font; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 5, w - 8);
}

function groupCatches(catches) {
  const groups = new Map();
  for (const c of catches) {
    const kind = c.targetKind || c.kind;
    const key = kind + (c.turtleHit ? ':turtle' : '');
    if (!groups.has(key)) groups.set(key, { kind, turtleHit: !!c.turtleHit, count: 0, pts: 0, tags: new Set() });
    const g = groups.get(key);
    g.count += c.count || 1;
    g.pts += c.pts;
    for (const t of c.tags || []) {
      const name = t.split(' ')[0];
      if (name !== 'Repeat' && name !== 'Turtle') g.tags.add(name);
    }
  }
  return [...groups.values()].sort((a, b) => b.pts - a.pts);
}
const catchName = g => g.kind === 'buzzard' ? 'Buzzard' : HAZARD_NAME[g.kind] ?? SPECIES[g.kind].name;

function drawRecap() {
  const r = state.recap;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  const groups = groupCatches(r.catches);
  const rowH = 40, pw = Math.min(W - 40, 640);
  const fixedH = 250 + r.records.length * 22;
  const maxRows = Math.max(1, Math.floor((H - 40 - fixedH) / rowH));
  const rows = [...groups.map(g => ({ g })), ...r.steals.map(s => ({ s }))].slice(0, maxRows);
  const ph = fixedH + Math.max(1, rows.length) * rowH;
  const x0 = (W - pw) / 2, y0 = Math.max(20, (H - ph) / 2);
  drawPanel(x0, y0, pw, ph);

  ctx.textAlign = 'center';
  const ended = { crash: 'Crashed', cat: 'Caught by a cat', hunter: 'Shot by a hunter', hawk: 'Taken by a goshawk' }[r.reason];
  ctx.fillStyle = ended ? '#ff7766' : '#ffd34d';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText(`Day ${r.day} — ${ended ? `${ended} at ${r.clock}` : 'Sunset'}`, W / 2, y0 + 42);
  const count = r.catches.reduce((n, c) => n + (c.count || 1), 0);
  ctx.fillStyle = '#cfe6f7'; ctx.font = '14px sans-serif';
  ctx.fillText(`${count} catch${count === 1 ? '' : 'es'}  ·  top speed ${r.topSpeed} km/h  ·  best chain ×${r.bestChain.toFixed(1)}`, W / 2, y0 + 68);

  let y = y0 + 92;
  if (!rows.length) {
    ctx.fillStyle = '#aab'; ctx.font = 'italic 15px sans-serif';
    ctx.fillText('No catches today. The early bird gets the rabbit…', W / 2, y + 24);
  }
  for (const row of rows) {
    const g = row.g || { kind: row.s.targetKind || row.s.kind, turtleHit: row.s.turtleHit, count: row.s.count || 1, pts: row.s.pts };
    ctx.globalAlpha = row.s ? 0.55 : 1;
    drawCatchIcon(g.kind, x0 + 36, y + rowH / 2, 15, g.turtleHit);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
    const label = row.s ? `Stolen by a buzzard: ${catchName(g)}` : `${catchName(g)}${g.turtleHit ? ' (turtle strike)' : ''}  ×${g.count}`;
    ctx.fillText(label, x0 + 62, y + (row.s ? 25 : 19));
    if (row.g && g.tags.size) {
      ctx.fillStyle = '#9fd8ff'; ctx.font = '11px sans-serif';
      ctx.fillText([...g.tags].join(' · '), x0 + 62, y + 34);
    }
    ctx.textAlign = 'right';
    ctx.font = 'bold 17px monospace';
    ctx.fillStyle = row.s ? '#ff8877' : '#ffdd55';
    const amt = row.s ? `-$${g.pts}` : `$${g.pts}`;
    ctx.fillText(amt, x0 + pw - 24, y + 26);
    if (row.s) {
      const aw = ctx.measureText(amt).width;
      ctx.strokeStyle = '#ff8877'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x0 + pw - 24 - aw, y + 21); ctx.lineTo(x0 + pw - 24, y + 21); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    y += rowH;
  }
  if (!rows.length) y += rowH;

  y += 8;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0 + 20, y); ctx.lineTo(x0 + pw - 20, y); ctx.stroke();
  const shown = Math.round(r.earned * Math.min(1, uiT / 1.2));
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText('Day earnings', x0 + 24, y + 34);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 28px monospace';
  ctx.fillText(`$${shown}`, x0 + pw - 24, y + 36);
  ctx.textAlign = 'left'; ctx.fillStyle = '#cfe6f7'; ctx.font = '14px sans-serif';
  ctx.fillText(`Wallet: $${r.walletBefore + shown}`, x0 + 24, y + 60);
  y += 72;
  ctx.fillStyle = '#7fd67f'; ctx.font = 'bold 14px sans-serif';
  for (const rec of r.records) { ctx.fillText(`★ ${rec}`, x0 + 24, y + 10); y += 22; }

  drawButton(W / 2 - 110, y0 + ph - 54, 220, 38, 'Go to the roost →', showShop, { primary: true });
}

function drawShop() {
  ctx.fillStyle = 'rgba(4,8,16,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 32px sans-serif';
  ctx.fillText('The Roost', W / 2, 46);
  ctx.fillStyle = '#cfe6f7'; ctx.font = '14px sans-serif';
  ctx.fillText(`Spend your earnings, then head out for day ${progress.day}`, W / 2, 70);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 26px monospace';
  ctx.fillText(`$${progress.money}`, W - 24, 46);
  ctx.fillStyle = '#aab'; ctx.font = '12px sans-serif';
  ctx.fillText('wallet', W - 24, 64);

  const cols = W >= 1080 ? 3 : W >= 720 ? 2 : 1, gap = 12;
  const cw = Math.min(340, (W - 40 - (cols - 1) * gap) / cols);
  const list = shopUpgrades();
  const rowsN = Math.ceil(list.length / cols);
  const ch = clamp((H - 170 - (rowsN - 1) * gap) / rowsN, 70, 100);
  const gx = (W - (cols * cw + (cols - 1) * gap)) / 2, gy = 90;
  list.forEach((u, i) => {
    const x = gx + (i % cols) * (cw + gap), y = gy + Math.floor(i / cols) * (ch + gap);
    const t = tier(u.id), costs = upgradeCosts(u), maxed = t >= costs.length;
    ctx.fillStyle = 'rgba(20,32,50,0.95)'; ctx.fillRect(x, y, cw, ch);
    ctx.strokeStyle = maxed ? 'rgba(127,214,127,0.6)' : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif';
    ctx.fillText(u.name, x + 12, y + 21);
    // Tier pips
    for (let k = 0; k < costs.length; k++) {
      ctx.fillStyle = k < t ? '#ffd34d' : 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(x + cw - 16 - (costs.length - 1 - k) * 14, y + 16, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#9aa7b8'; ctx.font = '11px sans-serif';
    ctx.fillText(u.desc, x + 12, y + 38, cw - 24);
    const textW = cw - 112;
    ctx.fillStyle = '#e8eef5'; ctx.font = '12px sans-serif';
    ctx.fillText(`Now: ${u.stat(t)}`, x + 12, y + ch - 30, textW);
    if (!maxed) {
      ctx.fillStyle = '#7fd67f';
      ctx.fillText(`Next: ${u.stat(t + 1)}`, x + 12, y + ch - 12, textW);
    }
    const cost = maxed ? 0 : costs[t];
    drawButton(x + cw - 92, y + ch - 38, 80, 28, maxed ? 'MAXED' : `$${cost}`, () => buyUpgrade(u.id),
               { enabled: !maxed && progress.money >= cost, primary: !maxed, font: 'bold 14px monospace' });
  });

  drawButton(W / 2 - 120, H - 62, 240, 42, `Start day ${progress.day} →`, startDay, { primary: true, font: 'bold 17px sans-serif' });
  drawButton(16, H - 50, 150, 30, confirmReset ? 'Click again to wipe' : 'Reset progress',
             () => { if (confirmReset) resetProgress(); else confirmReset = true; }, { font: '12px sans-serif' });
  if (progress.best.earned > 0) {
    ctx.textAlign = 'right'; ctx.fillStyle = '#9aa7b8'; ctx.font = '12px sans-serif';
    ctx.fillText(`Best day $${progress.best.earned}  ·  top speed ${progress.best.speed} km/h`, W - 16, H - 30);
  }
}

function draw() {
  uiButtons = [];
  ctx.save();
  if (!state.over && !paused && cam.shake > 0) {
    ctx.translate((Math.random() - 0.5) * cam.shake, (Math.random() - 0.5) * cam.shake);
  }
  drawBackground();
  drawThermals();
  drawDetectionZones();
  prey.forEach(drawPrey);
  drawHazardsBehind();
  drawGrass();
  drawHazardsFront();
  drawFallers();
  drawRivals();
  drawSoundRings();
  ctx.fillStyle = '#ccc';
  for (const p of particles) ctx.fillRect(toScreenX(p.x), toScreenY(p.alt), 3, 3);
  drawCrashSmoke();
  drawEyases();
  drawFeatherFx();
  if (!state.over) drawBird();
  if (bird.inWater) {
    // Water over the submerged bird
    const l = bird.inWater, gy = toScreenY(0);
    ctx.fillStyle = 'rgba(40,90,140,0.35)';
    ctx.fillRect(toScreenX(l.x0), gy, toScreenX(l.x0 + l.w) - toScreenX(l.x0), toScreenY(-l.depth) - gy);
    if (!state.over) drawBreath(toScreenX(bird.x), toScreenY(bird.alt) - 26);
  }
  ctx.restore();
  drawAtmosphere();
  // Whiteout while flying through a cloud
  if (state.fog > 0.01) {
    ctx.fillStyle = `rgba(236,241,247,${0.7 * state.fog})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (timeScale < 0.98) {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, `rgba(0,10,30,${(1 - timeScale) * 0.9})`);
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }
  drawPreyIndicators();
  drawClosingHint();
  drawBirdLens();
  drawSunIndicator();
  if (screen === 'hunt') drawHazardWarnings();
  if (state.crash && state.crash.t >= CRASH_REVEAL_DELAY) {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(1, (state.crash.t - CRASH_REVEAL_DELAY) / 0.5) * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (screen === 'hunt') {
    drawHUD();
    if (paused) drawPausePanel();
    if (!state.over) drawPauseButton();
  } else if (screen === 'recap') {
    drawRecap();
  } else {
    drawShop();
  }
}

// ---------- Loop ----------
let last = performance.now();
const SLOWMO_SCALE = 0.55;
let timeScale = 1;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  // Braking slows time a little for precise pull-outs and air strikes
  const slow = !paused && !state.over && (bird.mode === 'BRAKE' || (mouse.aiming && bird.carrying));
  timeScale += ((slow ? SLOWMO_SCALE : 1) - timeScale) * Math.min(1, dt * 6);
  update(dt * timeScale);
  if (screen !== 'hunt') uiT += dt;
  draw();
  requestAnimationFrame(loop);
}
reset();
// Returning players start in the roost so they can spend what they earned last session
if (progress.day > 1) showShop();
requestAnimationFrame(loop);
</script>
